<script>
/* ============================================================================
 * Cairn · core.js
 * ---------------------------------------------------------------------------
 * 数据模型、本地存储、通用工具。
 *
 * 数据全部保存在浏览器 localStorage（键名 cairn.v1）。不需要登录、不需要
 * 云端、不做任何网络请求 —— 这样在机房断网的电脑上表现完全一致。
 * ==========================================================================*/

var APP_VERSION = '2.3.0';
var STORE_KEY = 'cairn.v1';      /* 存储键名保持不变，靠 data.v 字段做迁移 */
var DATA_VERSION = 2;

/* ---------------------------------------------------------------------------
 * 默认设置
 * -------------------------------------------------------------------------*/
function defaultSettings() {
  return {
    lang: 'zh',
    theme: 'light',            /* light | dim */
    density: 'normal',         /* normal | compact */
    motion: 'full',            /* full | reduced */
    focusLen: 25,              /* 一分钟为一单位 */
    breakLen: 5,
    brainDumpFirst: false,
    aiKey: '',
    aiBase: 'https://api.deepseek.com',
    aiModel: 'deepseek-chat',
    lastEngine: 'local',       /* local | ai */

    /* --- v2.0 新增 --- */
    onboarded: false,          /* 是否走完首次引导 */
    weeklyQuota: 3,            /* 一周里要达成几天，才算「本周石堆立住了」 */
    autoReflow: true,          /* 时间线是否自动重排 */
    calibrate: true,           /* 是否按历史偏差自动校正预估耗时 */
    lastSeenAt: null           /* 上次打开的时间戳，用于「欢迎回来」判断 */
  };
}

/* ---------------------------------------------------------------------------
 * 状态
 * -------------------------------------------------------------------------*/
var State = {
  settings: defaultSettings(),
  tasks: [],
  blocks: [],
  sessions: [],
  ideas: [],
  events: [],

  /* --- v2.0 新增：为「进度」「周配额」「估时自学习」提供数据基础 --- */
  stats: null,                 /* 按日聚合 + 估时偏差校准，由 stats.js 创建 */

  view: 'breakdown',           /* breakdown | now | progress | timeline | focus | ideas | settings */
  focusIdx: -1,                /* 「当前」视图里正在看第几条任务 */
  draftSteps: null,            /* 拆解结果，尚未加进任务列表 */
  draftSource: '',
  draftEngine: '',
  focus: {                     /* 计时器运行时状态，不持久化 */
    running: false,
    remaining: 0,
    total: 0,
    taskId: null,
    stepId: null,
    label: '',
    tick: null,
    startedAt: 0
  },

  /* --- v2.0 新增：只在内存里存在的界面态 --- */
  welcomeBack: null,           /* 「欢迎回来」卡片的内容；null = 不显示 */
  milestone: null,             /* 待展示的里程碑；null = 没有 */
  onboardStep: 0,              /* 首次引导当前第几屏 */

  ui: { toast: null, modal: null }
};

/* ---------------------------------------------------------------------------
 * 本地存储
 * -------------------------------------------------------------------------*/
function loadState() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    var data = JSON.parse(raw);

    /* 旧版本没有的字段用默认值补齐 —— 这样 v1 的数据能直接升到 v2，
     * 用户不需要重新设置任何东西。 */
    State.settings = Object.assign(defaultSettings(), data.settings || {});
    State.tasks = Array.isArray(data.tasks) ? data.tasks : [];
    State.blocks = Array.isArray(data.blocks) ? data.blocks : [];
    State.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    State.ideas = Array.isArray(data.ideas) ? data.ideas : [];
    State.events = Array.isArray(data.events) ? data.events : [];

    /* v2 新增：统计层。缺失（即从 v1 升级上来）时由 stats.js 从现有数据重建，
     * 而不是给一个空对象 —— 否则用户的历史会凭空消失。 */
    State.stats = migrateStats(data.stats, data.v || 1);
    restoreFocus(data.focusCheckpoint);

    return true;
  } catch (e) {
    console.warn('读取本地数据失败，使用空状态', e);
    return false;
  }
}

var _saveTimer = null;
function saveState(immediate) {
  if (_saveTimer && !immediate) return;
  var doIt = function () {
    _saveTimer = null;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: DATA_VERSION,
        settings: State.settings,
        tasks: State.tasks,
        blocks: State.blocks,
        sessions: State.sessions,
        ideas: State.ideas,
        events: State.events,
        stats: State.stats,
        focusCheckpoint: focusCheckpoint(),
        savedAt: new Date().toISOString()
      }));
    } catch (e) {
      /* 隐私模式或配额满：给用户一个明确提示，而不是静默丢数据 */
      toast('无法写入本地存储：' + (e && e.name ? e.name : '未知错误'), 'warn');
    }
  };
  if (immediate) { doIt(); return; }
  _saveTimer = setTimeout(doIt, 220);
}

function resetAll() {
  resetFocus();
  State.tasks = []; State.blocks = []; State.sessions = []; State.ideas = []; State.events = [];
  State.draftSteps = null;
  State.settings = defaultSettings();
  State.focusIdx = -1;
  State.stats = newStats();
  State.welcomeBack = null;
  State.milestone = null;
  State.onboardStep = 0;
  saveState(true);
}

/* ---------------------------------------------------------------------------
 * 通用工具
 * -------------------------------------------------------------------------*/
function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + '_' +
         Math.random().toString(36).slice(2, 7);
}

function pad2(n) { return n < 10 ? '0' + n : String(n); }

/* 稳定的伪随机：同样的输入永远得到同样的输出，避免每次刷新拆解结果都变 */
function hashStr(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0);
}

function pick(list, seedStr) {
  if (!list || !list.length) return null;
  return list[hashStr(seedStr || '') % list.length];
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function todayKey(d) {
  var t = d || new Date();
  return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
}

function isToday(iso) {
  if (!iso) return false;
  return todayKey(new Date(iso)) === todayKey();
}

function startOfDay(d) {
  var t = new Date(d || Date.now());
  t.setHours(0, 0, 0, 0);
  return t;
}

function minutesToHM(m) {
  m = Math.max(0, Math.round(m || 0));
  var h = Math.floor(m / 60), mm = m % 60;
  return { h: h, m: mm };
}

/* 时长文案：45 → "45 分钟"，75 → "1 小时 15 分" */
function fmtDuration(m) {
  var hm = minutesToHM(m);
  if (hm.h <= 0) return hm.m + ' ' + t('min');
  if (hm.m === 0) return hm.h + ' ' + t('hour');
  return hm.h + ' ' + t('hour') + ' ' + hm.m + ' ' + t('min');
}

/* 时钟：09:30（中英通用 24 小时制，避免上午/下午带来的额外阅读负担） */
function fmtClock(minOfDay) {
  var m = ((Math.round(minOfDay) % 1440) + 1440) % 1440;
  return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
}

function nowMinOfDay() {
  var d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

/* ---------------------------------------------------------------------------
 * 任务
 * -------------------------------------------------------------------------*/
function makeStep(title, minutes, energy, source) {
  return {
    id: uid('st'),
    title: String(title || '').trim(),
    minutes: minutes || 5,
    energy: energy || 'low',
    done: false,
    doneAt: null,
    source: source || 'engine'
  };
}

function makeTask(title, opts) {
  opts = opts || {};
  return {
    id: uid('tk'),
    title: String(title || '').trim(),
    createdAt: new Date().toISOString(),
    lastTouchedAt: null,           /* v2：最近一次被推进的时间，用于「从这里继续」 */
    done: false,
    doneAt: null,
    energy: opts.energy || null,
    estimateMin: opts.estimateMin || null,
    steps: (opts.steps || []).map(function (s) {
      return makeStep(s.title, s.minutes, s.energy, s.source);
    }),
    engine: opts.engine || 'local',
    category: opts.category || null,   /* v2：拆解引擎给出的分类，供估时自学习按类聚合 */
    source: opts.source || null,
    notes: opts.notes || ''
  };
}

/* 任务加入「今天」：按序号排在已有任务之后 */
function addTask(task) {
  State.tasks.push(task);
  logEvent('task_add', { id: task.id, steps: task.steps.length, engine: task.engine });
  saveState();
  return task;
}

function findTask(id) {
  for (var i = 0; i < State.tasks.length; i++) if (State.tasks[i].id === id) return State.tasks[i];
  return null;
}

/* 「今天」的清单：未完成优先，其次按创建时间 */
function todayTasks() {
  return State.tasks
    .filter(function (tk) { return !tk.done; })
    .sort(function (a, b) { return a.createdAt < b.createdAt ? -1 : 1; });
}

/* 单任务视图要展示的那一条。刻意只给一条 —— 这是整个产品的核心主张。 */
function currentTask() {
  var list = todayTasks();
  if (!list.length) return null;
  if (State.focusIdx < 0 || State.focusIdx >= list.length) State.focusIdx = 0;
  return list[State.focusIdx];
}

function taskProgress(task) {
  var total = task.steps.length;
  var done = task.steps.filter(function (s) { return s.done; }).length;
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function nextStep(task) {
  for (var i = 0; i < task.steps.length; i++) if (!task.steps[i].done) return task.steps[i];
  return null;
}

/* 完成一个小步骤；全部完成时任务自动结束 */
function toggleStep(task, stepId) {
  var step = null;
  task.steps.forEach(function (s) { if (s.id === stepId) step = s; });
  if (!step) return;
  step.done = !step.done;
  step.doneAt = step.done ? new Date().toISOString() : null;

  var p = taskProgress(task);
  logEvent(step.done ? 'step_done' : 'step_undo', { taskId: task.id, stepId: step.id });

  /* v2.0：每完成一步就落进统计层。
   * 这是「进度」视图、周配额、以及石堆成长的数据来源。
   * 撤销一步也对称地记录下来，避免统计与实际不符。 */
  if (typeof recordStepCompletion === 'function') {
    recordStepCompletion(task, step, step.done);
  }

  if (p.total > 0 && p.done === p.total && !task.done) {
    task.done = true;
    task.doneAt = new Date().toISOString();
    logEvent('task_done', { id: task.id, steps: p.total });
    if (typeof recordTaskCompletion === 'function') recordTaskCompletion(task);
  } else if (task.done && p.done < p.total) {
    task.done = false;
    task.doneAt = null;
  }
  saveState();
  return { taskCompleted: task.done, progress: p };
}

/* 完成整条任务 */
function completeTask(task) {
  task.steps.forEach(function (s) { s.done = true; s.doneAt = s.doneAt || new Date().toISOString(); });
  task.done = true;
  task.doneAt = new Date().toISOString();
  logEvent('task_done', { id: task.id, steps: task.steps.length });
  saveState();
}

/* 情绪安全：跳过不等于失败。不做任何扣分、不断签、不显示"未完成"。 */
function skipTask(task) {
  task.done = false;
  task.skippedAt = new Date().toISOString();
  logEvent('task_skip', { id: task.id });
  saveState();
}

function deleteTask(task) {
  State.tasks = State.tasks.filter(function (tk) { return tk.id !== task.id; });
  State.blocks = State.blocks.filter(function (b) { return b.taskId !== task.id; });
  logEvent('task_delete', { id: task.id });
  saveState();
}

/* ---------------------------------------------------------------------------
 * 时间块
 * -------------------------------------------------------------------------*/
function makeBlock(startMin, durMin, title, opts) {
  opts = opts || {};
  return {
    id: uid('bl'),
    date: opts.date || todayKey(),
    start: Math.max(0, Math.round(startMin)),
    dur: Math.max(5, Math.round(durMin)),
    title: String(title || '').trim() || t('timelinePlan'),
    taskId: opts.taskId || null,
    energy: opts.energy || null,
    done: false,
    engine: opts.engine || 'local'
  };
}

function todayBlocks() {
  var key = todayKey();
  return State.blocks
    .filter(function (b) { return b.date === key; })
    .sort(function (a, b) { return a.start - b.start; });
}

function addBlock(block) {
  State.blocks.push(block);
  logEvent('block_add', { start: block.start, dur: block.dur });
  saveState();
  return block;
}

function deleteBlock(id) {
  State.blocks = State.blocks.filter(function (b) { return b.id !== id; });
  saveState();
}

/* 两个时间块是否重叠 */
function blocksOverlap(a, b) {
  return a.start < b.start + b.dur && b.start < a.start + a.dur;
}

function findOverlaps(block, excludeId) {
  return todayBlocks().filter(function (b) {
    return b.id !== excludeId && b.id !== block.id && blocksOverlap(block, b);
  });
}

/* 今天还剩多少没被安排的时间（按 08:00–23:00 的可支配区间算） */
function todayLoad() {
  var blocks = todayBlocks();
  var planned = blocks.reduce(function (sum, b) { return sum + b.dur; }, 0);
  var span = 15 * 60;                     /* 08:00 → 23:00 */
  return { planned: planned, free: Math.max(0, span - planned), span: span };
}

/* ---------------------------------------------------------------------------
 * 专注记录
 * -------------------------------------------------------------------------*/
function logSession(minutes, taskId, label, completed, stepId, actualSeconds) {
  var s = {
    id: uid('ss'),
    at: new Date().toISOString(),
    date: todayKey(),
    minutes: Math.round(minutes),
    taskId: taskId || null,
    stepId: stepId || null,          /* v2：关联到具体步骤，供估时自学习使用 */
    label: label || '',
    completed: !!completed,
    /* 实际坐在计时器前的时间（秒）。用它而不是 minutes 去校准估时，
     * 因为 minutes 是四舍五入后的整数，短步骤会引入很大误差。 */
    actualSeconds: typeof actualSeconds === 'number' ? Math.round(actualSeconds) : null
  };
  State.sessions.push(s);
  logEvent('focus', { minutes: s.minutes, completed: !!completed });
  /* v2：专注时长也要进统计层（进步的日热力条会用到） */
  if (typeof recordFocusSession === 'function') recordFocusSession(s);
  saveState(true);
  return s;
}

function todayFocus() {
  var key = todayKey();
  var list = State.sessions.filter(function (s) { return s.date === key; });
  return {
    minutes: list.reduce(function (a, s) { return a + s.minutes; }, 0),
    rounds: list.length
  };
}

/* ---------------------------------------------------------------------------
 * 灵感收集箱
 * -------------------------------------------------------------------------*/
function makeIdea(text) {
  return {
    id: uid('id'),
    text: String(text || '').trim(),
    createdAt: new Date().toISOString(),
    converted: false,
    taskId: null
  };
}

function addIdea(text) {
  var idea = makeIdea(text);
  if (!idea.text) return null;
  State.ideas.unshift(idea);
  logEvent('idea_add', {});
  saveState();
  return idea;
}

/* 灵感 → 任务：先随手记下的东西，等有空再决定要不要做 */
function ideaToTask(idea) {
  var task = makeTask(idea.text, { source: 'brain_dump' });
  addTask(task);
  idea.converted = true;
  idea.taskId = task.id;
  logEvent('idea_convert', { id: idea.id });
  saveState(true);
  return task;
}

function deleteIdea(id) {
  State.ideas = State.ideas.filter(function (i) { return i.id !== id; });
  saveState();
}

/* ---------------------------------------------------------------------------
 * 评估事件记录
 * ---------------------------------------------------------------------------
 * 只记录"发生了什么 + 数量 + 耗时"，绝不记录用户输入的内容本身。
 * 用途：课程作业里的可用性评估（任务启动耗时、拆解成功率等）。
 * -------------------------------------------------------------------------*/
function logEvent(type, data) {
  State.events.push({
    t: new Date().toISOString(),
    type: type,
    data: data || {}
  });
  /* 防止无限增长 */
  if (State.events.length > 4000) State.events = State.events.slice(-3000);
}

/* 关键指标：从"打开拆解页"到"出现第一步"的耗时，是衡量任务启动阻力的核心数据 */
function logBreakdownStart(text) {
  State._bdStart = { at: Date.now(), len: (text || '').length };
  logEvent('breakdown_start', { len: (text || '').length });
}

function logBreakdownDone(stepCount, engine) {
  var ms = State._bdStart ? (Date.now() - State._bdStart.at) : null;
  logEvent('breakdown_done', { steps: stepCount, engine: engine, ms: ms });
  return ms;
}

/* ---------------------------------------------------------------------------
 * 示例数据 —— 课堂演示用，一键铺满
 * -------------------------------------------------------------------------*/
function loadSampleData() {
  resetAllSilent();
  State.settings.sample = true;

  /* 任务带上分类 —— 估时自学习是按分类聚合的，示例数据也得有 */
  var t1 = addTask(makeTask('写课程论文', {
    energy: 'high', estimateMin: 35, engine: 'local', category: '写作类'
  }));
  t1.steps = [
    makeStep('打开文档，只写下标题', 5, 'low'),
    makeStep('列出 3 个想写的小标题', 10, 'high'),
    makeStep('给每个小标题找 1 条资料', 15, 'high'),
    makeStep('只写第一段，不修改', 15, 'high')
  ];

  var t2 = addTask(makeTask('准备小组汇报', { energy: 'high', estimateMin: 25, category: '汇报类' }));
  t2.steps = [
    makeStep('确认汇报时长和分工', 5, 'high'),
    makeStep('把要讲的点写成 5 条', 10, 'high'),
    makeStep('对着空气讲一遍', 10, 'low')
  ];

  var t3 = addTask(makeTask('收拾房间', { energy: 'low', estimateMin: 15, category: '家务类' }));
  t3.steps = [
    makeStep('只收桌面上的杯子', 5, 'low'),
    makeStep('把衣服丢进洗衣篮', 5, 'low'),
    makeStep('设 10 分钟，能收多少收多少', 10, 'low')
  ];

  var base = 9 * 60;
  addBlock(makeBlock(base, 25, '写论文第一段', { taskId: t1.id, energy: 'high' }));
  addBlock(makeBlock(base + 30, 15, '休息 + 喝水', { energy: 'low' }));
  addBlock(makeBlock(base + 60, 25, '准备汇报要点', { taskId: t2.id, energy: 'high' }));
  addBlock(makeBlock(base + 150, 30, '收拾房间', { taskId: t3.id, energy: 'low' }));

  State.ideas = [
    makeIdea('想给计时器加一个海浪声（先记下，不急着做）'),
    makeIdea('问老师能不能用这个当期末项目'),
    makeIdea('日历视图好像可以拖拽，去查一下怎么做')
  ];

  /* 专注记录走正常的 logSession 通道，这样统计层也会被正确更新。
   * 早期版本是直接往 State.sessions 里 push 对象，绕过了统计层 ——
   * 结果是示例数据下「进度」页永远是空的。 */
  State.sessions = [];
  logSession(25, t1.id, '写论文第一段', true, null, 25 * 60);
  logSession(15, null, '', true, null, 15 * 60);
  /* 把时间往前挪，让两条记录看起来是过去发生的 */
  if (State.sessions[0]) State.sessions[0].at = new Date(Date.now() - 3600e3).toISOString();
  if (State.sessions[1]) State.sessions[1].at = new Date(Date.now() - 1800e3).toISOString();

  /* 让「进度」页有内容可看：走真实的 toggleStep 通道堆几块石头，
   * 而不是直接改 done 标志 —— 否则统计层收不到任何东西。
   * 顺序上先布置好较早日期的记录，再补今天的，避免时间线错乱。 */
  seedSampleHistory();

  State.focusIdx = 0;
  saveState(true);
  return true;
}

/* 为示例数据铺一段"过去两周努力过"的历史。
 * 直接写 State.stats.days —— 这是**刻意的**：示例数据的目的是让界面有内容可看，
 * 不是在伪造用户行为。真实使用中的记录一律走 recordStepCompletion 通道。 */
function seedSampleHistory() {
  var st = ensureStats();
  var pattern = [3, 0, 5, 0, 0, 4, 6, 0, 2, 5, 0, 7, 3, 0];   /* 最近 14 天的石头数 */
  var today = todayKey();

  pattern.forEach(function (steps, idx) {
    var d = new Date();
    d.setDate(d.getDate() - (13 - idx));
    var key = todayKey(d);
    if (key === today) return;                    /* 今天由后面的真实操作产生 */
    if (steps === 0) return;                      /* 空白日不写记录 —— 界面也不该标记 */
    st.days[key] = {
      steps: steps,
      tasks: steps >= 5 ? 1 : 0,
      focusMin: steps >= 5 ? 25 : (steps >= 3 ? 15 : 0)
    };
    st.total.steps += steps;
    st.total.tasks += steps >= 5 ? 1 : 0;
    st.total.focusMin += steps >= 5 ? 25 : (steps >= 3 ? 15 : 0);
  });

  /* 让累计数达到能触发前两个里程碑的量级，这样演示时能看到石堆成形 */
  st.total.tasks = Math.max(st.total.tasks, 5);
  st.total.focusMin = Math.max(st.total.focusMin, 190);

  if (!st.firstDay || st.firstDay > Object.keys(st.days).sort()[0]) {
    st.firstDay = Object.keys(st.days).sort()[0] || today;
  }

  /* 本周：让前三天已达成，这样周配额条不是全空的。
   * 注意 currentWeek() 返回的就是那 7 天的数组本身（不是 {week:[...]} 对象）——
   * 这里曾经误写成 wk.week.forEach，导致整个 boot 抛异常、界面全白。 */
  var wk = currentWeek();
  wk.forEach(function (day, i) {
    if (day.isFuture || day.isToday) return;
    if (i >= 3) return;
    st.days[day.date] = st.days[day.date] || { steps: 0, tasks: 0, focusMin: 0 };
    if (st.days[day.date].steps === 0) {
      st.days[day.date].steps = 2;
    }
  });

  /* 累计数最后统一抬到 47 —— 这是为了让演示时的石堆已有形状。
   * 放在最后是为了让上面按日铺的数据不被这个下限覆盖掉。 */
  st.total.steps = Math.max(st.total.steps, 47);

  /* 示例数据也要跑一次里程碑检查，否则「进度」页的里程碑区会全是灰的，
   * 看起来像功能没做完。 */
  checkMilestones();
  State.milestone = null;   /* 示例数据不该一进来就弹里程碑卡片 */

  /* 估时校准的样例：写作类一贯超时，让「它对你的了解」有内容可显示 */
  st.calib['写作类'] = { est: 45, act: 104, n: 3 };
  st.calib['家务类'] = { est: 20, act: 14, n: 2 };

  refreshWeekCache();
}

function resetAllSilent() {
  State.tasks = []; State.blocks = []; State.sessions = []; State.ideas = []; State.events = [];
  State.focusIdx = -1; State.draftSteps = null;
  State.stats = newStats();
  State.welcomeBack = null;
  State.milestone = null;
}

</script>
<script>
/* ============================================================================
 * Cairn · stats.js   （v2.0 新增）
 * ---------------------------------------------------------------------------
 * 统计与激励层。它是「进度」视图、「不灭的石堆」周配额、里程碑、以及
 * 「估时自学习」共同的数据地基。
 *
 * 设计立场（对应优化方案第 4 章）：
 *   · 只记录努力，从不记录缺席 —— 数据结构里根本没有「断签」这个字段
 *   · 总石堆只增不减 —— 任何操作都不会让它变少，这是对 RSD 最根本的保护
 *   · 宽限是默认值 —— 周配额把容错写进规则，不需要用户花任何代价购买
 *
 * 数据形状（存在 State.stats，随主存储一起持久化）：
 *   {
 *     firstDay: '2026-10-14',       第一次使用的日期
 *     days: { '2026-10-14': { steps: 4, tasks: 1, focusMin: 25 } },
 *     total: { steps: 120, tasks: 8, focusMin: 640 },   ← 只增不减
 *     calib: { coding: { est: 60, act: 138, n: 3 } },   ← 估时校准
 *     milestones: ['first_stone', 'ten_stones'],
 *     weeks: { '2026-W42': 3 }       ← 每周达成天数（缓存，可由 days 重算）
 *   }
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * 创建 / 迁移
 * -------------------------------------------------------------------------*/
function newStats() {
  return {
    firstDay: todayKey(),
    days: {},
    total: { steps: 0, tasks: 0, focusMin: 0 },
    calib: {},
    milestones: [],
    weeks: {}
  };
}

/* 从 v1 升级上来时，stats 不存在。这里用现有的 sessions / tasks 尽量重建，
 * 而不是给一个空壳 —— 否则用户升级后会以为自己的历史丢了。
 * （v1 没有按日记录步骤完成，所以只能重建专注时长与已完成任务数。）*/
function migrateStats(existing, fromVersion) {
  if (existing && typeof existing === 'object' && existing.total && existing.days) {
    /* 补齐可能缺失的字段（未来版本新增字段时同样受益） */
    var s = existing;
    s.days = s.days || {};
    s.total = Object.assign({ steps: 0, tasks: 0, focusMin: 0 }, s.total || {});
    s.calib = s.calib || {};
    s.milestones = Array.isArray(s.milestones) ? s.milestones : [];
    s.weeks = s.weeks || {};
    s.firstDay = s.firstDay || todayKey();
    return s;
  }

  var st = newStats();

  /* 从历史专注记录重建 */
  (State.sessions || []).forEach(function (sess) {
    if (!sess || !sess.date) return;
    st.days[sess.date] = st.days[sess.date] || { steps: 0, tasks: 0, focusMin: 0 };
    st.days[sess.date].focusMin += Math.round(sess.minutes || 0);
    st.total.focusMin += Math.round(sess.minutes || 0);
  });

  /* 从已完成任务重建「完成步骤数」的近似值。
   * 这是近似而非精确：v1 没有记录每一步的完成日期，所以把它们归到任务完成日。 */
  (State.tasks || []).forEach(function (tk) {
    if (!tk || !tk.done || !tk.doneAt) return;
    var key = todayKey(new Date(tk.doneAt));
    var n = (tk.steps || []).length;
    st.days[key] = st.days[key] || { steps: 0, tasks: 0, focusMin: 0 };
    st.days[key].steps += n;
    st.days[key].tasks += 1;
    st.total.steps += n;
    st.total.tasks += 1;
    if (!st.firstDay || key < st.firstDay) st.firstDay = key;
  });

  if (fromVersion < 2) {
    console.info('Cairn: 已从 v' + fromVersion + ' 升级数据结构，历史统计已尽量重建');
  }
  return st;
}

/* 保证 State.stats 一定存在（任何入口都先调一次，避免 null 引用） */
function ensureStats() {
  if (!State.stats || typeof State.stats !== 'object') State.stats = newStats();
  if (!State.stats.days) State.stats.days = {};
  if (!State.stats.total) State.stats.total = { steps: 0, tasks: 0, focusMin: 0 };
  if (!State.stats.calib) State.stats.calib = {};
  if (!Array.isArray(State.stats.milestones)) State.stats.milestones = [];
  if (!State.stats.weeks) State.stats.weeks = {};
  return State.stats;
}

/* ---------------------------------------------------------------------------
 * 写入：完成 / 撤销一个步骤
 * -------------------------------------------------------------------------*/
function recordStepCompletion(task, step, done) {
  var st = ensureStats();
  var key = todayKey();
  var day = st.days[key] || (st.days[key] = { steps: 0, tasks: 0, focusMin: 0 });
  var delta = done ? 1 : -1;

  day.steps = Math.max(0, day.steps + delta);
  /* 总石堆只增不减：撤销当天的一步可以把当天数字减回去（否则当天显示就不准了），
   * 但累计总数不做减法 —— 用户"曾经堆过"这个事实不该被抹掉。 */
  if (done) st.total.steps += 1;

  /* 估时校准：把这一步的预估耗时与真实耗时记下来 */
  if (done) calibrateFromStep(task, step);

  refreshWeekCache();
  checkMilestones();
  saveState();
}

function recordTaskCompletion(task) {
  var st = ensureStats();
  var key = todayKey();
  var day = st.days[key] || (st.days[key] = { steps: 0, tasks: 0, focusMin: 0 });
  day.tasks += 1;
  st.total.tasks += 1;
  saveState();
}

function recordFocusSession(sess) {
  var st = ensureStats();
  var key = sess.date || todayKey();
  var day = st.days[key] || (st.days[key] = { steps: 0, tasks: 0, focusMin: 0 });
  day.focusMin += Math.round(sess.minutes || 0);
  st.total.focusMin += Math.round(sess.minutes || 0);
  refreshWeekCache();
  saveState();
}

/* ---------------------------------------------------------------------------
 * 估时自学习（P1-2）
 * ---------------------------------------------------------------------------
 * 核心思路来自优化方案第 3.3 节：不问用户，而是记录实际耗时逐步校准。
 * 如果用户能准确估时，他就不需要这个产品了 —— 所以不能一直向他索取估算能力。
 *
 * 真实耗时从哪来：
 *   优先用这一步的专注记录（用户真的坐下去做了）；没有专注记录时，
 *   退而使用该步骤的预估耗时 —— 因为"他没计时就勾了完成"这个行为本身
 *   不提供任何关于真实耗时的信息，用预估值相当于不更新校准，比瞎猜好。
 * -------------------------------------------------------------------------*/
function calibrateFromStep(task, step) {
  if (!State.settings.calibrate) return;
  if (!step || !step.minutes) return;

  var est = step.minutes;
  var act = null;

  /* 找这一步对应的专注记录（最近的、且当时是完整跑完的） */
  for (var i = State.sessions.length - 1; i >= 0; i--) {
    var s = State.sessions[i];
    if (s.stepId && s.stepId === step.id) {
      act = s.actualSeconds ? (s.actualSeconds / 60) : s.minutes;
      break;
    }
  }
  if (act === null) return;                 /* 没有真实数据就不更新校准 */
  if (act < 0.5) return;                    /* 太短，不可信 */

  var cat = taskCategoryOf(task);
  var st = ensureStats();
  var c = st.calib[cat] || (st.calib[cat] = { est: 0, act: 0, n: 0 });
  c.est += est;
  c.act += act;
  c.n += 1;
}

/* 任务属于哪一类 —— 直接复用拆解引擎打上的分类标签 */
function taskCategoryOf(task) {
  if (!task) return 'generic';
  if (task.category) return task.category;
  if (task.engine) return task.engine + ':' + 'generic';
  return 'generic';
}

/* 某一类任务的估时倍数。1.0 = 估得准；2.3 = 一贯低估为实际的三分之一左右。 */
function calibrationFactor(cat) {
  var st = ensureStats();
  var c = st.calib[cat];
  if (!c || c.n < 2 || !c.est) return 1;
  var f = c.act / c.est;
  /* 限幅：单次极端值不应该把预估拉飞。0.4x ~ 4x 之外的信息量很低。 */
  return Math.max(0.4, Math.min(4, f));
}

/* 把一个预估耗时按历史偏差校正后返回。
 * 界面上必须**明确告知用户被校正了**（透明度），否则用户会觉得数字莫名其妙。 */
function calibrateEstimate(minutes, cat) {
  if (!State.settings.calibrate) return { minutes: minutes, adjusted: false, factor: 1 };
  var f = calibrationFactor(cat);
  if (Math.abs(f - 1) < 0.15) return { minutes: minutes, adjusted: false, factor: 1 };
  var m = Math.max(2, Math.round(minutes * f));
  return { minutes: m, adjusted: true, factor: f };
}

/* ---------------------------------------------------------------------------
 * 周配额（P0-2 核心）
 * ---------------------------------------------------------------------------
 * 一周里达成 N 天（默认 3 天）就算「本周石堆立住了」。
 * 没有断签、没有归零、没有补签 —— 因为这周还没结束时，任何一天都还有机会。
 * -------------------------------------------------------------------------*/

/* 取某个日期所在周的标识（ISO 周，周一为一周之始） */
function weekKeyOf(date) {
  var d = date ? new Date(date) : new Date();
  d.setHours(0, 0, 0, 0);
  /* 把周一当作一周第一天：JS 的 getDay() 里周日是 0，先转成周一=0 */
  var dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return todayKey(d);
}

/* 这一周的 7 天（周一起），每天带达成状态 */
function currentWeek() {
  var st = ensureStats();
  var monday = new Date(weekKeyOf());
  var todayK = todayKey();
  var out = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    var key = todayKey(d);
    var day = st.days[key] || { steps: 0, tasks: 0, focusMin: 0 };
    out.push({
      date: key,
      /* 达成 = 这一天堆过至少一块石头（或专注过一段）。
       * 门槛刻意低：这是"你动过"，不是"你完成了多少"。 */
      done: (day.steps > 0 || day.focusMin > 0),
      steps: day.steps,
      focusMin: day.focusMin,
      isToday: key === todayK,
      isFuture: key > todayK
    });
  }
  return out;
}

function weeklyProgress() {
  var week = currentWeek();
  var achieved = week.filter(function (d) { return d.done; }).length;
  var quota = Math.max(1, State.settings.weeklyQuota || 3);
  var remainingDays = week.filter(function (d) { return !d.isFuture; })
    .filter(function (d) { return !d.done; }).length;
  return {
    week: week,
    achieved: achieved,
    quota: quota,
    met: achieved >= quota,
    /* 今天还来不来得及达标：剩余可用的天数（含今天）够不够补上差额 */
    stillPossible: (achieved + remainingDays) >= quota,
    daysLeft: remainingDays
  };
}

function refreshWeekCache() {
  var st = ensureStats();
  st.weeks[weekKeyOf()] = weeklyProgress().achieved;
}

/* 连续达标的周数（不是连续天数）—— 这是 Cairn 版的"连续记录"，
 * 但它的容错单位是「周」，所以偶尔一天没来完全不会中断。 */
function consecutiveWeeksMet() {
  var st = ensureStats();
  var quota = Math.max(1, State.settings.weeklyQuota || 3);
  var n = 0;
  var cursor = new Date(weekKeyOf());

  /* 本周还没结束就不算失败：如果本周还没达标，从上周开始数 */
  var thisWeek = weeklyProgress();
  if (!thisWeek.met) cursor.setDate(cursor.getDate() - 7);

  for (var guard = 0; guard < 260; guard++) {
    var key = todayKey(cursor);
    var count = 0;
    for (var i = 0; i < 7; i++) {
      var d = new Date(cursor);
      d.setDate(cursor.getDate() + i);
      var day = st.days[todayKey(d)];
      if (day && (day.steps > 0 || day.focusMin > 0)) count++;
    }
    if (count >= quota) { n++; cursor.setDate(cursor.getDate() - 7); }
    else break;
  }
  return n;
}

/* ---------------------------------------------------------------------------
 * 里程碑（P0-2）
 * ---------------------------------------------------------------------------
 * 规则（来自优化方案 4.3 机制三）：
 *   · 只在**达成时**提示一次，不做"还差 3 步就解锁"的催促（那是压力，不是动力）
 *   · 用石堆隐喻，不需要动画团队
 *   · 达成后永久保留，不因任何原因失去
 * -------------------------------------------------------------------------*/
var MILESTONES = [
  { id: 'first_stone', steps: 1,     zh: '第一块石头',   en: 'First stone',      zhDesc: '你堆下了第一块石头。', enDesc: 'You placed your first stone.' },
  { id: 'ten_stones',  steps: 10,    zh: '十块石头',     en: 'Ten stones',       zhDesc: '十块石头，已经能看出一个堆了。', enDesc: 'Ten stones — it looks like a pile now.' },
  { id: 'fifty',       steps: 50,    zh: '五十块石头',   en: 'Fifty stones',     zhDesc: '五十块。你比想象中走得更远。', enDesc: 'Fifty stones. You have come further than you think.' },
  { id: 'hundred',     steps: 100,   zh: '百块石头',     en: 'A hundred stones', zhDesc: '一百块石头堆起来的，是一座路标。', enDesc: 'A hundred stones make a real cairn.' },
  { id: 'three_hundred', steps: 300, zh: '三百块石头',   en: 'Three hundred',    zhDesc: '三百块石头。这已经是一条路。', enDesc: 'Three hundred stones. That is a trail.' }
];

function checkMilestones() {
  var st = ensureStats();
  var total = st.total.steps;
  var newly = [];
  MILESTONES.forEach(function (m) {
    if (total >= m.steps && st.milestones.indexOf(m.id) === -1) {
      st.milestones.push(m.id);
      newly.push(m);
    }
  });
  /* 一次可能跨过多个门槛（例如导入数据）。只把最大的那个拿出来展示，
   * 避免连弹好几张卡片 —— 那本身就是认知过载。 */
  if (newly.length) State.milestone = newly[newly.length - 1];
  return newly;
}

function milestoneReached(id) {
  return ensureStats().milestones.indexOf(id) !== -1;
}

/* 下一块里程碑与进度比例（用于进度页展示，但**不做进度条催促**） */
function nextMilestone() {
  var st = ensureStats();
  var total = st.total.steps;
  for (var i = 0; i < MILESTONES.length; i++) {
    if (total < MILESTONES[i].steps) {
      return { next: MILESTONES[i], remaining: MILESTONES[i].steps - total, total: total };
    }
  }
  return { next: null, remaining: 0, total: total };
}

/* ---------------------------------------------------------------------------
 * 「欢迎回来」（P0-1）
 * ---------------------------------------------------------------------------
 * 用户离开 ≥2 天后再打开，不显示任何逾期红字，先给一张温和的重置卡。
 *
 * 为什么这样做（优化方案 1.4 / 2.2）：
 *   用户放弃一个 App 的真实原因往往不是功能不够，而是"回来时太难受"。
 *   竞品横评提出的核心判据就是「它能不能扛过一次糟糕的一周」，
 *   而现有产品没有一个把"回来的那一刻"做成一等公民功能。
 * -------------------------------------------------------------------------*/
var AWAY_THRESHOLD_DAYS = 2;

function daysBetweenKeys(a, b) {
  var da = new Date(a + 'T00:00:00');
  var db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}

/* 计算"离开多久了"，并准备欢迎回来卡片的内容。返回 null 表示不需要显示。 */
function computeWelcomeBack(nowTs) {
  ensureStats();
  var last = State.settings.lastSeenAt;
  if (!last) return null;                    /* 第一次使用，不是"回来" */

  var lastDay = todayKey(new Date(last));
  var today = todayKey();
  var awayDays = daysBetweenKeys(lastDay, today);
  if (awayDays < AWAY_THRESHOLD_DAYS) return null;

  /* 上次停在哪个任务/步骤 —— 这是"从这里继续"要用的信息 */
  var lastTask = null, lastStep = null;
  var tasks = (State.tasks || []).filter(function (t) { return !t.done; });
  if (tasks.length) {
    /* 取最近被碰过的那个未完成任务 */
    tasks.sort(function (a, b) {
      var ta = a.lastTouchedAt || a.createdAt;
      var tb = b.lastTouchedAt || b.createdAt;
      return ta < tb ? 1 : -1;
    });
    lastTask = tasks[0];
    lastStep = nextStep(lastTask);
  }

  return {
    awayDays: awayDays,
    taskId: lastTask ? lastTask.id : null,
    taskTitle: lastTask ? lastTask.title : null,
    stepTitle: lastStep ? lastStep.title : null,
    hasOpenTasks: tasks.length > 0
  };
}

/* 记录"这次打开过了" */
function markSeen() {
  State.settings.lastSeenAt = new Date().toISOString();
  saveState();
}

/* ---------------------------------------------------------------------------
 * 给「进度」视图用的汇总（P0-3）
 * -------------------------------------------------------------------------*/
function progressSummary() {
  var st = ensureStats();
  var wk = weeklyProgress();

  /* 最近 14 天的努力情况。空白日**不做任何标记** —— 不显示"缺失"，
   * 只显示"有努力的日子"。这是 RSD 友好与"愧疚驱动"的分界线。 */
  var heat = [];
  for (var i = 13; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    var key = todayKey(d);
    var day = st.days[key] || { steps: 0, tasks: 0, focusMin: 0 };
    heat.push({
      date: key,
      steps: day.steps,
      focusMin: day.focusMin,
      /* 强度分档：0 = 什么都没做（不着色），1~3 表示努力程度 */
      level: day.steps === 0 && day.focusMin === 0 ? 0
        : (day.steps + Math.round(day.focusMin / 10)) >= 6 ? 3
        : (day.steps + Math.round(day.focusMin / 10)) >= 3 ? 2 : 1
    });
  }

  /* 估时校准的可读呈现 */
  var calib = [];
  Object.keys(st.calib).forEach(function (cat) {
    var c = st.calib[cat];
    if (c.n < 2 || !c.est) return;
    var f = calibrationFactor(cat);
    if (Math.abs(f - 1) < 0.15) return;
    calib.push({ category: cat, factor: f, n: c.n });
  });
  calib.sort(function (a, b) { return b.factor - a.factor; });

  var activeDays = Object.keys(st.days).filter(function (k) {
    var d = st.days[k];
    return d && (d.steps > 0 || d.focusMin > 0);
  }).length;

  return {
    total: st.total,
    firstDay: st.firstDay,
    activeDays: activeDays,
    week: wk,
    consecutiveWeeks: consecutiveWeeksMet(),
    heat: heat,
    calib: calib,
    next: nextMilestone(),
    milestones: MILESTONES.map(function (m) {
      return { id: m.id, reached: milestoneReached(m.id), zh: m.zh, en: m.en };
    })
  };
}

/* ---------------------------------------------------------------------------
 * 时间线自动重排（P1-1）
 * ---------------------------------------------------------------------------
 * 借鉴 Set 的能力：任务变动后剩余时间块自动重算。
 * 关键不是"把时间填满"，而是**让计划始终是最新的** ——
 * ADHD 用户最容易死在"计划崩了之后要手动重建"这一步。
 *
 * 规则：
 *   · 保留每个时间块自己的时长与顺序
 *   · 从第一个块的开始时间起，依次紧凑排列，中间自动插入短休息
 *   · 已经过去的时间块不搬动（避免把历史改掉）
 *   · 返回"今天几点结束"，这是用户真正想知道的那个数
 * -------------------------------------------------------------------------*/
var REFLOW_BREAK_MIN = 10;      /* 块与块之间自动留的呼吸时间 */
var REFLOW_BREAK_AFTER = 45;    /* 连续工作超过这个分钟数才插休息 */

function reflowTimeline(opts) {
  opts = opts || {};
  if (!State.settings.autoReflow) return null;

  var blocks = todayBlocks();
  if (blocks.length < 2) return null;

  var now = nowMinOfDay();
  var from = opts.fromMin !== undefined ? opts.fromMin : now;
  /* 起点对齐到 5 分钟刻度，避免出现 09:07 这种时间 */
  var cursor = Math.ceil(Math.max(blocks[0].start, from) / 5) * 5;

  var run = 0;                 /* 距离上次休息累积的工作分钟 */
  var changes = 0;

  /* 关键：cursor 既要往前走，也要保证越过上一个块的结束时间。
   * 早期版本只做 cursor += b.dur，当多个块的原始开始时间相同时（重叠的情况），
   * 它们会被排到同一个时刻 —— 等于重排没有解决重叠。
   * 正确做法是每处理完一个块就把 cursor 推到 max(cursor, 该块结束时间)。 */
  blocks.forEach(function (b) {
    /* 连续工作够久了就先插入一段呼吸时间 */
    if (run >= REFLOW_BREAK_AFTER) {
      cursor += REFLOW_BREAK_MIN;
      run = 0;
    }
    var target = cursor;
    if (b.start !== target) {
      b.start = target;
      changes++;
    }
    cursor = Math.max(cursor, b.start + b.dur);
    run += b.dur;
  });

  if (changes) {
    logEvent('timeline_reflow', { blocks: blocks.length, changed: changes });
    saveState();
  }
  return { endMin: cursor, changed: changes };
}

/* 今天按当前安排会在几点结束。没有安排时返回 null。 */
function projectedEnd() {
  var blocks = todayBlocks();
  if (!blocks.length) return null;
  var last = blocks[blocks.length - 1];
  return last.start + last.dur;
}

/* 通用保底模板：任何没被识别的任务都用这一套。
 * 关键在于前三步都是"零决策"动作 —— 这是破除任务瘫痪的核心。 */
var GENERIC_STEPS = [
  { key: 'tiny', zh: '只花 2 分钟：把和这件事有关的东西放到桌上', en: 'For 2 minutes only: put what you need on the desk.', m: 2, e: 'low' },

  { key: 'note', zh: '写一句"下次从哪继续"，然后收工', en: 'Write one line on where to resume. Then stop.', m: 3, e: 'low' }

/* 已经是小事的信号：不需要拆解，硬拆反而增加认知负担。
 *
 * 早期版本只判断"字符串里包含某个信号词"，结果 "买菜做饭" 里的 "买" 命中了，
 * 一件真需要规划的事被压成一条 5 分钟步骤。现在要求信号词出现在最前面，
 * 且去掉虚词后剩余部分足够短，才认定这本来就是一件小事。
 * 同时去掉 "买" 这种过分宽泛的词 —— 买东西本身经常是一整件事。 */
var SMALL_SIGNALS = ['回复', '回个', '发个', '拿', '取', '打印', '缴费', '交给', '确认', '签到',
                     'reply', 'send', 'print', 'pick up', 'confirm', 'submit'];

/* 英文虚词可以安全忽略，避免 "clean my room" 因为 my / room 被算成长输入 */
function stripFiller(s) {
  return String(s).toLowerCase()
    .replace(/\b(a|an|the|my|our|your|this|that|to|for|of|it|some|up)\b/g, ' ')
    .replace(/[，。、！？,.!?;:()"'“”‘’]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* 关键词强度：两个维度相乘。
 *
 *   1) 信息密度 —— 中日韩文字"一字即一语素"，2 个字的"论文"已是一个完整语义
 *      单元；英文往往要 6~10 个字母才等价。早期版本用 `Math.min(length, 6)`
 *      统一打分，结果中文关键词全部拿不到分，所有中文任务都掉进了通用模板。
 *   2) 区分度（逆文档频率）—— 一个词出现在越多模板里，越不能说明问题。
 *      "写作"同时出现在写作类和创作类，"report"同理；而 "bug" 只属于编程类。
 *      所以用 maxRaw / 该词原始分 作为权重：独一无二的词权重为 1，到处都是的
 *      词权重被压到 1/N。
 *
 * 这样 "bug"（12 字母、仅编程类）得 8 分，比 "写作"（被两个模板共用）更有决定性。 */
var _kwDocFreq = null;
var _kwMaxRaw = 0;

function rawKeywordScore(kw) {
  var k = String(kw);
  if (!k) return 0;
  /* 中日韩：一字即一语素，基准 7 分/字。
   * 英文：每字母 1 分，最低 3 分 —— 否则 "bug"（编程类独有、极强信号）
   * 会因为只有 3 个字母而拿不到分，被误判成通用任务。 */
  if (/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uac00-\ud7af\uf900-\ufaff]/.test(k)) {
    return 7 * Math.min(k.length, 4);
  }
  return Math.max(3, Math.min(k.length, 12));
}

function buildKeywordStats() {
  if (_kwDocFreq) return;
  _kwDocFreq = {};
  _kwMaxRaw = 0;
  TEMPLATES.forEach(function (tpl) {
    tpl.kw.forEach(function (k) {
      var key = String(k).toLowerCase();
      _kwDocFreq[key] = (_kwDocFreq[key] || 0) + 1;
      _kwMaxRaw = Math.max(_kwMaxRaw, rawKeywordScore(key));
    });
  });
}

function keywordScore(kw) {
  buildKeywordStats();
  var key = String(kw).toLowerCase();
  var raw = rawKeywordScore(key);
  if (!raw) return 0;
  var df = _kwDocFreq[key] || 1;
  return raw / df;      /* 原始强度 ÷ 共享该词的模板数 */
}

/* 抽象名词：中文里同一个动词后面接的东西决定了它属于哪一类。
 * "整理房间"是家务，"整理想法"是思考 —— 后者不该被塞进家务模板。
 * 命中关键词后如果紧跟这些词，就削弱这次命中的权重。 */
var ABSTRACT_NOUNS = ['想法', '思路', '思绪', '情绪', '感受', '计划', '方案', '逻辑', '资料',
                      '信息', '笔记', '知识', '概念', 'idea', 'ideas', 'thoughts', 'feelings',
                      'plan', 'plans', 'notes', 'concept'];

function classify(text) {
  var s = String(text || '').toLowerCase();
  var ranked = [];

  TEMPLATES.forEach(function (tpl, order) {
    var top = 0, topKw = null, topCJK = false;
    tpl.kw.forEach(function (k) {
      var key = String(k).toLowerCase();
      var at = s.indexOf(key);
      if (at === -1) return;
      var score = keywordScore(key);
      /* 关键词后面（同一次输入里）出现抽象名词 → 判定为误报，直接压到阈值以下。
       * 要往后扫几个字，因为中间可能有"一下""我的"这类填充词：
       * "整理一下我的想法" 里 "整理" 后面第 4 个字才是 "想法"。
       * 惩罚系数 0.25 而不是 0.4：0.4 时 "整理"(14) 还剩 5.6，刚好卡在
       * 阈值 5 之上，仍然会误判成家务类。必须一次压到底。 */
      var tail = s.slice(at + key.length, at + key.length + 8);
      var abstract = ABSTRACT_NOUNS.some(function (n) { return tail.indexOf(n) !== -1; });
      if (abstract) score *= 0.25;
      if (score > top) { top = score; topKw = key; topCJK = /[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/.test(key); }
    });
    if (top > 0) ranked.push({ tpl: tpl, score: top, kw: topKw, cjk: topCJK, order: order });
  });

  if (!ranked.length) return { tpl: null, score: 0, topCJK: false };

  ranked.sort(function (a, b) {
    if (b.score !== a.score) return b.score - a.score;
    /* 平分时优先"更具体的关键词"：长词比短词更能说明问题。
     * "配置开发环境" 里 coding 靠 "开发"(2字) 和 setup 靠 "配置"(2字) 同分，
     * 但 setup 还命中了 "环境"，用命中词总长做最终裁决更符合直觉。 */
    var la = a.tpl.kw.filter(function (k) { return s.indexOf(String(k).toLowerCase()) !== -1; })
      .join('').length;
    var lb = b.tpl.kw.filter(function (k) { return s.indexOf(String(k).toLowerCase()) !== -1; })
      .join('').length;
    if (lb !== la) return lb - la;
    return a.order - b.order;
  });

  var win = ranked[0];
  return { tpl: win.tpl, score: win.score, topCJK: win.cjk, kw: win.kw };
}

/* 分类阈值。中日韩关键词基准分高（≥7），英文单词基准分低（bug = 3）。
 * 所以按"最强的那一个关键词"分别设阈值，而不是把分数加总 ——
 * 加总会让一篇堆满泛词的任务压过只有一个精准关键词的任务。 */
function isConfident(c) {
  if (!c.tpl) return false;
  return c.score >= (c.topCJK ? 5 : 3);
}

/* 看起来是"小事"就不要再拆 —— 直接给一步，并说明原因。
 *
 * 判定链：长度门槛 → 剥掉所有开头的信号词（"回复""发个"…）→ 剩余部分必须很短。
 *
 * 这里走了两次弯路，记下来免得回退：
 *   第一版只判"字符串里包含信号词"，"买菜做饭" 里的 "买" 命中，一件真需要
 *   规划的事被压成一条步骤。于是改成"必须出现在开头"。
 *   第二版又加了"能归类就不算小事"，结果 "回复邮件" 被套上沟通类模板拆成
 *   6 步 —— 对一件两分钟的事来说，6 步模板本身就是新的认知负担。
 *   现在回到最简单也最符合直觉的规则：短、信号词在开头、剩下的内容极少。
 */
function looksSmall(text) {
  var raw = String(text || '').trim();
  if (!raw) return false;
  var s = stripFiller(raw);
  if (!s) return false;
  if (s.length > 12) return false;

  /* 剥掉开头连续出现的信号词 */
  var changed = true, remainder = s;
  while (changed) {
    changed = false;
    for (var i = 0; i < SMALL_SIGNALS.length; i++) {
      var k = SMALL_SIGNALS[i];
      if (remainder.indexOf(k) === 0) {
        remainder = stripFiller(remainder.slice(k.length));
        changed = true;
        break;
      }
    }
  }
  if (remainder === s) return false;          /* 一个信号词都没命中 */

  return stripFiller(remainder).length <= 5;
}

/* 语言选择：按当前界面语言取模板文案，英文缺失时回退中文 */
function pickLang(obj, lang) {
  if (!obj) return '';
  if (lang === 'en' && obj.en) return obj.en;
  return obj.zh || obj.en || '';
}

/* 把用户那句话塞进模板，让步骤读起来像"针对这件事"而不是通用废话。
 * 注意两个语言分支都要产出目标语言的文案 —— 早期版本英文分支写了 `en:`，
 * 但英文模板数据只有 `en` 字段，导致英文界面第一步退回中文。 */
function personalize(title, tpl, lang) {
  var short = String(title || '').trim();
  if (short.length > 16) short = short.slice(0, 16) + '…';
  var out = tpl.map(function (s) { return { zh: s.zh, en: s.en, m: s.m, e: s.e }; });
  if (!short) return out;
  if (lang === 'en') {
    out[0].en = out[0].en + ' (' + short + ')';
  } else {
    out[0].zh = out[0].zh + '（' + short + '）';
  }
  return out;
}

/* ---------------------------------------------------------------------------
 * 本地拆解主入口
 * -------------------------------------------------------------------------*/
function decomposeLocal(rawTitle, lang) {
  var title = String(rawTitle || '').trim();
  lang = lang || 'zh';
  var t0 = Date.now();

  /* 情况零：本来就已经是一件小事 */
  if (looksSmall(title)) {
    return {
      engine: 'local',
      kind: 'small',
      category: null,
      steps: [{
        zh: '直接做：' + title, en: 'Just do it: ' + title, m: 5, e: 'low'
      }].map(function (s) { return normStep(s, lang); }),
      note: {
        zh: '这件事本身已经够小了，就不拆了。拆得越细反而越累。',
        en: 'This one is already small. Breaking it further would just add work.'
      },
      ms: Date.now() - t0,
      classification: 'already-small'
    };
  }

  var c = classify(title);
  var tpl, category = null, note = null, classification;

  if (isConfident(c)) {
    tpl = personalize(title, c.tpl.steps, lang);
    category = (lang === 'en' ? c.tpl.en.name : c.tpl.zh.name);
    classification = c.tpl.id;
  } else {
    /* 未识别 → 通用原子化模板 */
    tpl = GENERIC_STEPS.map(function (s) {
      return { zh: s.zh, en: s.en, m: s.m, e: s.e };
    });
    if (title) {
      tpl[3] = {
        zh: '挑出最容易的那个部分（' + clip(title, 14) + '）',
        en: 'Pick the easiest part of ' + clip(title, 22) + '.',
        m: 2, e: 'low'
      };
    }
    note = {
      zh: '没认出这属于哪一类，用的是通用拆法：前三步都不需要动脑，先把手动起来。',
      en: 'Could not match a template, so this uses the generic split: the first three steps need no thinking at all.'
    };
    /* 只有"真的用了模板"才记模板名。
     * 早期版本这里写 c.tpl.id，于是在未命中、实际走通用模板时，埋点却记下了
     * 一个模板名（例如 "整理一下我的想法" 被记成 chores）。评估报告要靠这些
     * 字段统计分类准确率，埋点撒谎比功能出错更危险。 */
    classification = 'generic';
  }

  var steps = tpl.map(function (s) {
    return normStep(s, lang);
  });

  /* 拆得太长也不好：超过 7 步就截断，避免又变成一张吓人的清单 */
  if (steps.length > 7) steps = steps.slice(0, 7);

  return {
    engine: 'local',
    kind: 'task',
    category: category,
    steps: steps,
    note: note,
    ms: Date.now() - t0,
    classification: classification
  };
}

function normStep(s, lang) {
  return {
    title: lang === 'en' ? (s.en || s.zh) : (s.zh || s.en),
    altTitle: lang === 'en' ? s.zh : s.en,
    minutes: s.m || 5,
    energy: s.e || 'low'
  };
}

function clip(s, n) {
  s = String(s || '').trim();
  return s.length > n ? s.slice(0, n) + '…' : s;
}

/* ---------------------------------------------------------------------------
 * DeepSeek AI 拆解
 * ---------------------------------------------------------------------------
 * 提示词设计要点：
 *   · 强制 JSON 输出，避免解析自然语言
 *   · 明确"2~15 分钟"与"动词开头"，否则模型会给出"研究一下"这种假动作
 *   · 明确禁止鼓励性/解释性文字，因为低刺激界面不欢迎大段文本
 * -------------------------------------------------------------------------*/
var AI_SYSTEM_PROMPT =
  'You are a task-decomposition assistant for people with ADHD. ' +
  'Break the user\'s vague, overwhelming task into the smallest possible physical next actions. ' +
  'Rules: (1) every step must be doable in 2 to 15 minutes; ' +
  '(2) start each step with a concrete physical verb (open, write, find, copy, send, set a timer); ' +
  '(3) the first step must require no decision and take under 2 minutes; ' +
  '(4) never output vague verbs like "research", "plan", "think about", "work on"; ' +
  '(5) 3 to 6 steps total; ' +
  '(6) mark each step energy as "high" (needs thinking) or "low" (mechanical); ' +
  '(7) no encouragement, no explanations, no markdown. ' +
  'Respond with JSON only, exactly this shape: ' +
  '{"category":"short label","steps":[{"title":"...","minutes":5,"energy":"low"}]} ' +
  'Write step titles in the same language as the user input.';

function aiHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + State.settings.aiKey
  };
}

function aiEndpoint() {
  var base = (State.settings.aiBase || 'https://api.deepseek.com').replace(/\/+$/, '');
  return base + '/chat/completions';
}

/* 把模型返回的内容解析成步骤数组。容错三层：纯 JSON → 代码块里的 JSON → 逐行文本 */
function parseAI(raw) {
  var text = String(raw || '').trim();
  if (!text) return null;

  var candidates = [text];
  var fence = /```(?:json)?\s*([\s\S]*?)```/.exec(text);
  if (fence) candidates.push(fence[1].trim());
  var brace = text.indexOf('{');
  var lastBrace = text.lastIndexOf('}');
  if (brace !== -1 && lastBrace > brace) candidates.push(text.slice(brace, lastBrace + 1));

  for (var i = 0; i < candidates.length; i++) {
    try {
      var obj = JSON.parse(candidates[i]);
      var steps = obj && (obj.steps || obj.tasks || obj.subtasks);
      if (Array.isArray(steps) && steps.length) {
        return { category: obj.category || obj.name || null, steps: steps };
      }
    } catch (e) { /* 试下一种 */ }
  }

  /* 最后兜底：按行拆，每行当一步。仍然比失败好。 */
  var lines = text.split('\n')
    .map(function (l) { return l.replace(/^\s*(?:[-*•]|\d+[.、)])\s*/, '').trim(); })
    .filter(function (l) { return l.length > 1 && l.length < 80; });
  if (lines.length >= 2) {
    return {
      category: null,
      steps: lines.slice(0, 6).map(function (l) { return { title: l, minutes: 10, energy: 'low' }; })
    };
  }
  return null;
}

/* 校验：模型有没有真的把任务拆小 */
function validateAI(parsed) {
  if (!parsed || !parsed.steps || !parsed.steps.length) {
    return { ok: false, reason: '模型没有返回可用的步骤' };
  }
  var steps = parsed.steps.slice(0, 6).map(function (s) {
    var title = String(s.title || s.text || s.action || '').trim();
    var minutes = parseInt(s.minutes || s.min || s.duration || 10, 10);
    var energy = (String(s.energy || s.effort || '').toLowerCase() === 'high') ? 'high' : 'low';
    if (!isFinite(minutes) || minutes < 1) minutes = 10;
    return { title: title, minutes: minutes, energy: energy };
  }).filter(function (s) { return s.title.length > 1; });

  if (steps.length < 2) return { ok: false, reason: '模型返回的步骤太少' };
  /* 关键兜底：出现超过 45 分钟的步骤，说明它没有真的拆小 */
  var tooBig = steps.filter(function (s) { return s.minutes > 45; });
  if (tooBig.length) return { ok: false, reason: '模型给出的步骤超过 45 分钟，没有真正拆小' };
  steps.forEach(function (s) { s.minutes = Math.min(s.minutes, 15); });
  return { ok: true, steps: steps, category: parsed.category };
}

async function decomposeAI(rawTitle, lang) {
  var title = String(rawTitle || '').trim();
  if (!State.settings.aiKey) return { ok: false, reason: 'NO_KEY' };

  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 25000);
  try {
    var resp = await fetch(aiEndpoint(), {
      method: 'POST',
      headers: aiHeaders(),
      signal: ctrl.signal,
      body: JSON.stringify({
        model: State.settings.aiModel || 'deepseek-chat',
        temperature: 0.3,
        max_tokens: 700,
        messages: [
          { role: 'system', content: AI_SYSTEM_PROMPT },
          { role: 'user', content: (lang === 'en' ? 'Task: ' : '任务：') + title }
        ]
      })
    });
    clearTimeout(timer);

    if (!resp.ok) {
      var body = '';
      try { body = await resp.text(); } catch (e) {}
      var msg = 'HTTP ' + resp.status;
      if (resp.status === 401) msg = 'API Key 无效或已过期';
      else if (resp.status === 402) msg = '账户余额不足';
      else if (resp.status === 429) msg = '请求过于频繁，稍后再试';
      else if (resp.status >= 500) msg = '服务端错误 ' + resp.status;
      return { ok: false, reason: msg, detail: body.slice(0, 200) };
    }

    var data = await resp.json();
    var content = data && data.choices && data.choices[0] &&
                  data.choices[0].message && data.choices[0].message.content;
    var parsed = parseAI(content);
    var v = validateAI(parsed);
    if (!v.ok) return { ok: false, reason: v.reason, detail: String(content || '').slice(0, 200) };
    return { ok: true, steps: v.steps, category: v.category, usage: data.usage || null };
  } catch (e) {
    clearTimeout(timer);
    var reason = (e && e.name === 'AbortError')
      ? '请求超时（25 秒）。可能是网络不通或需要代理。'
      : ('网络错误：' + (e && e.message ? e.message : '未知'));
    return { ok: false, reason: reason };
  }
}

/* ---------------------------------------------------------------------------
 * 统一入口：AI 优先（用户显式选择时），失败自动回退本地规则库
 * -------------------------------------------------------------------------*/
async function decompose(rawTitle, engine) {
  var lang = State.settings.lang;
  logBreakdownStart(rawTitle);

  if (engine === 'ai' && State.settings.aiKey) {
    var r = await decomposeAI(rawTitle, lang);
    if (r.ok) {
      var ms = logBreakdownDone(r.steps.length, 'ai');
      return {
        engine: 'ai',
        kind: 'task',
        category: r.category,
        steps: r.steps.map(function (s) {
          return { title: s.title, minutes: s.minutes, energy: s.energy };
        }),
        note: null,
        ms: ms,
        fallback: false
      };
    }
    /* 失败 → 回退本地，并把原因带回界面（不静默失败，用户需要知道为什么） */
    var local = decomposeLocal(rawTitle, lang);
    local.fallback = true;
    local.fallbackReason = r.reason;
    return local;
  }

  if (engine === 'ai' && !State.settings.aiKey) {
    var l2 = decomposeLocal(rawTitle, lang);
    l2.fallback = true;
    l2.fallbackReason = 'NO_KEY';
    return l2;
  }

  var l3 = decomposeLocal(rawTitle, lang);
  logBreakdownDone(l3.steps.length, 'local');
  return l3;
}

</script>
<!-- views-v2 必须在 views 之前：views.js 里的 VIEWS 映射是立即求值的，
     它引用了 viewProgress，所以那个函数得先存在。
     mobile.js 也要在 views 之前：paintAppbar 会调用它里面的 navItems()。 -->
<script>
/* ============================================================================
 * Cairn · views-v2.js   （v2.0 新增视图与卡片）
 * ---------------------------------------------------------------------------
 *   1) 「进度」视图          —— P0-3，补上缺失的回顾层
 *   2) 「欢迎回来」卡片       —— P0-1，回答"离开之后怎么办"
 *   3) 首次使用引导           —— P0-4，补上缺失的入口层
 *   4) 里程碑卡片             —— P0-2，借鉴 Duolingo 的里程碑设计
 *   5) 石堆组件               —— P0-2，三档石堆可视化
 *
 * 视觉纪律（与本项目其余部分一致）：
 *   · 不加动画、不加音效、不加彩带。里程碑靠**内容**庆祝，不靠特效
 *   · 空白日不着色、不画叉、不写"缺失"
 *   · 任何数字都不带负向措辞
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * 石堆可视化组件
 * ---------------------------------------------------------------------------
 * 三档石堆共用一个渲染函数：
 *   mode='today'  今天完成的步骤
 *   mode='week'   本周 7 天（每一格一块"石头"，达成的填实）
 *   mode='total'  累计（按数量分档决定画几块，避免画上千块）
 * -------------------------------------------------------------------------*/
function pileVisual(mode, value, opts) {
  opts = opts || {};
  var size = opts.size || 'md';       /* sm | md | lg */
  var stoneH = size === 'lg' ? 11 : size === 'sm' ? 5 : 8;
  var maxW = size === 'lg' ? 76 : size === 'sm' ? 40 : 58;

  var count, filled;
  if (mode === 'week') {
    count = 7;
    filled = value || 0;
  } else if (mode === 'total') {
    /* 累计石堆：把数量压缩成可视的块数（对数式分档，保证"看得见增长"但不会画爆）。
     * 1→1, 10→10, 50→14, 100→18, 300→22, 1000→26 */
    var v = Math.max(0, value || 0);
    count = v === 0 ? 0 : Math.min(26, Math.round(4 + Math.log(v + 1) / Math.log(1.35)));
    filled = count;
  } else {
    count = Math.max(0, Math.min(value || 0, 14));
    filled = count;
  }

  if (count === 0) {
    return '<div class="pile pile-' + size + ' pile-empty">' +
           '<span class="text-2xs text-ink-4">' + esc(t('pileEmpty')) + '</span></div>';
  }

  var html = '<div class="pile pile-' + size + '" role="img" aria-label="' +
             esc(mode === 'week' ? (filled + '/7') : String(value || 0)) + '">';
  for (var i = 0; i < count; i++) {
    /* 越往上越窄，模拟真实石堆的收窄轮廓 */
    var w = Math.round(maxW - (i / Math.max(count - 1, 1)) * (maxW * 0.45));
    var on = i < filled;
    html += '<span class="pile-stone' + (on ? ' is-on' : '') + '"' +
            ' style="width:' + w + 'px;height:' + stoneH + 'px"></span>';
  }
  return html + '</div>';
}

/* 周配额条：7 格，达成的填实，未来的留空，过去的空着但不做任何标记 */
function weekStrip() {
  var wp = weeklyProgress();
  /* 星期标签：英文是 "M T W T F S S"（空格分隔），中文是"一二三四五六日"
   * （字符直接相连）。所以不能只靠 split(/\s+/) —— 那样中文只会切出一个元素，
   * 七天的标签会全部挤进第一格（这个 bug 在中文界面一直存在，因为英文恰好正常
   * 所以没被发现）。这里两种都兼容：先按空白切，切不出 7 个就按字符切。 */
  var labels = t('weekDays').split(/\s+/).filter(Boolean);
  if (labels.length < 7 && labels.join('').length >= 7) {
    labels = labels.join('').split('');
  }
  var html = '<div class="week-strip">';
  wp.week.forEach(function (d, i) {
    var cls = 'week-cell';
    if (d.done) cls += ' is-met';
    if (d.isToday) cls += ' is-today';
    if (d.isFuture) cls += ' is-future';
    html += '<div class="' + cls + '" title="' + esc(d.date + ' · ' + d.steps + ' ' + t('statTasks')) + '">' +
              '<span class="week-cell-dot"></span>' +
              '<span class="week-cell-label">' + esc(labels[i] || '') + '</span>' +
            '</div>';
  });
  html += '</div>';
  return html;
}

/* ---------------------------------------------------------------------------
 * 1) 「进度」视图（P0-3）
 * -------------------------------------------------------------------------*/
function viewProgress() {
  var s = progressSummary();

  if (!s.total.steps && !s.activeDays) {
    return '' +
    '<div class="max-w-md mx-auto">' +
      '<h1 class="text-xl font-semibold">' + esc(t('progressTitle')) + '</h1>' +
      '<p class="text-sm text-ink-3 mt-1 mb-6">' + esc(t('progressSub')) + '</p>' +
      '<div class="empty-state">' +
        '<div class="text-accent opacity-60">' + brandMark(48, .8) + '</div>' +
        '<p class="text-sm text-ink-3 mt-4 max-w-prose">' + esc(t('progressEmpty')) + '</p>' +
        '<button class="btn btn-primary mt-5" data-act="go" data-view="breakdown">' +
          BRAND.icon('breakdown', 16) + esc(t('navBreakdown')) + '</button>' +
      '</div>' +
    '</div>';
  }

  var wk = s.week;
  var quota = State.settings.weeklyQuota || 3;

  /* 周状态文案 —— 三种情况，全都不带负面措辞 */
  var weekLine;
  if (wk.met) {
    weekLine = t('weekMet');
  } else if (wk.stillPossible) {
    weekLine = t('weekNotYet', { n: quota - wk.achieved, left: wk.daysLeft });
  } else {
    weekLine = t('weekNoChance', { done: wk.achieved });
  }

  return '' +
  '<div class="max-w-lg mx-auto">' +
    '<div class="flex items-end gap-3 mb-1">' +
      '<div class="flex-1">' +
        '<h1 class="text-xl font-semibold">' + esc(t('progressTitle')) + '</h1>' +
        '<p class="text-sm text-ink-3 mt-1">' + esc(t('progressSub')) + '</p>' +
      '</div>' +
      '<span class="text-2xs text-ink-4">' + esc(t('progressSince', { date: s.firstDay })) + '</span>' +
    '</div>' +

    /* --- 总石堆：核心可视化 --- */
    '<div class="card p-5 mt-5">' +
      '<div class="flex items-start gap-4">' +
        '<div class="flex-none">' + pileVisual('total', s.total.steps, { size: 'lg' }) + '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<div class="text-xs text-ink-3">' + esc(t('pileTotal')) +
            ' <span class="text-ink-4">· ' + esc(t('pileTotalHint')) + '</span></div>' +
          '<div class="text-3xl font-semibold mt-1 tabular">' + s.total.steps + '</div>' +
          /* 这里只显示单位，不再重复一遍数字 —— 早期写成「47 / 47 块石头」很难看 */
          '<div class="text-xs text-ink-3 mt-1">' + esc(t('pileUnit')) + '</div>' +
          (s.next.next
            ? '<div class="text-2xs text-ink-4 mt-2">' + esc(t('msNext', { n: s.next.remaining })) + '</div>'
            : '') +
        '</div>' +
      '</div>' +
    '</div>' +

    /* --- 本周配额 --- */
    '<div class="card p-5 mt-4">' +
      '<div class="flex items-center gap-2 mb-3">' +
        '<h2 class="text-base font-semibold">' + esc(t('weekTitle')) + '</h2>' +
        (wk.met ? '<span class="chip chip-accent">' + BRAND.icon('check', 12) + esc(t('weekMet')) + '</span>' : '') +
      '</div>' +
      weekStrip() +
      '<div class="text-sm mt-3 ' + (wk.met ? 'text-accent font-medium' : 'text-ink-2') + '">' +
        esc(weekLine) + '</div>' +
      '<div class="text-2xs text-ink-4 mt-2">' + esc(t('weekQuotaHint', { q: quota })) + '</div>' +
      (s.consecutiveWeeks > 0
        /* flex：svg 是 display:block，不加 flex 图标会独占一行、把文字挤到下面 */
        ? '<div class="text-xs text-ink-3 mt-3 pt-3 border-t flex items-center gap-1.5">' +
            BRAND.icon('flag', 13) + '<span>' + esc(t('consecutiveWeeks', { n: s.consecutiveWeeks })) + '</span></div>'
        : '') +
    '</div>' +

    /* --- 三条真实统计 --- */
    '<div class="grid gap-2 mt-4" style="grid-template-columns:1fr 1fr 1fr">' +
      statTile(s.total.tasks, t('progressTotalTasks')) +
      statTile(s.total.focusMin, t('progressFocusMin')) +
      statTile(s.activeDays, t('progressActiveDays')) +
    '</div>' +

    /* --- 最近两周（只有动过的日子被点亮） --- */
    '<div class="card p-5 mt-4">' +
      '<h2 class="text-base font-semibold mb-3">' + esc(t('progressHeat')) + '</h2>' +

/* ---------------------------------------------------------------------------

function viewOnboarding() {

        /* v2.3：引导第一屏是品牌亮相的最佳位置，补上手绘字标。

        '<div class="flex justify-center mb-6">' + BRAND.wordmarkSVG(26, 'currentColor') + '</div>' +

          '<div class="card p-4">' +
            '<textarea id="ob-input" class="textarea" rows="2" placeholder="' +

/* 引导第三屏：用户完成真实拆解之后看到的结果 */
function renderObResult() {
