/* ============================================================================
 * Cairn · styles.css   (inlined into the single-file build)
 * ---------------------------------------------------------------------------
 * Design language: low stimulation.
 *   - No pure white, no pure black, no saturated brand colours.
 *   - One desaturated accent (moss). Colour is only ever used to carry meaning:
 *       moss   = progress / focus / success
 *       clay   = needs thinking (high energy)
 *       slate  = autopilot    (low energy)
 *       amber  = time pressure, used sparingly
 *   - Everything is a utility class so the markup stays declarative, mirroring
 *     the Tailwind CSS workflow the brief asked for. The utilities are compiled
 *     by hand so the prototype needs zero network requests (offline-safe).
 * ==========================================================================*/

/* ------------------------------------------------------------------ tokens */
/* v2.3：色板从"单一苔绿 + 冷灰"换成"海滩卵石"。
 *
 * 参考图里最打动人的不是某个颜色，而是**低饱和的多色并存**：被海水磨圆的
 * 灰、暖沙、海蓝放在一起，颜色不少但依然安静。这恰好是 ADHD 产品需要的：
 * 有温度，不刺眼。
 *
 * 三条不能破的规矩（改了要重算对比度）：
 *   ① 不用纯白纯黑 —— 最亮 #FFFFFF 只给卡片，最深 #24231F
 *   ② 强调色饱和度 ≤ 30%
 *   ③ 正文与提示文字对背景的对比度都 ≥ 4.5:1（ink-3 因此比 v2.2 调深了）
 */
:root {
  --bg:        #F7F4EE;   /* 暖沙纸底，比原来的冷灰暖一点 */
  --surface:   #FFFFFF;
  --surface-2: #F1EDE4;
  --surface-3: #E9E4D9;
  --line:      #E3DFD4;
  --line-2:    #CEC9BC;
  --ink:       #24231F;   /* 暖黑，不是 #000 */
  --ink-2:     #514E46;
  --ink-3:     #6F6B5E;   /* 4.7:1 —— 比 v2.2 的 #8A877D 更深，为的是达标 */
  --ink-4:     #A29E90;

  /* 苔绿：品牌主色。
   *
   * v2.3 把它从 #5E7F6B 调深到 #506E5C —— 原因是换暖沙底色之后，
   * 对比度算出只有 4.05:1，低于 WCAG AA 要求的 4.5:1（白字按钮更差，4.08:1）。
   * 调深之后：强调色文字对背景 4.84:1，白字在按钮上 5.32:1，两项都过。
   * 这是自动化测试算出来的，不是凭感觉调的。
   *
   * 品牌标识（应用图标、文档 LOGO）仍用 #5E7F6B —— 那是纯图形，
   * 按规范只需 3:1，不受影响。 */
  --accent:      #506E5C;
  --accent-hover:#44604F;
  --accent-soft: #E7EDE8;
  --accent-line: #BDCCC2;

  /* v2.3 新增：来自沙滩卵石的三个辅助色 */
  --sand:        #D8CBB2;   /* 暖沙 —— 次要底色、低能量标记 */
  --sand-soft:   #F3EDE0;
  --sea:         #6E8CA0;   /* 海蓝 —— 时间线、链接，用量极少 */
  --sea-soft:    #E8EEF2;
  --pebble:      #9AA19E;   /* 卵石灰 —— 中性辅助 */

  --clay:        #A9776A;
  --clay-soft:   #F1E8E5;
  --slate:       #74808F;
  --slate-soft:  #E9ECF0;
  --amber:       #B58A3F;
  --amber-soft:  #F4EDE0;
  --danger:      #9C5A52;
  --danger-soft: #F4E7E5;

  --radius:    14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --radius-full: 999px;

  --shadow-sm: 0 1px 2px rgba(27, 26, 23, .05);
  --shadow:    0 2px 8px rgba(27, 26, 23, .06);
  --shadow-lg: 0 12px 32px rgba(27, 26, 23, .12);

  --dur: 140ms;
  --ease: cubic-bezier(.4, 0, .2, 1);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

/* 夜间低刺激模式：整体降亮度，避免夜晚屏幕过白 */
[data-theme="dim"] {
  --bg:        #16181A;
  --surface:   #1E2124;
  --surface-2: #24282C;
  --surface-3: #2B3034;
  --line:      #31363B;
  --line-2:    #3D4349;
  --ink:       #E6E4DF;
  --ink-2:     #A9A69F;
  --ink-3:     #7C7A74;
  --ink-4:     #5A5854;

  --accent:      #7FA48D;
  --accent-hover:#8FB59C;
  --accent-soft: #232C27;
  --accent-line: #37473D;

  --clay:        #C08E81;
  --clay-soft:   #2E2624;
  --slate:       #93A0B0;
  --slate-soft:  #23282E;
  --amber:       #CBA361;
  --amber-soft:  #2E2A22;
  --danger:      #C17C72;
  --danger-soft: #2E2523;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow:    0 2px 8px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}

/* ------------------------------------------------------------------- reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, h4, p, figure { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }
::selection { background: var(--accent-line); color: var(--ink); }

/* 细而安静的滚动条 */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
*::-webkit-scrollbar-track { background: transparent; }

/* 焦点可见性：键盘用户可辨识，鼠标用户不打扰 */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ============================================================================
 * v2.3 · 品牌语汇（手绘字标 + 口号）
 * ---------------------------------------------------------------------------
 * 参考图的核心是「粗笔手写体 + 全大写宽字距口号」。字标本体是 SVG 路径
 * （见 brand.js 的 wordmarkSVG），这里只负责它在页面里的排布与口号排版。
 * ==========================================================================*/

/* 顶栏的手绘字标。手机上隐藏 —— 窄屏要留给右侧三个按钮与底部导航。 */
.brand-wordmark { display: inline-flex; }
.brand-wordmark svg { display: block; }

/* 口号（中文）：正常字距、中等字重。
 * 中文不能套用英文的宽字距 —— 汉字本身是方块，拉开字距会散架。 */
.slogan {
  font-size: 13px;
  line-height: 1.6;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--ink-2);
}

/* 口号（英文）：全大写 + 宽字距，模拟参考图里手写小字的感觉。
 * 这是唯一能在不内嵌字体的前提下拿到"手写口号"气质的方法。 */
.slogan-en {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* 空屏垂直居中。
 *
 * 拆解页在没有任务时只有三样东西（石堆、字标、输入框），自然流式排列
 * 会全部堆在顶部、下面留出一大片空白 —— 用户提过这个观感问题。
 * 这里让它垂直居中，视觉重心落在屏幕中央。
 *
 * 用 min-height 而不是 height：内容若超出仍然可以自然增高、正常滚动，
 * 不会被裁掉。减掉的是顶栏 56px 与 #view 的上下 padding 48px。 */
.hero-center {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: calc(100vh - 104px);
}
/* 关键：flex 子项默认 flex-shrink:1。当内容比 min-height 高时，浏览器会
 * 把子项压扁，于是英雄区里的口号被下面的输入卡片盖住（v2.3 初版就是这样）。
 * 这里禁止收缩，让内容自然把容器撑高。 */
.hero-center > * { flex-shrink: 0; }
@media (max-width: 860px) {
  /* 手机上顶栏 52px、底部导航 76px，可用高度更小 */
  .hero-center { min-height: calc(100dvh - 200px); }
}

/* 标题字重整体上调一档（600 → 700）：
 * 参考图的字形比原来的细体更有"手工感"，加粗是最省成本的一步。 */
h1 { font-weight: 700; }
h2 { font-weight: 650; }

/* ============================================================================
 * v2.3 · 石堆进度（不规则鹅卵石）
 * ---------------------------------------------------------------------------
 * 具体样式在文件下方的 .cairn-stone 规则里统一维护 —— 这里只留一个说明，
 * 避免同一个选择器在两处定义、后来者被覆盖的坑（v2.3 初版就这样踩过一次）。

/* 语义色 */
.text-ink { color: var(--ink); }
.text-ink-2 { color: var(--ink-2); }
.text-ink-3 { color: var(--ink-3); }
.text-ink-4 { color: var(--ink-4); }

.text-clay { color: var(--clay); }

.text-amber { color: var(--amber); }

.text-surface { color: var(--surface); }
.bg-bg { background: var(--bg); }
.bg-surface { background: var(--surface); }
.bg-surface-2 { background: var(--surface-2); }
.bg-surface-3 { background: var(--surface-3); }
.bg-accent { background: var(--accent); }
.bg-accent-soft { background: var(--accent-soft); }
.bg-clay-soft { background: var(--clay-soft); }
.bg-slate-soft { background: var(--slate-soft); }
.bg-amber-soft { background: var(--amber-soft); }
.bg-danger-soft { background: var(--danger-soft); }
.border { border: 1px solid var(--line); }
.border-0 { border: 0; }
.border-t { border-top: 1px solid var(--line); }
.border-b { border-bottom: 1px solid var(--line); }
.border-l { border-left: 1px solid var(--line); }
.border-r { border-right: 1px solid var(--line); }
.border-line { border-color: var(--line); }
.border-line-2 { border-color: var(--line-2); }
.border-accent { border-color: var(--accent); }
.border-accent-line { border-color: var(--accent-line); }
.border-dashed { border-style: dashed; }
.border-2 { border-width: 2px; }
.divide-y > * + * { border-top: 1px solid var(--line); }

/* 形状 */
.rounded-sm { border-radius: var(--radius-sm); }
.rounded { border-radius: var(--radius); }
.rounded-lg { border-radius: var(--radius-lg); }

/* 过渡（受“减弱动效”开关与系统偏好双重控制） */
.transition { transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.transition-slow { transition: all 260ms var(--ease); }
[data-motion="reduced"] *, [data-motion="reduced"] *::before, [data-motion="reduced"] *::after {
  transition: none !important;
  animation: none !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}

/* 紧凑排版模式 */
[data-density="compact"] .p-5 { padding: 14px; }
[data-density="compact"] .p-6 { padding: 17px; }
[data-density="compact"] .py-10 { padding-top: 26px; padding-bottom: 26px; }

[data-density="compact"] .gap-8 { gap: 22px; }
[data-density="compact"] .mt-8 { margin-top: 22px; }
[data-density="compact"] .mt-10 { margin-top: 26px; }
[data-density="compact"] .mb-8 { margin-bottom: 22px; }

/* ---------------------------------------------------------------- controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 14px; font-weight: 500;
  background: var(--surface); color: var(--ink);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), opacity var(--dur) var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(.5px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
[data-theme="dim"] .btn-primary { color: #14181A; }
.btn-outline { border-color: var(--line-2); background: transparent; }
.btn-outline:hover { background: var(--surface-2); border-color: var(--ink-4); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
.btn-danger:hover { background: var(--danger-soft); }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: var(--radius); }
.btn-sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 9px; }
.btn-icon-sm { width: 28px; height: 28px; padding: 0; border-radius: 8px; }
.btn-block { width: 100%; }

.input, .textarea, .select {
  width: 100%; height: 38px; padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.input:hover, .textarea:hover, .select:hover { border-color: var(--ink-4); }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
.input::placeholder, .textarea::placeholder { color: var(--ink-4); }
.textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; line-height: 1.6; }
.select { appearance: none; padding-right: 30px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A877D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 9px center; }
.input-lg { height: 46px; font-size: 15px; border-radius: var(--radius); }

/* 大输入框：拆解页的主入口 */
.big-input {
  width: 100%; min-height: 62px; padding: 16px 18px;
  font-size: 17px; line-height: 1.5;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--radius);
  resize: none; overflow: hidden;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.big-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.big-input::placeholder { color: var(--ink-4); }

/* 开关 */
.switch { position: relative; display: inline-flex; width: 40px; height: 23px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--surface-3); border: 1px solid var(--line-2);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.switch span::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 17px; height: 17px; border-radius: 50%;
  background: var(--surface); box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease);
}
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(17px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 分段控件 */
.segment { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: var(--radius-sm); }
.segment button {
  height: 28px; padding: 0 12px; border-radius: 7px;
  font-size: 13px; color: var(--ink-2);
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.segment button:hover { color: var(--ink); }
.segment button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 500; }

/* 标签 */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid transparent; white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip-clay { background: var(--clay-soft); color: var(--clay); }
.chip-slate { background: var(--slate-soft); color: var(--slate); }
.chip-amber { background: var(--amber-soft); color: var(--amber); }
.chip-line { border-color: var(--line); background: transparent; }

/* 卡片 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-flat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

/* 徽标 / 侧边装饰线 */
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px; background: var(--line-2); }
.rail-clay { background: var(--clay); }
.rail-slate { background: var(--slate); }
.rail-accent { background: var(--accent); }

/* 空状态 */
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 56px 24px; }
.empty-state svg { color: var(--ink-4); margin-bottom: 14px; }

/* 顶部导航 */
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.1) blur(10px);
  border-bottom: 1px solid var(--line);
}
@supports not (backdrop-filter: blur(1px)) { .appbar { background: var(--bg); } }

.navlink {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 12px; border-radius: 9px;
  font-size: 14px; color: var(--ink-2);
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.navlink:hover { background: var(--surface-2); color: var(--ink); }
.navlink[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: var(--shadow-sm); }
.navlink[aria-current="page"] .navlink-dot { background: var(--accent); }
.navlink-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4); flex: none; }

/* 步骤 / 子任务行 */
.step-row {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 12px; border-radius: var(--radius-sm);
  transition: background-color var(--dur) var(--ease);
}
.step-row:hover { background: var(--surface-2); }
.step-row.is-done .step-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }

/* 自定义复选框：方正的“放石头”动作 */
.check {
  position: relative; flex: none;
  width: 21px; height: 21px; margin-top: 1px;
  border: 1.5px solid var(--line-2); border-radius: 6px;
  background: var(--surface);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  display: grid; place-items: center;
}
.check:hover { border-color: var(--accent); }
.check svg { width: 13px; height: 13px; color: #fff; opacity: 0; transition: opacity var(--dur) var(--ease); }
.check.checked { background: var(--accent); border-color: var(--accent); }
.check.checked svg { opacity: 1; }
[data-theme="dim"] .check svg { color: #14181A; }

/* 时间线 */
.tl-row { display: flex; align-items: stretch; gap: 12px; min-height: 42px; }
.tl-hour {
  flex: none; width: 56px; padding-top: 2px;
  font-size: 11px; color: var(--ink-3);
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.tl-track { position: relative; flex: 1 1 auto; min-width: 0; border-top: 1px solid var(--line); }
.tl-block {
  position: absolute; left: 0; right: 0;
  border-radius: 8px; padding: 6px 10px;
  font-size: 12.5px; overflow: hidden;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft); color: var(--ink);
  display: flex; align-items: center; gap: 8px;
  transition: filter var(--dur) var(--ease);
}
.tl-block:hover { filter: brightness(.97); }
.tl-block.is-clay { border-left-color: var(--clay); background: var(--clay-soft); }
.tl-block.is-slate { border-left-color: var(--slate); background: var(--slate-soft); }
.tl-block.is-idea { border-left-color: var(--amber); background: var(--amber-soft); }
.tl-nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--danger); z-index: 5; }
.tl-nowline::before {
  content: ''; position: absolute; left: -3px; top: -4px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
}

/* 进度条 */
.progress { height: 5px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 260ms var(--ease); }

/* 计时器表盘 */
.dial { position: relative; width: 236px; height: 236px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial-track { fill: none; stroke: var(--surface-3); stroke-width: 9; }
.dial-fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 500ms linear; }
.dial-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.dial-time { font-size: 46px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
[data-motion="reduced"] .dial-fill { transition: none; }

/* 石堆（进度可视化：每完成一小块就堆一块石头）
 *
 * v2.3：圆角从 999px 的正椭圆改成不对称比例。
 * 为什么用百分比而不是固定值：它按元素自身宽高计算，所以同一条规则
 * 在 62px 宽的底石和 32px 宽的顶石上都能给出协调的弧度。
 * 四个角的水平/垂直半径两两不同，才不会退化成一个椭圆。 */
.cairn-stack { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
.cairn-stone {
  height: 9px;
  border-radius: 52% 48% 50% 50% / 58% 62% 38% 42%;
  background: var(--surface-3); border: 1px solid var(--line-2);
  transition: background-color 260ms var(--ease), border-color 260ms var(--ease);
}
/* 给不同位置的石头不同轮廓，避免整列长得一模一样 */
.cairn-stone:nth-child(2n) { border-radius: 48% 52% 54% 46% / 62% 56% 44% 38%; }
.cairn-stone:nth-child(3n) { border-radius: 51% 49% 46% 54% / 55% 60% 40% 45%; }
.cairn-stone.is-placed { background: var(--accent); border-color: var(--accent); }

/* 弹窗 */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(27, 26, 23, .32);
  display: grid; place-items: center; padding: 24px;
  backdrop-filter: blur(2px);
}
[data-theme="dim"] .modal-backdrop { background: rgba(0,0,0,.55); }
.modal {
  width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  animation: modal-in 180ms var(--ease);
}
@keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
[data-motion="reduced"] .modal { animation: none; }

/* 提示条 */
.toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 10px 16px; border-radius: 999px;
  background: var(--ink); color: var(--bg);
  font-size: 13.5px; box-shadow: var(--shadow-lg);
  animation: toast-in 200ms var(--ease);
}
.toast-accent { background: var(--accent); color: #fff; }
[data-theme="dim"] .toast-accent { color: #14181A; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
[data-motion="reduced"] .toast { animation: none; }

/* 印刷 / 导出 PDF 时保持安静 */
@media print {
  .appbar, .toast-wrap, .no-print { display: none !important; }
  body { background: #fff; }
}

/* --------------------------------------------------------- 桌面壳微调 ---
 * preload.js 会在 <html> 上打 data-host="electron"。
 * 桌面窗口里没有地址栏、标题栏也更紧凑，所以：
 *   · 顶部留白可以少一点，把纵向空间还给内容
 *   · 桌面窗口本身是不透明表面，顶栏不需要"浮在网页上"的模糊观感
 *   · macOS 上要把顶栏内容往右挪，避开红黄绿三个窗口按钮
 * -------------------------------------------------------------------*/
[data-host="electron"] .appbar {
  background: var(--bg);
  backdrop-filter: none;
}
[data-platform="darwin"] .appbar > div:first-child {
  padding-left: 78px;   /* 避开 macOS 的红绿灯按钮 */
}
[data-platform="darwin"] .appbar { -webkit-app-region: drag; }
[data-platform="darwin"] .appbar button,
[data-platform="darwin"] .appbar .segment { -webkit-app-region: no-drag; }

/* ============================================================================
 * Cairn v2.0 新增组件样式
 * ---------------------------------------------------------------------------
 * 石堆可视化、周配额条、两周热力条、引导进度圆点、当天结束时间条。
 * 全部遵守低刺激纪律：不用渐变、不做庆祝动效、不靠颜色表达"失败"。
 * ==========================================================================*/

/* ---------------------------------------------------------- 石堆可视化 --- */
.pile {
  display: flex;
  flex-direction: column-reverse;   /* 从下往上堆 */
  align-items: center;
  gap: 3px;
}
.pile-sm { min-height: 34px; }
.pile-md { min-height: 62px; }
.pile-lg { min-height: 108px; }
.pile-empty { justify-content: center; }

.pile-stone {
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--line-2);
}
.pile-sm .pile-stone { height: 5px !important; }
.pile-md .pile-stone { height: 8px !important; }
.pile-lg .pile-stone { height: 11px !important; }
.pile-stone.is-on {
  background: var(--accent);
  border-color: var(--accent);
}

/* ------------------------------------------------------------ 周配额条 --- */
.week-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.week-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 0 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.week-cell-dot {
  width: 100%;
  max-width: 26px;
  height: 12px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.week-cell.is-met .week-cell-dot {
  background: var(--accent);
  border-color: var(--accent);
}
.week-cell.is-today {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent-line);
}
.week-cell.is-future { opacity: .45; }
.week-cell-label {
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1;
}
.week-cell.is-today .week-cell-label { color: var(--accent); font-weight: 600; }

/* --------------------------------------------------------- 两周热力条 --- */
.heat-row {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 4px;
}
.heat-cell {
  height: 26px;
  border-radius: 5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
/* 只有"动过的日子"才着色。空白日保持中性 —— 不画叉、不用灰色表达"缺失"，
 * 这是 RSD 友好与"愧疚驱动"之间的那条线。 */
.heat-cell.heat-lv1 { background: var(--accent-soft); border-color: var(--accent-line); }
.heat-cell.heat-lv2 { background: var(--accent-line); border-color: var(--accent-line); }
.heat-cell.heat-lv3 { background: var(--accent); border-color: var(--accent); }

/* ------------------------------------------------------- 引导进度圆点 --- */
.ob-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--surface-3);
  transition: background-color var(--dur) var(--ease), width var(--dur) var(--ease);
}
.ob-dot.is-on {
  background: var(--accent);
  width: 20px;
  border-radius: 999px;
}

/* -------------------------------------------------- 导航徽标 / 结束时间 --- */
.navlink .nav-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  border-radius: 999px;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  background: var(--surface-2);
  color: var(--ink-3);
}
.navlink[aria-current="page"] .nav-badge {
  background: var(--accent-soft);
  color: var(--accent);
}
.navlink .nav-badge.is-met {
  background: var(--accent);
  color: #fff;
}
[data-theme="dim"] .navlink .nav-badge.is-met { color: #14181A; }

.day-end {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.day-end.is-late {
  background: var(--amber-soft);
  border-color: var(--amber);
}
.day-end-time {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 18px;
}

/* 估时被自动调整时的标记 */
.est-adjusted {
  color: var(--accent);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

/* ------------------------------------------------------- 首次引导布局 ---
 * 引导是一整屏的"介绍"，内容本身只有三百多像素高。
 * 早期版本让它自然流式排列，结果全部贴在窗口顶部、下面一大片空白 ——
 * 看起来像页面没加载完。
 *
 * 这里做两件事：
 *   1) data-onboarding 激活时把主区域变成 flex 列并垂直居中。
 *      用 min-height:100% 而不是 height:100%：内容若超出仍可自然增高，
 *      不会出现被裁掉的情况。桌面窗口最矮 640px（main.js 里的 minHeight），
 *      减去 56px 导航后仍比内容高，所以居中一定成立。
 *   2) 引导容器限宽 420px 并居中 —— 引导是"一次说一件事"，
 *      宽屏下铺满会让文字行过长、注意力散掉。
 * -------------------------------------------------------------------*/
main[data-onboarding="1"] {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: calc(100vh - 56px);
}
.ob-wrap {
  width: 100%;
  /* 520px 而不是 420px：第一屏的标题是 14 个中文字、字号 24px，
   * 420px 宽会让最后一个字单独掉到第二行（"开始不了"的"了"）。
   * 520px 能容下整句，同时正文仍靠 max-w-prose 限宽保持行长可读。 */
  max-width: 520px;
  margin: 0 auto;
}
/* 引导底部的操作条：跳过在左、下一步在右，与卡片同宽 */
.ob-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
}

/* ============================================================================
 * 手机端适配（Cairn v2.1）
 * ---------------------------------------------------------------------------
 * 目标：同一份代码在手机上看起来像原生 App，而不是"把网页缩小"。
 *
 * 这一节的关键取舍：
 *   1) 导航从顶部挪到底部。手机是单手操作的，拇指够不到屏幕顶部；
 *      而且六个导航项在窄屏上会折成两行，把内容挤下去。
 *   2) 触摸目标一律放大到 44px 以上 —— 这是 iOS 人机界面指南的最小值。
 *      ADHD 人群手部精细动作控制往往也偏弱，小按钮是真实的可用性障碍。
 *   3) 输入框字号强制 16px。iOS Safari 在字号小于 16px 时会在聚焦瞬间
 *      **自动放大整个页面**，而且不会自动缩回去 —— 最典型的移动端恶感来源。
 *   4) 用 env(safe-area-inset-*) 避开 iPhone 的底部横条与刘海。
 *
 * 断点选 860px 而不是常见的 768px：桌面上 768~860px 的窗口仍然宽裕，
 * 而手机横屏（iPhone 15 横屏约 852px）需要走移动布局。
 * ==========================================================================*/

/* 底部导航在桌面上不显示，只由 JS 在手机断点下渲染内容 */
.mobile-nav { display: none; }

@media (max-width: 860px) {

  /* ------------------------------------------- 顶部栏：只留品牌与动作按钮 --- */
  .appbar > .max-w-2xl { height: 52px !important; gap: 8px; }
  /* 导航项移到下面的 .mobile-nav，顶部栏里隐藏 */
  .appbar .navlink { display: none; }
  /* 窄屏下顶部的石堆标志去掉，避免和右侧三个按钮挤在一起 */
  .appbar .brand-mark { display: none; }
  /* v2.3：手绘字标同理 —— 手机顶栏只留三个动作按钮 */
  .appbar .brand-wordmark { display: none; }
  .appbar .max-w-2xl > div:last-child { margin-left: 0; }

  /* ------------------------------------------------------ 底部固定导航 --- */
  .mobile-nav {
    display: flex;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter: saturate(1.1) blur(12px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);   /* 避开 iPhone 底部横条 */
  }
  @supports not (backdrop-filter: blur(1px)) {
    .mobile-nav { background: var(--bg); }
  }

  .mobile-nav-inner {
    display: flex;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 4px;
  }
  .mnav-item {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 56px;              /* 44px 是触摸目标底线，加标签后约 56px */
    padding: 6px 2px;
    border-radius: 10px;
    color: var(--ink-3);
    font-size: 10.5px;
    line-height: 1.1;
    position: relative;
    background: none;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mnav-item .mnav-label {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mnav-item[aria-current="page"] {
    color: var(--accent);
    font-weight: 600;
  }
  .mnav-item[aria-current="page"]::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent);
  }
  .mnav-item .nav-badge {
    position: absolute;
    top: 3px;
    left: 50%;
    margin-left: 7px;
    min-width: 16px;
    height: 15px;
    padding: 0 4px;
    font-size: 9.5px;
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .mnav-item[aria-current="page"] .nav-badge { background: var(--accent); color: #fff; }
  [data-theme="dim"] .mnav-item[aria-current="page"] .nav-badge { color: #14181A; }

  /* --------------------------------------- 内容区：给底部导航让出空间 --- */
  #view {
    padding-left: 14px !important;
    padding-right: 14px !important;
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)) !important;
  }
  /* 引导页期间导航是隐藏的，不需要留那么多底部空间 */
  #view[data-onboarding="1"] {
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) !important;
    min-height: calc(100dvh - 52px);
  }

  /* -------------------------------------------------------- 触摸目标 --- */
  .btn { height: 44px; padding: 0 18px; font-size: 15px; }
  .btn-sm { height: 38px; padding: 0 14px; font-size: 14px; }
  .btn-lg { height: 50px; font-size: 16px; }
  .btn-icon { width: 44px; height: 44px; }
  .btn-icon-sm { width: 38px; height: 38px; }

  /* 21px 的复选框在手机上点不中 */
  .check { width: 26px; height: 26px; border-radius: 7px; }
  .check svg { width: 15px; height: 15px; }

  .step-row { padding: 13px 10px; gap: 12px; }
  .chip { height: 28px; padding: 0 11px; font-size: 12.5px; }
  .segment button { height: 36px; padding: 0 14px; }

  /* ----------------------------------- 输入框：16px 防 iOS 聚焦自动放大 --- */
  .input, .textarea, .select, .big-input { font-size: 16px !important; }
  .input, .select { height: 46px; }
  .big-input { min-height: 68px; padding: 16px; }

  /* ------------------------------------------------- 时间线：手机上压缩 --- */
  .tl-hour { width: 46px; font-size: 10.5px; }
  .tl-block { font-size: 11.5px; padding: 5px 8px; }
  .day-end { padding: 12px 14px; }

  /* ------------------------------------------------------------ 其他 --- */
  h1.text-3xl { font-size: 26px; }
  .dial { width: 208px; height: 208px; }
  .dial-time { font-size: 40px; }
  /* 弹窗贴底显示，单手更容易够到 */
  .modal-backdrop { padding: 16px; align-items: flex-end; }
  .modal { max-height: 88dvh; }
  /* 14 天热力条在窄屏上会挤成一团，改成 7 列两行 */
  .heat-row { grid-template-columns: repeat(7, 1fr); }
  .week-cell { padding: 10px 0 8px; }
  .week-cell-dot { max-width: 100%; height: 14px; }
}

/* 更窄的手机（iPhone SE 等）：进一步收紧 */
@media (max-width: 380px) {
  .mnav-item { font-size: 10px; }
  .btn { padding: 0 14px; }
  h1.text-2xl { font-size: 22px; }
  h1.text-xl { font-size: 18px; }
}

/* 手机横屏：底部导航会占掉宝贵高度，压缩一些 */
@media (max-width: 860px) and (orientation: landscape) {
  .mobile-nav-inner { max-width: 560px; }
  .mnav-item { min-height: 46px; font-size: 10px; }
  #view { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) !important; }
}

/* -------------------------------------------------------- PWA 独立窗口 --- */
/* 装到桌面后以 standalone 运行：没有浏览器地址栏，顶部可以更紧凑 */
@media (display-mode: standalone) {
  #view { padding-top: 12px; }
}
/* iOS 独立模式：顶部要给状态栏留出空间（它不像 Android 那样有系统栏） */
@supports (-webkit-touch-callout: none) {
  @media (display-mode: standalone) {
    .appbar { padding-top: env(safe-area-inset-top, 0px); }
  }
}


</style>
</head>
<body>

<!-- 顶部导航：由 JS 渲染（paintAppbar），保证语言与状态同步。
     手机上这里只留品牌与右侧动作按钮，导航项移到底部的 .mobile-nav -->
<header class="appbar" id="appbar"></header>

<!-- 视图容器 -->
<main id="view" class="px-4 py-6" role="main"></main>

<!-- 底部导航（仅手机端显示，由 JS 渲染）。
     手机上拇指够不到屏幕顶部，所以主导航放到底部；
     桌面端由 CSS 隐藏这个容器，继续用顶部导航。 -->
<nav class="mobile-nav" id="mobile-nav" role="tablist" aria-label="主导航"></nav>

<!-- 弹窗与提示条挂载点 -->
<div id="modal-root"></div>

<script>
/* ============================================================================
 * Cairn · brand.js
 * ---------------------------------------------------------------------------
 * The mark: three stacked stones, drawn as a pure geometry cairn.
 *   - No text inside the artwork, so it works as an app icon, a favicon and a
 *     presentation logo without any language dependency.
 *   - Hand-built from ellipses instead of a copied icon font, which keeps the
 *     whole prototype dependency-free and legally clean.
 *   - Colours are hard-coded hex (never `currentColor`) so the file can be
 *     rasterised by sharp / electron-builder without a browser.
 * ==========================================================================*/

var BRAND = (function () {

  /* --------------------------------------------------------------------------
   * 色板（v2.3 起）
   * -------------------------------------------------------------------------
   * v2.3 之前只有一个强调色（苔绿），因为当时的立场是"越少颜色越安静"。
   * 但参考图给了一个更好的答案：真实石堆不是单色的，它是沙滩上灰、暖沙、
   * 海蓝混在一起 —— 颜色多，但饱和度低，所以仍然安静。
   *
   * 所以这里从 1 个强调色扩展成一组"海滩卵石色"：
   *   MOSS   苔绿    品牌主色，强调按钮与完成态（沿用，不改）
   *   SAND   暖沙    次要底色，用于卡片分隔与低能量标记
   *   SEA    海蓝    极少量的信息色（时间线、链接）
   *   PEBBLE 卵石灰  中性辅助
   *   CLAY   陶土    高能量标记（沿用）
   *
   * 底线：所有颜色饱和度都压在 30% 以下，且保证文字对比度仍达 WCAG AA。
   * 不会因为"加颜色"就让界面变吵 —— 这是 ADHD 产品的红线。
   * -----------------------------------------------------------------------*/
  var MOSS   = '#5E7F6B';
  var MOSS_D = '#4C6A59';
  var SAND   = '#D8CBB2';
  var SEA    = '#6E8CA0';
  var PEBBLE = '#9AA19E';
  var CLAY   = '#A9776A';
  var STONE  = '#FFFFFF';
  var INK    = '#24231F';
  var PAPER  = '#F7F4EE';

  /* --------------------------------------------------------------------------
   * 石头的不规则轮廓
   * -------------------------------------------------------------------------
   * v2.3 之前石头是标准椭圆，干净但太"矢量"了，跟参考图里那些被海水磨圆的
   * 卵石差得远。现在每块石头由 8 个半径系数定义轮廓，再用 Catmull-Rom 转成
   * 三次贝塞尔，得到真正的不规则鹅卵石。
   *
   * 关键约束：**必须完全确定性**。
   * 不能用 Math.random() —— 那样每次 render 石头形状都会变，对 ADHD 用户
   * 来说是持续的背景噪声。所以这些系数是手写死的常量。
   *
   * 垂直方向仍然留出 6~8px 缝隙，每块也仍水平错开：真实石堆就是这样摞的，
   * 而且缝隙是"缩到 24px 还能认出是三块石头"的关键。
   * -----------------------------------------------------------------------*/
  var STONES = [
    /* 底石：最大、最扁，贴地 */
    { cx: 66, cy: 172, rx: 52, ry: 20.5, rot: -3,
      ks: [0.96, 1.03, 0.99, 1.04, 0.97, 1.02, 0.98, 1.01] },
    /* 中石：略微向右偏 */
    { cx: 61, cy: 129, rx: 39, ry: 16.5, rot: 2,
      ks: [1.02, 0.97, 1.04, 0.98, 1.01, 0.96, 1.03, 0.99] },
    /* 顶石：最小，歪一点，像随手放上去的 */
    { cx: 70, cy:  88, rx: 26, ry: 13, rot: -5,
      ks: [0.97, 1.04, 0.98, 1.02, 1.03, 0.97, 1.02, 0.99] }
  ];
  var BOX = { x: 14, y: 66, w: 104, h: 127 };  /* stones 的内容包围盒 */

  /* 把一圈点连成平滑闭合曲线（Catmull-Rom → 三次贝塞尔）。
   *
   * 为什么不用 'Q' 二次曲线逐个连：二次曲线在连接点会有可见的折角，
   * 而卵石轮廓必须是处处光滑的。Catmull-Rom 的切线在控制点处连续，
   * 所以每段的三次贝塞尔控制点可以直接由相邻两点算出。 */
  function smoothClosedPath(pts) {
    var n = pts.length;
    var d = 'M ' + r2(pts[0][0]) + ' ' + r2(pts[0][1]);
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n];
      var p1 = pts[i];
      var p2 = pts[(i + 1) % n];
      var p3 = pts[(i + 2) % n];
      /* Catmull-Rom 的切线 = (p2 - p0) / 6，两端的控制点各取一半 */
      var c1x = p1[0] + (p2[0] - p0[0]) / 6;
      var c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6;
      var c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ' C ' + r2(c1x) + ' ' + r2(c1y) + ' ' + r2(c2x) + ' ' + r2(c2y) +
           ' ' + r2(p2[0]) + ' ' + r2(p2[1]);
    }
    return d + ' Z';
  }

  /* 由中心、半径、半径系数、旋转角生成一块卵石的 path */
  function pebblePath(s) {
    var n = s.ks.length;
    var rad = (s.rot || 0) * Math.PI / 180;
    var cos = Math.cos(rad), sin = Math.sin(rad);
    var pts = [];
    for (var i = 0; i < n; i++) {
      /* 从正上方开始顺时针取点 */
      var a = (i / n) * Math.PI * 2 - Math.PI / 2;
      var px = Math.cos(a) * s.rx * s.ks[i];
      var py = Math.sin(a) * s.ry * s.ks[i];
      /* 绕中心旋转，让每块石头的长轴方向略有不同 */
      pts.push([s.cx + px * cos - py * sin, s.cy + px * sin + py * cos]);
    }
    return smoothClosedPath(pts);
  }

  function stones(fill, stroke, sw) {
    return STONES.map(function (s, i) {
      /* 逐块加 260ms 的轻微延迟，形成"一块一块放上去"的节奏感 */
      return '<path d="' + pebblePath(s) + '"' +
             ' fill="' + fill + '"' +
             (stroke ? ' stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linejoin="round"' : '') +
             ' class="cairn-stone-anim" style="animation-delay:' + (i * 260) + 'ms"/>';
    }).join('');
  }

  /* --------------------------------------------------------------------------
   * 手绘字标 CAIRN（v2.3 新增）
   * -------------------------------------------------------------------------
   * 参考图里最抓人的是那个粗笔手写体的 "CAIRN"。这里用**描边路径**把它画出来，
   * 而不是找一款字体：
   *   · 字体要外链或内嵌，前者违反零外部请求，后者会让文件体积暴涨
   *   · 手绘路径是纯矢量，sharp / electron-builder / 浏览器都能渲染，
   *     而且缩放无损、可以用任意颜色
   *
   * 手写感的来源（三处细节，缺一处就会变回"印刷体"）：
   *   ① 笔画的粗细不一：C 最粗（27），I 最细（25）—— 真实马克笔压感不同
   *   ② 笔画不是直线：I 有轻微 S 形弯曲，A 的两条腿向外微微鼓出
   *   ③ 每根笔画略高于/低于基准线 1~2px，就像手写时对齐得没那么准
   *
   * 为什么不写中文：中文字形太多，手绘不现实；嵌入手写中文字体会让文件从
   * 300 KB 涨到好几 MB，直接破坏"单文件离线"这条底线。中文仍用系统字重 +
   * 字距调整去靠近这个气质。
   * -----------------------------------------------------------------------*/
  var WORDMARK_VB = '0 0 424 152';

  function wordmarkSVG(height, color, opts) {
    opts = opts || {};
    var h = height || 40;
    var w = h * 424 / 152;
    var c = color || MOSS;

    /* 每个字母单独一段 path，stroke-width 各不相同 —— 这是手写感的第一个来源 */
    var letters = [
      /* C：开口朝右的圆弧，粗 27 */
      { w: 27, d: 'M 79.5 51.5 A 33 33 0 1 0 79.5 100.5' },
      /* A：两条微微外鼓的腿 + 略微上弯的横杠，粗 26 */
      { w: 26, d: 'M 124.5 118.5 Q 139 63 152 31.5 Q 165.5 63 181.5 118.5' },
      { w: 24, d: 'M 136.5 89 Q 152.5 92.5 169 88.5' },
      /* I：带轻微 S 形的竖，粗 25 */
      { w: 25, d: 'M 224 31.5 Q 218.5 75 222.5 118.5' },
      /* R：竖 + 鼓出的碗 + 甩出去的腿，粗 26 */
      { w: 26, d: 'M 261.5 118.5 Q 260 75 261.5 31.5' },
      { w: 25, d: 'M 261.5 31.5 Q 301 33 301 53 Q 301 74 261.5 75' },
      { w: 26, d: 'M 288 77.5 Q 303 97 317 118.5' },
      /* N：两竖 + 一条略带弧的对角线，粗 27 */
      { w: 27, d: 'M 352 118.5 Q 349.5 75 352 31.5' },
      { w: 25, d: 'M 353 34 Q 373 72 396.5 115' },
      { w: 27, d: 'M 396.5 118.5 Q 399 75 396.5 31.5' }
    ];

    var body = letters.map(function (L) {
      return '<path d="' + L.d + '" stroke-width="' + L.w + '"/>';
    }).join('');

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + WORDMARK_VB + '"' +
      ' width="' + r2(w) + '" height="' + r2(h) + '" fill="none" stroke="' + c + '"' +
      ' stroke-linecap="round" stroke-linejoin="round"' +
      (opts.cls ? ' class="' + opts.cls + '"' : '') +
      ' role="img" aria-label="Cairn">' + body + '</svg>';
  }

  /* ---------------------------------------------------------------- 图标 ---
   * 24×24 线性图标集。统一 1.6 圆角描边，保持“安静”的视觉密度。
   * ----------------------------------------------------------------------*/
  function icon(name, size, cls) {
    var s = size || 20;
    var body = ICONS[name] || ICONS.dot;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none"' +
           ' stroke="currentColor" stroke-width="1.6" stroke-linecap="round"' +
           ' stroke-linejoin="round" aria-hidden="true"' +
           (cls ? ' class="' + cls + '"' : '') + '>' + body + '</svg>';
  }

  var ICONS = {
    /* 拆解：大块 → 小块的向下分流 */
    breakdown: '<path d="M12 3v5"/><path d="M12 8 6.5 12.5"/><path d="M12 8l5.5 4.5"/>' +
               '<rect x="2.5" y="13" width="8" height="6" rx="1.8"/>' +
               '<rect x="13.5" y="13" width="8" height="6" rx="1.8"/>' +
               '<path d="M6.5 19v2"/><path d="M17.5 19v2"/>',
    /* 当前：单任务，屏幕中央只有一条 */
    target: '<circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3"/>',
    /* 时间线：时间块 */
    timeline: '<rect x="3" y="4.5" width="4.5" height="15" rx="1.6"/>' +
              '<rect x="9.5" y="4.5" width="4.5" height="9" rx="1.6"/>' +
              '<rect x="16" y="4.5" width="4.5" height="6" rx="1.6"/>',
    /* 专注：计时 */
    timer: '<circle cx="12" cy="13.5" r="7.6"/><path d="M12 10v3.8l2.4 1.6"/>' +
           '<path d="M9.2 3.2h5.6"/>',
    /* 灵感：灯泡 */
    bulb: '<path d="M9 17.4h6"/><path d="M10 20.4h4"/>' +
          '<path d="M12 3.4a5.6 5.6 0 0 0-3.3 10.1c.5.4.8 1 .8 1.6v.5h5v-.5c0-.6.3-1.2.8-1.6A5.6 5.6 0 0 0 12 3.4Z"/>',
    /* 设置：滑杆 */
    settings: '<path d="M4 7h9"/><path d="M17 7h3"/><path d="M4 17h3"/><path d="M11 17h9"/>' +
              '<circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    x: '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
    chevronLeft: '<path d="m14.5 5-7 7 7 7"/>',
    chevronRight: '<path d="m9.5 5 7 7-7 7"/>',
    chevronDown: '<path d="m5 9.5 7 7 7-7"/>',
    arrowRight: '<path d="M4 12h15"/><path d="m13 6 6 6-6 6"/>',
    play: '<path d="M7.5 5.2v13.6L19 12 7.5 5.2Z" fill="currentColor" stroke-linejoin="round"/>',
    pause: '<rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/>' +
           '<rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/>',
    reset: '<path d="M4.6 10.2A7.6 7.6 0 1 1 4.8 15"/><path d="M4.4 5.4v5h5"/>',
    trash: '<path d="M4.5 7h15"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/>' +
           '<path d="M6.5 7l.9 12.1A1.6 1.6 0 0 0 9 20.6h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/>' +
           '<path d="M10.5 11v6"/><path d="M13.5 11v6"/>',
    edit: '<path d="M16.8 4.6a2 2 0 0 1 2.8 2.8L8.4 18.6 4 20l1.4-4.4Z"/>',
    sun: '<circle cx="12" cy="12" r="4.2"/>' +
         '<path d="M12 2.6v2.2"/><path d="M12 19.2v2.2"/><path d="M2.6 12h2.2"/><path d="M19.2 12h2.2"/>' +
         '<path d="m5.4 5.4 1.6 1.6"/><path d="m17 17 1.6 1.6"/><path d="m18.6 5.4-1.6 1.6"/><path d="m7 17-1.6 1.6"/>',
    moon: '<path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/>',
    globe: '<circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8"/>' +
           '<path d="M12 3.6c2.2 2.4 3.3 5.3 3.3 8.4S14.2 18 12 20.4C9.8 18 8.7 15.1 8.7 12S9.8 6 12 3.6Z"/>',
    download: '<path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 18.5h14"/>',
    upload: '<path d="M12 15V5"/><path d="m8 8.5 4-4 4 4"/><path d="M5 18.5h14"/>',
    spark: '<path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.4l-1.9-5.6L4.5 10.9 10.1 9Z"/>' +
           '<path d="M18.6 3.4v2.6"/><path d="M17.3 4.7h2.6"/>',
    box: '<path d="M3.5 7.6 12 3.5l8.5 4.1v8.8L12 20.5l-8.5-4.1Z"/>' +
         '<path d="M3.5 7.6 12 11.7l8.5-4.1"/><path d="M12 11.7v8.8"/>',
    restore: '<path d="M4.5 10.5A7.6 7.6 0 1 1 5 15.4"/><path d="M4.3 5.6v5h5"/>',
    clock: '<circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/>',
    brain: '<path d="M12 5.2a3 3 0 0 0-5.6 1.2c-1.4.5-2.2 1.9-1.8 3.4-1 .9-1.2 2.5-.4 3.7.6 1 .6 2.2.2 3.3.8 1.3 2.4 1.8 3.8 1.2A3 3 0 0 0 12 19V5.2Z"/>' +
           '<path d="M12 5.2a3 3 0 0 1 5.6 1.2c1.4.5 2.2 1.9 1.8 3.4 1 .9 1.2 2.5.4 3.7-.6 1-.6 2.2-.2 3.3-.8 1.3-2.4 1.8-3.8 1.2A3 3 0 0 1 12 19"/>',
    battery: '<rect x="2.6" y="8" width="16" height="8" rx="2.2"/><path d="M21.4 11v2"/>' +
             '<rect x="5" y="10.4" width="6" height="3.2" rx="1" fill="currentColor" stroke="none"/>',
    leaf: '<path d="M20 4.5c-8.5-.6-13 3-13 8.2 0 2.5 1.1 4.6 2.6 5.9C11.5 13.5 15 10.6 20 9.6"/>' +
          '<path d="M4.2 20.2c.6-2.6 1.5-4.9 2.9-6.7"/>',
    coffee: '<path d="M4.5 6.5h12v7.2a4.4 4.4 0 0 1-4.4 4.4H8.9a4.4 4.4 0 0 1-4.4-4.4Z"/>' +
            '<path d="M16.5 8h1.8a2.6 2.6 0 0 1 0 5.2h-1.8"/><path d="M4 20.6h13"/>',
    dot: '<circle cx="12" cy="12" r="3.4"/>',
    info: '<circle cx="12" cy="12" r="8.4"/><path d="M12 11v5.4"/><path d="M12 7.8h.01"/>',
    keyboard: '<rect x="2.6" y="6.5" width="18.8" height="11" rx="2.2"/>' +
              '<path d="M6.6 10h.01"/><path d="M10 10h.01"/><path d="M13.4 10h.01"/><path d="M16.8 10h.01"/>' +
              '<path d="M8 13.8h8"/>',
    layers: '<path d="M12 3.4 21 8l-9 4.6L3 8Z"/><path d="m3.6 12.4 8.4 4.3 8.4-4.3"/>' +
            '<path d="m3.6 16.5 8.4 4.3 8.4-4.3"/>',
    flag: '<path d="M6 20.5V3.8"/><path d="M6 4.8h10.5l-2 3.4 2 3.4H6"/>',
    list: '<path d="M8 6.5h11"/><path d="M8 12h11"/><path d="M8 17.5h11"/>' +
          '<path d="M4 6.5h.01"/><path d="M4 12h.01"/><path d="M4 17.5h.01"/>',
    undo: '<path d="M9 7 4.6 11.4 9 15.8"/><path d="M4.6 11.4h9.2a5.6 5.6 0 0 1 0 11.2H10"/>'
  };

  /* --------------------------------------------------------------- LOGO ---
   * 以下两个锁定版返回的是 HTML 而不是 SVG。
   * 原因：LOGO 里的副标与中文需要真实的字体渲染，而 sharp / librsvg 在渲染
   * SVG <text> 时用的是极简内置字体，中文字形会变成方框。把锁定版做成 HTML
   * 再交给 Chrome 截图，才能保证"所见即所得"，且中英文都不会跑版。
   *
   * v2.3：字标从 Georgia 衬线字换成手绘 SVG 路径 —— 这是整个品牌视觉里
   * 最靠近参考图的一处改动。口号则用大写 + 宽字距去模拟手写小字。
   * ----------------------------------------------------------------------*/

  /* 口号的排版样式：大写、宽字距、粗。
   * 参考图里 "SMALL STEPS GO FAR." 是手写小字，字距拉得很开 ——
   * 用系统字体 + letter-spacing 能拿到 80% 的味道，且不需要内嵌字体。 */
  function sloganStyle(size, color) {
    return 'font-family:' + SANS + ';font-size:' + size + 'px;line-height:1.5;' +
      'font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:' + color;
  }

  function logoHorizontal(opts) {
    opts = opts || {};
    var tagline = opts.tagline || '';
    var theme = opts.theme || 'light';
    var fg = theme === 'dim' ? '#B9B5AC' : '#6F6B5E';
    return '' +
      '<div class="logo-lockup" style="display:flex;align-items:center;gap:26px;' +
        'font-family:' + SANS + ';background:transparent">' +
        '<div style="flex:none;width:78px;height:78px">' + markSVG(78, MOSS) + '</div>' +
        '<div style="display:flex;flex-direction:column;justify-content:center">' +
          '<div style="line-height:1;color:' + MOSS + '">' + wordmarkSVG(52, MOSS) + '</div>' +
          (tagline
            ? '<div style="' + sloganStyle(11, fg) + ';margin-top:10px;white-space:nowrap">' +
              esc(tagline) + '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* 堆叠版：图标在上、字标在下，用于 PPT 首页与报告封面 */
  function logoStacked(opts) {
    opts = opts || {};
    var tagline = opts.tagline || '';
    var theme = opts.theme || 'light';
    var fg = theme === 'dim' ? '#A9A69F' : '#6F6B5E';
    return '' +
      '<div class="logo-lockup" style="display:inline-flex;flex-direction:column;' +
        'align-items:center;background:transparent;font-family:' + SANS + '">' +
        '<div style="width:152px;height:152px">' + markSVG(152, MOSS) + '</div>' +
        '<div style="line-height:1;margin-top:18px">' + wordmarkSVG(62, MOSS) + '</div>' +
        (tagline
          ? '<div style="' + sloganStyle(12, fg) + ';margin-top:14px;text-align:center;' +
            'max-width:460px">' + esc(tagline) + '</div>'
          : '') +

  var SERIF = "Georgia,'Times New Roman',serif";
  var SANS = "'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif";
  var CJK = "'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif";

  /* 纯图标（网页内联用）。颜色可用 currentColor 跟随主题。 */
  function glyph(size, color) {
    return markSVG(size, color || MOSS);
  }

  /* 只画石堆的独立 SVG，尺寸精确、无留白浪费 */
  function markSVG(width, color) {
    var w = width || 60;
    var h = w * BOX.h / BOX.w;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
           BOX.x + ' ' + BOX.y + ' ' + BOX.w + ' ' + BOX.h + '" width="' + r2(w) +
           '" height="' + r2(h) + '" fill="' + (color || MOSS) + '"' +
           ' aria-hidden="true" style="display:block;width:100%;height:100%">' +
           stones(color || MOSS, 'none', 0) + '</svg>';
  }

  /* 石堆进度组件：total 块石头，placed 块已放好
   *
   * v2.3 调整了两处，都是为了"看起来像一摞石头"而不是"一把梳子"：
   *   ① 上限从 24 降到 14 —— 24 块时整列有 288px 高，视觉上变成一根尺子
   *   ② 收窄幅度从 62→32 改成 64→18 —— 真实的石堆往上明显变细
   * 宽度加一点确定性的抖动（i%3），让每块石头的边缘不完全对齐。 */
  function stack(total, placed, maxShown) {
    var cap = maxShown || 10;
    var n = Math.min(total || 0, cap);
    if (n <= 0) return '';
    var html = '<div class="cairn-stack" role="img" aria-label="' + placed + '/' + (total || 0) + '">';
    for (var i = 0; i < n; i++) {
      /* 越往上越窄，模拟真实石堆的收窄轮廓 */
      var t = i / Math.max(n - 1, 1);
      var wpx = Math.round(64 - t * 46) + (i % 3);
      html += '<div class="cairn-stone' + (i < (placed || 0) ? ' is-placed' : '') + '"' +
              ' style="width:' + wpx + 'px"></div>';
    }
    return html + '</div>';
  }

  /* ------------------------------------------------------- 原始图标 SVG ---
   * 供构建脚本写出 .ico / .png 使用。纯几何、无文字，任何渲染器都能画对。
   * ----------------------------------------------------------------------*/
  function appIconSVG(size, withBackground) {
    var s = size || 512;
    var sc = 1.30;
    var cx = 128, cy = 128;                     /* 画布中心 */
    var mx = (BOX.x + BOX.w / 2) * sc;          /* 石堆在画布上的视觉中心 */
    var my = (BOX.y + BOX.h / 2) * sc;
    var tx = r2(cx - mx), ty = r2(cy - my - 4);
    return '' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="' + s + '" height="' + s + '">' +
        (withBackground === false ? '' : '<rect width="256" height="256" rx="56" fill="' + MOSS + '"/>') +
        '<g transform="translate(' + tx + ',' + ty + ') scale(' + sc + ')">' +
          stones(STONE, 'none', 0) +
        '</g>' +
      '</svg>';
  }

  /* 浅底版：用于报告内插图、任务栏小图标 */
  function appIconMono(size, fg, bgFill) {
    var s = size || 512;
    var sc = 1.30, cx = 128, cy = 128;
    var mx = (BOX.x + BOX.w / 2) * sc, my = (BOX.y + BOX.h / 2) * sc;
    return '' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="' + s + '" height="' + s + '">' +
        (bgFill ? '<rect width="256" height="256" rx="56" fill="' + bgFill + '"/>' : '') +
        '<g transform="translate(' + r2(cx - mx) + ',' + r2(cy - my - 4) + ') scale(' + sc + ')">' +
          stones(fg || MOSS, 'none', 0) +
        '</g>' +
      '</svg>';
  }

  /* ------------------------------------------------------- maskable 图标 ---
   * Android 会把桌面图标裁成圆形、圆角方形或水滴形，具体形状由手机厂商决定。
   * 如果直接拿普通图标去用，四周会被裁掉 —— 石堆的顶石和底石都会缺一块。
   *
   * 规范要求：内容必须落在**中心直径 80% 的安全圆**内。
   * 所以这里把石堆缩小到 0.86 倍并居中，四周留出被裁掉也不心疼的余量，
   * 同时底色铺满整个画布（不能留透明，否则裁切后边缘会露出背景色）。
   * ----------------------------------------------------------------------*/
  function appIconMaskable(size) {
    var s = size || 512;
    var sc = 0.86 * 1.16;                 /* 比普通图标更小，留出安全边距 */
    var cx = 128, cy = 128;
    var mx = (BOX.x + BOX.w / 2) * sc;
    var my = (BOX.y + BOX.h / 2) * sc;
    return '' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="' + s + '" height="' + s + '">' +
        /* 底色铺满、不留圆角：圆角由系统裁切决定，自己再画圆角会露出白边 */
        '<rect width="256" height="256" fill="' + MOSS + '"/>' +
        '<g transform="translate(' + r2(cx - mx) + ',' + r2(cy - my) + ') scale(' + r2(sc) + ')">' +
          stones(STONE, 'none', 0) +
        '</g>' +
      '</svg>';
  }

  /* LOGO 专用：只返回石堆分组，可嵌进其它 SVG */
  function mark(fill, stroke, sw) {
    return '<g>' + stones(fill || MOSS, stroke || 'none', sw || 0) + '</g>';
  }

  /* favicon：内联 data URI，避免任何外部请求 */
  function faviconDataURI() {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(appIconSVG(64, true));
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function r2(n) { return Math.round(n * 100) / 100; }

  return {
    MOSS: MOSS, MOSS_D: MOSS_D, SAND: SAND, SEA: SEA, PEBBLE: PEBBLE, CLAY: CLAY,
    STONE: STONE, INK: INK, PAPER: PAPER,
    SERIF: SERIF, SANS: SANS, CJK: CJK,
    BOX: BOX,
    icon: icon,
    ICONS: ICONS,
    mark: mark,
    markSVG: markSVG,
    wordmarkSVG: wordmarkSVG,
    glyph: glyph,
    stack: stack,
    logoHorizontal: logoHorizontal,
    logoStacked: logoStacked,
    appIconSVG: appIconSVG,
    appIconMono: appIconMono,
    appIconMaskable: appIconMaskable,
    faviconDataURI: faviconDataURI
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = BRAND;

}
