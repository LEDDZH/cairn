/* ---------------------------------------------------------------------------
 * 里程碑成果卡（导出 PNG 用）
 * ---------------------------------------------------------------------------
 * 复用已有的下载机制：生成一张 SVG → 转成 data URL → 触发下载。
 * 不引任何外部库，也不发任何网络请求。
 * -------------------------------------------------------------------------*/
function milestoneCardSVG(m, total, isEn) {
  var W = 800, H = 500;
  var label = isEn ? m.en : m.zh;
  var line = isEn ? 'Stone number ' + total : '第 ' + total + ' 块石头';
  var sub = isEn ? 'Break the big thing into the next small one'
                 : '把大任务，拆成下一小块';

  /* 石堆图形：用与界面一致的椭圆堆叠 */
  var stones = '';
  var n = Math.min(9, Math.max(3, Math.round(total / Math.max(1, Math.ceil(total / 9)))));
  for (var i = 0; i < n; i++) {
    var ry = 26 - i * 1.4;
    var rx = 96 - i * 7.5;
    var cy = 372 - i * (ry * 1.85);
    stones += '<ellipse cx="' + (400 + (i % 2 === 0 ? 0 : 5)) + '" cy="' + cy.toFixed(0) +
              '" rx="' + rx.toFixed(0) + '" ry="' + ry.toFixed(0) + '" fill="#5E7F6B"/>';
  }

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<rect width="' + W + '" height="' + H + '" fill="#F6F5F2"/>' +
    stones +
    '<text x="400" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="bold" fill="#5E7F6B">Cairn</text>' +
    '<text x="400" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#55534C">' + esc(label) + '</text>' +
    '<text x="400" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#1B1A17">' + esc(line) + '</text>' +
    '<text x="400" y="466" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8A877D">' + esc(sub) + '</text>' +
  '</svg>';
}

/* ---------------------------------------------------------------------------
 * 顶部导航追加「进度」入口（P0-3 的可达性）
 * -------------------------------------------------------------------------*/
function progressNavBadge() {
  var wp = weeklyProgress();
  if (wp.met) return '✓';
  return wp.achieved + '/' + wp.quota;
}

</script>
<script>
/* ============================================================================
 * Cairn · mobile.js   （v2.1 新增：手机端与 PWA）
 * ---------------------------------------------------------------------------
 *   1) 底部导航渲染（手机端主导航）
 *   2) PWA 安装提示（Android 用 beforeinstallprompt；iOS 给手动指引）
 *   3) Service Worker 注册与更新
 *   4) 独立窗口模式（standalone）下的界面微调
 *
 * 设计立场：不自动弹窗推销"安装我们的 App"。
 * 安装入口放在设置页里的一个安静按钮上 —— 用户想装的时候自己会找，
 * 不想装的时候不该被打扰。这是低刺激产品的底线。
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * 导航项定义（顶部与底部共用同一份数据，避免两处不一致）
 * -------------------------------------------------------------------------*/
function navItems() {
  var pending = todayTasks().length;
  var ideas = State.ideas.filter(function (i) { return !i.converted; }).length;
  var weekBadge = typeof progressNavBadge === 'function' ? progressNavBadge() : '';
  var weekMet = typeof weeklyProgress === 'function' && weeklyProgress().met;

  return [
    { id: 'breakdown', icon: 'breakdown', label: t('navBreakdown'), badge: '' },
    { id: 'now', icon: 'target', label: t('navNow'), badge: pending ? String(pending) : '' },
    { id: 'progress', icon: 'layers', label: t('navProgress'), badge: weekBadge, met: weekMet },
    { id: 'timeline', icon: 'timeline', label: t('navTimeline'), badge: '' },
    { id: 'focus', icon: 'timer', label: t('navFocus'), badge: '' },
    { id: 'ideas', icon: 'bulb', label: t('navIdeas'), badge: ideas ? String(ideas) : '' }
  ];
}

/* ---------------------------------------------------------------------------
 * 底部导航（手机端）
 * -------------------------------------------------------------------------*/
function paintMobileNav() {
  var el = document.getElementById('mobile-nav');
  if (!el) return;

  /* 首次引导期间隐藏底部导航 —— 与顶部导航的处理保持一致：
   * 先让用户理解这个产品，再给他六个入口。 */
  if (State.view === 'onboarding') {
    if (el.innerHTML !== '') el.innerHTML = '';
    return;
  }

  var html = '<div class="mobile-nav-inner">' +
    navItems().map(function (n) {
      return '<button class="mnav-item" data-act="go" data-view="' + n.id + '"' +
        ' role="tab" aria-current="' + (State.view === n.id ? 'page' : 'false') + '"' +
        ' aria-label="' + esc(n.label) + '">' +
        BRAND.icon(n.icon, 21) +
        '<span class="mnav-label">' + esc(n.label) + '</span>' +
        (n.badge ? '<span class="nav-badge' + (n.met ? ' is-met' : '') + '">' + esc(n.badge) + '</span>' : '') +
        '</button>';
    }).join('') +
  '</div>';

  if (el.innerHTML !== html) el.innerHTML = html;
}

/* ---------------------------------------------------------------------------
 * 顶部导航里也要显示底部导航的"当前项"状态，反之亦然 ——
 * 两处都用 State.view 判断，天然一致，这里不需要额外同步。
 * -------------------------------------------------------------------------*/

/* ---------------------------------------------------------------------------
 * PWA 安装
 * ---------------------------------------------------------------------------
 * Android / 桌面 Chrome 会触发 beforeinstallprompt，我们把它存下来，
 * 等用户主动点"安装"时再调用 prompt()。浏览器要求这个事件被"延后使用"，
 * 不能直接自动调用 —— 否则会被静默忽略。
 *
 * iOS Safari 完全不支持这个事件，只能给用户一段手动操作指引。
 * -------------------------------------------------------------------------*/
var _deferredInstall = null;

function isStandalone() {
  try {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
           window.navigator.standalone === true;
  } catch (e) { return false; }
}

/* iOS 判定：包含 iPhone / iPad / iPod。
 * 顺带覆盖 iPadOS 13+ 伪装成 Mac 的情况（它没有 navigator.standalone 之外的线索，
 * 用触点数辅助判断）。 */
function isIOS() {
  var ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  return navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
}

function isAndroid() {
  return /Android/i.test(navigator.userAgent || '');
}

/* 当前环境能不能装 */
function installState() {
  if (isStandalone()) return 'installed';
  if (_deferredInstall) return 'ready';          /* Android：一键安装可用 */
  if (isIOS()) return 'ios-manual';              /* iOS：只能手动加主屏幕 */
  return 'unavailable';
}

function initPWA() {
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();                          /* 拦下浏览器自带的横幅 */
    _deferredInstall = e;
    /* 提示设置页刷新安装按钮状态 */
    if (State.view === 'settings') render();
  });

  window.addEventListener('appinstalled', function () {
    _deferredInstall = null;
    logEvent('pwa_installed', {});
    toast(t('pwaInstalled'), 'accent');
    if (State.view === 'settings') render();
  });

  /* 注册 Service Worker。
   * 只有通过 http/https 访问时才可能成功 —— 双击本地文件（file://）会被浏览器拒绝，
   * 这是规范限制，不是 bug。所以这里静默跳过，不让用户看到无意义的报错。 */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        /* 有新版本时静默更新，下次打开就是新的 */
        reg.addEventListener('updatefound', function () {});
      }).catch(function (err) {
        console.info('Cairn: Service Worker 未注册（离线功能不可用）', err && err.message);
      });
    });
  }
}

/* 执行安装（Android / 桌面 Chrome） */
async function doInstall() {
  var st = installState();
  if (st === 'installed') { toast(t('pwaAlreadyInstalled')); return; }
  if (st === 'ready' && _deferredInstall) {
    _deferredInstall.prompt();
    var res = await _deferredInstall.userChoice;
    logEvent('pwa_install_prompt', { outcome: res && res.outcome });
    if (res && res.outcome === 'accepted') {
      _deferredInstall = null;
      toast(t('pwaInstalled'), 'accent');
    } else {
      toast(t('pwaInstallLater'));
    }
    if (State.view === 'settings') render();
    return;
  }
  /* iOS 或环境不支持：弹出图文指引 */
  openModal({
    title: t('pwaInstallTitle'),
    body: '<div class="text-sm text-ink-2">' + installGuideHTML() + '</div>',
    actions: [{ label: t('btnClose'), act: 'modal-close', primary: true }]
  });
}

/* 安装指引（按平台给不同的步骤） */
function installGuideHTML() {
  var steps;
  if (isIOS()) {
    steps = t('pwaIosSteps').split('|');
  } else if (isAndroid()) {
    steps = t('pwaAndroidSteps').split('|');
  } else {
    steps = t('pwaDesktopSteps').split('|');
  }
  return '<ol style="padding-left:1.2em;line-height:1.9">' +
    steps.map(function (s) { return '<li>' + esc(s.trim()) + '</li>'; }).join('') +
  '</ol>';
}

/* ---------------------------------------------------------------------------
 * 设置页里的安装卡片
 * -------------------------------------------------------------------------*/
function renderInstallCard() {
  var st = installState();

  var statusChip = st === 'installed'
    ? '<span class="chip chip-accent">' + BRAND.icon('check', 12) + esc(t('pwaInstalledShort')) + '</span>'
    : '<span class="chip chip-line">' + esc(t('pwaNotInstalled')) + '</span>';

  var action;
  if (st === 'installed') {
    action = '<div class="text-xs text-ink-3">' + esc(t('pwaInstalledHint')) + '</div>';
  } else if (st === 'ready') {
    action = '<button class="btn btn-primary btn-sm" data-act="pwa-install">' +
             BRAND.icon('download', 14) + esc(t('pwaInstallBtn')) + '</button>';
  } else if (st === 'ios-manual') {
    action = '<button class="btn btn-outline btn-sm" data-act="pwa-install">' +
             BRAND.icon('info', 14) + esc(t('pwaHowTo')) + '</button>';
  } else {
    action = '<div class="text-xs text-ink-3">' + esc(t('pwaUnavailableHint')) + '</div>';
  }

  return '' +
  '<div class="card p-5 mb-4">' +
    '<div class="flex items-center gap-2 mb-2">' +
      '<h2 class="text-xs uppercase tracking-wider text-ink-3 font-semibold">' +
        BRAND.icon('download', 12) + ' ' + esc(t('pwaSection')) + '</h2>' +
      '<span class="ml-auto">' + statusChip + '</span>' +
    '</div>' +
    '<p class="text-xs text-ink-3 mb-3">' + esc(t('pwaExplain')) + '</p>' +
    action +
  '</div>';
}

/* standalone 模式（已装到桌面）下把界面调得更像原生 App：
 * 隐藏"添加到主屏幕"的入口，并给 body 打标记供 CSS 使用。 */
function applyStandaloneTweaks() {
  if (!isStandalone()) return;
  document.documentElement.setAttribute('data-standalone', '1');
}

/* ---------------------------------------------------------------------------
 * 手机端的交互补充
 * ---------------------------------------------------------------------------
 * 桌面上删除类按钮靠 hover 提示，手机没有 hover，
 * 所以给这些按钮在触摸设备上常显（由 CSS 处理），这里只补一个
 * "长按不做任何事"的防御 —— 避免长按弹出系统选择菜单打断操作。
 * -------------------------------------------------------------------------*/
function initTouchTweaks() {
  if (!('ontouchstart' in window)) return;
  /* 给所有按钮加上 touch-action，去掉 300ms 点击延迟与双击缩放 */
  document.addEventListener('touchstart', function () {}, { passive: true });
}

</script>
<script>
/* ============================================================================
 * Cairn · views.js
 * ---------------------------------------------------------------------------
 * 六个视图的渲染与交互。
 *
 * 交互实现上的两个关键决策：
 *   1) 全部用事件委托（document 上监听 data-act），不给每个按钮单独绑定。
 *      这样重新渲染不会产生内存泄漏，也让计时器每秒刷新时可以只改局部 DOM。
 *   2) 计时器永远只 patch 自己那几个节点，绝不整页重渲染 —— 否则用户正在
 *      打字的输入框会失焦、文本选中会丢失，对一个给 ADHD 用户用的工具来说
 *      这种"打断"比功能缺失更致命。
 * ==========================================================================*/

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

/* ---------------------------------------------------------------------------
 * 提示条
 * -------------------------------------------------------------------------*/
function toast(msg, kind) {
  State.ui.toast = { msg: msg, kind: kind || 'default', at: Date.now() };
  paintToast();
}

function paintToast() {
  var wrap = $('#toast-wrap');
  if (!wrap) return;
  var tst = State.ui.toast;
  if (!tst || Date.now() - tst.at > 6000) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<div class="toast' + (tst.kind === 'accent' ? ' toast-accent' : '') + '">' +
    BRAND.icon(tst.kind === 'accent' ? 'check' : 'info', 15) + '<span>' + esc(tst.msg) + '</span></div>';
  clearTimeout(paintToast._t);
  paintToast._t = setTimeout(function () { State.ui.toast = null; paintToast(); }, 2600);
}

/* ---------------------------------------------------------------------------
 * 通用小组件
 * -------------------------------------------------------------------------*/
function energyChip(energy, small) {
  if (!energy) return '';
  var cls = energy === 'high' ? 'chip-clay' : 'chip-slate';
  var label = energy === 'high' ? t('energyHigh') : t('energyLow');
  var ic = energy === 'high' ? 'brain' : 'battery';
  return '<span class="chip ' + cls + '"' + (small ? ' style="height:20px;font-size:11px;padding:0 7px"' : '') +
         '>' + BRAND.icon(ic, small ? 11 : 12) + esc(label) + '</span>';
}

function estimateChip(min) {
  if (!min) return '';
  return '<span class="chip chip-line">' + BRAND.icon('clock', 12) + esc(fmtDuration(min)) + '</span>';
}

function progressBar(pct, cls) {
  return '<div class="progress' + (cls ? ' ' + cls : '') + '"><span style="width:' + pct + '%"></span></div>';
}

/* 顶部品牌标记（左右各一，形成对称的品牌露出） */
function brandMark(size, opacity) {
  return '<span class="brand-mark" aria-label="' + esc(t('logoAlt')) + '" style="width:' + size +
         'px;height:' + Math.round(size * 224 / 104) + 'px;opacity:' + (opacity || 1) + '">' +
         BRAND.markSVG(size, 'currentColor') + '</span>';
}

/* 今天堆了多少石头 —— 品牌隐喻变成真实的进度可视化 */
function cairnProgress() {
  var tasks = todayTasks();
  var total = 0, done = 0;
  tasks.forEach(function (tk) {
    var p = taskProgress(tk);
    total += p.total || (tk.done ? 1 : 0);
    done += p.done || (tk.done ? 1 : 0);
  });
  if (!total) return '';
  var placed = done;
  return '<div class="flex items-center gap-3">' +
    '<div class="flex-1 min-w-0">' +
      '<div class="text-xs text-ink-3 mb-1">' + esc(t('nowProgress', { done: done, total: total })) + '</div>' +
      progressBar(Math.round(done / total * 100)) +
    '</div>' +
    '<div class="flex-none opacity-70">' + BRAND.stack(total, placed, 12) + '</div>' +
  '</div>';
}

/* ---------------------------------------------------------------------------
 * 顶部导航
 * -------------------------------------------------------------------------*/
function paintAppbar() {
  /* 导航项统一由 mobile.js 的 navItems() 提供 —— 顶部与底部导航共用同一份数据。
   * 曾经两处各写一遍，加「进度」时差点漏改一处。 */
  var nav = navItems();

  var html = '' +
    '<div class="max-w-2xl mx-auto px-4 flex items-center gap-3" style="height:56px">' +
      /* v2.3：顶栏的品牌标识从"石堆图标"换成"手绘字标"。
       * 图标缩到 20px 时其实看不出是三块石头，而字标在任何尺寸下都能读出 CAIRN。 */
      '<span class="brand-wordmark text-accent flex-none">' + BRAND.wordmarkSVG(19, 'currentColor') + '</span>' +
      '<div class="flex items-center gap-1 flex-wrap" role="tablist">' +
        nav.map(function (n) {
          return '<button class="navlink" data-act="go" data-view="' + n.id + '"' +
            ' role="tab" aria-current="' + (State.view === n.id ? 'page' : 'false') + '">' +
            BRAND.icon(n.icon, 16) + '<span class="navlink-label">' + esc(n.label) + '</span>' +
            (n.badge ? '<span class="nav-badge' + (n.met ? ' is-met' : '') + '">' + esc(n.badge) + '</span>' : '') +
            '</button>';
        }).join('') +
      '</div>' +
      '<div class="ml-auto flex items-center gap-1">' +
        '<button class="btn btn-icon btn-ghost" data-act="toggle-lang" title="' + esc(t('settingsLanguage')) + '"' +
          ' aria-label="' + esc(t('settingsLanguage')) + '">' + BRAND.icon('globe', 17) + '</button>' +
        '<button class="btn btn-icon btn-ghost" data-act="toggle-theme" title="' + esc(t('settingsTheme')) + '"' +
          ' aria-label="' + esc(t('settingsTheme')) + '">' +
          BRAND.icon(State.settings.theme === 'dim' ? 'sun' : 'moon', 17) + '</button>' +
        '<button class="btn btn-icon btn-ghost" data-act="go" data-view="settings" aria-label="' + esc(t('navSettings')) + '"' +
          ' aria-current="' + (State.view === 'settings' ? 'page' : 'false') + '">' + BRAND.icon('settings', 17) + '</button>' +
      '</div>' +
    '</div>';

  var el = $('#appbar');
  if (el.innerHTML !== html) el.innerHTML = html;
}

/* ---------------------------------------------------------------------------
 * 视图一：拆解
 * -------------------------------------------------------------------------*/
function viewBreakdown() {
  var d = State.draftSteps;
  var hasTasks = todayTasks().length > 0;
  /* "空屏"= 没有拆解结果、也没有今天的任务。这种时候整屏只有两三个元素，
   * 如果按自然流式排列就全挤在顶部、下面一大片空白（用户为此提过意见）。
   * 所以空屏状态下把它垂直居中，视觉重心落在屏幕中央。 */
  var isEmptyScreen = !d && !hasTasks;

  return '' +
  '<div class="max-w-lg mx-auto' + (isEmptyScreen ? ' hero-center' : '') + '">' +

    /* 品牌区：只在没有结果、也没有任务时出现，避免长期占据屏幕。
     *
     * v2.3 改版：原来这里是一行衬线 "Cairn" + 一句中文标语 + 一整段品牌故事。
     * 用户的反馈是"字太多、无关紧要的话可以精简"。品牌故事确实属于
     * "我们自我感动、用户并不想读"的那一类 —— 它已经被移进「关于」页。
     * 现在这里是：石堆 + 手绘字标 + 一句口号，仅此而已。 */
    (isEmptyScreen ? '' +
      '<div class="text-center pb-10">' +
        '<div class="flex justify-center mb-6 text-accent">' + brandMark(62, .95) + '</div>' +
        '<div class="flex justify-center">' + BRAND.wordmarkSVG(32, 'currentColor') + '</div>' +
        '<p class="slogan' + (langTag() === 'en' ? ' slogan-en' : '') + ' mt-4">' +
          esc(t('brandSub')) + '</p>' +
      '</div>'
      : '') +

    /* v2：里程碑卡片 —— 只在刚达成时出现一次，点"收下"就消失。
     * 刻意不做进度条催促，因为"还差 3 步就解锁"是压力，不是动力。 */
    (typeof renderMilestoneCard === 'function' ? renderMilestoneCard() : '') +

    /* v2：欢迎回来卡片 —— 离开 ≥2 天后再打开时出现。
     * 这是竞品普遍缺失的功能：所有产品都对"回来的那一刻"处理得很粗糙。 */
    (typeof renderWelcomeBack === 'function' ? renderWelcomeBack() : '') +

    /* 输入卡片
     * v2.3：原来空屏时这个标签也写着「把大任务，拆成下一小块」——
     * 和上面那句口号一模一样，一句话在一屏里出现两次。
     * 现在空屏时不显示标签（输入框里的占位文字已经说清楚了），
     * 只有已有草稿时才显示「试试换个说法」这类有实际信息量的提示。 */
    '<div class="card p-5">' +
      (d ? '<label class="block text-sm font-medium text-ink-2 mb-2" for="big-input">' +
            esc(t('inputHint')) + '</label>' : '') +
      '<textarea id="big-input" class="big-input" rows="1" placeholder="' + esc(t('inputPlaceholder')) +
        '" data-act="autogrow">' + esc(State.draftSource || '') + '</textarea>' +

      '<div class="flex items-center gap-2 mt-3 flex-wrap">' +
        '<div class="segment" role="group">' +
          '<button data-act="engine" data-engine="local" aria-pressed="' +
            (State.settings.lastEngine !== 'ai' ? 'true' : 'false') + '">' +
            BRAND.icon('layers', 13) + ' ' + esc(t('modeOffline')) + '</button>' +
          '<button data-act="engine" data-engine="ai" aria-pressed="' +
            (State.settings.lastEngine === 'ai' ? 'true' : 'false') + '">' +
            BRAND.icon('spark', 13) + ' ' + esc(t('modeAI')) + '</button>' +
        '</div>' +
        /* 这一行小字（"离线可用 · 数据不出本机"）在空屏时是有价值的信任信息，
         * 但已经有任务之后就不必每次重复了。 */
        (isEmptyScreen ? '<span class="text-xs text-ink-3">' +
          esc(State.settings.lastEngine === 'ai' ? t('aiNote') : t('offlineNote')) + '</span>' : '') +
        '<button class="btn btn-primary btn-lg ml-auto" data-act="decompose">' +
          BRAND.icon(State.settings.lastEngine === 'ai' ? 'spark' : 'breakdown', 17) +
          esc(d ? t('btnDecomposeAgain') : t('btnDecompose')) + '</button>' +
      '</div>' +
    '</div>' +

    /* 示例：降低"不知道输入什么"的启动阻力 */
    (!d ? '' +
      '<div class="mt-5 flex items-center gap-2 flex-wrap">' +
        '<span class="text-xs text-ink-3">' + esc(t('btnExamples')) + '</span>' +
        t('examples').split('|').map(function (ex) {
          return '<button class="chip chip-line cursor-pointer" data-act="example" data-text="' + esc(ex) + '">' +
            esc(ex) + '</button>';
        }).join('') +
      '</div>'
      : '') +

    /* 拆解结果 */
    (d ? renderDraft(d) : '') +

    /* 今天已有的事情 */
    (!d && hasTasks ? renderTodayList() : '') +

    /* 底部品牌落款
     * v2.3：原来这里挂着一整句「课程作业原型 · 独立重构实现 · 参考开源项目
     * 设计思路，未复制任何源码」—— 30 多字的声明挂在主界面最底部，每次都在。
     * 那句话本身没错（学术诚信要有），但它属于「关于」页，不属于主界面。
     * 现在主界面底部只剩版本号，完整声明在关于页里保留。 */
    (isEmptyScreen ? '' :
      '<div class="mt-10 pt-6 border-t flex items-center justify-end gap-2 text-xs text-ink-4">' +
        brandMark(13, .5) + '<span>Cairn ' + APP_VERSION + '</span>' +
      '</div>') +
  '</div>';
}

function renderDraft(d) {
  var totalMin = d.steps.reduce(function (a, s) { return a + s.minutes; }, 0);
  return '' +
  '<div class="card p-5 mt-5">' +
    (d.fallback ? '' +
      '<div class="flex items-start gap-2 p-3 rounded-sm mb-4" style="background:var(--amber-soft)">' +
        '<span class="text-amber mt-1">' + BRAND.icon('info', 15) + '</span>' +
        '<div class="text-sm"><div class="font-medium">' + esc(t('engineFallback')) + '</div>' +
        '<div class="text-ink-3 text-xs mt-1">' + esc(d.fallbackReason === 'NO_KEY' ? t('settingsAITestNoKey') : (d.fallbackReason || '')) + '</div></div>' +
      '</div>'
      : '') +

    '<div class="flex items-center gap-3 mb-1">' +
      '<h2 class="text-xl font-semibold">' + esc(t('resultTitle')) + '</h2>' +
      '<span class="chip ' + (d.engine === 'ai' ? 'chip-accent' : '') + '">' +
        BRAND.icon(d.engine === 'ai' ? 'spark' : 'layers', 12) +
        esc(d.engine === 'ai' ? t('engineAI') : t('engineLocal')) + '</span>' +
      (d.category ? '<span class="chip chip-line">' + esc(d.category) + '</span>' : '') +
    '</div>' +
    '<p class="text-sm text-ink-3">' + esc(t('resultCount', { n: d.steps.length })) +
      ' · ' + esc(fmtDuration(totalMin)) + ' · ' + esc(t('resultNotice')) + '</p>' +

    '<div class="mt-4 divide-y" style="border-color:var(--line)">' +
      d.steps.map(function (s, i) {
        return '<div class="step-row" style="border-color:var(--line)">' +
          '<span class="flex-none text-xs text-ink-4 mono" style="width:18px;padding-top:3px">' + (i + 1) + '</span>' +
          '<div class="flex-1 min-w-0">' +
            '<div class="text-base">' + esc(s.title) + '</div>' +
            '<div class="flex items-center gap-2 mt-1 flex-wrap">' +
              estimateChip(s.minutes) + energyChip(s.energy, true) +
            '</div>' +
          '</div>' +
          '<button class="btn btn-icon-sm btn-ghost text-ink-4" data-act="drop-step" data-i="' + i + '"' +
            ' title="' + esc(t('resultRemoveStep')) + '" aria-label="' + esc(t('resultRemoveStep')) + '">' +
            BRAND.icon('x', 14) + '</button>' +
        '</div>';
      }).join('') +
    '</div>' +

    (d.note ? '<p class="text-xs text-ink-3 mt-3 p-3 rounded-sm" style="background:var(--surface-2)">' +
      esc(State.settings.lang === 'en' ? d.note.en : d.note.zh) + '</p>' : '') +

    '<div class="flex items-center gap-2 mt-5 flex-wrap">' +
      '<button class="btn btn-primary btn-lg" data-act="draft-start">' +
        BRAND.icon('play', 15) + esc(t('resultStart')) + '</button>' +
      '<button class="btn btn-outline" data-act="draft-addall">' +
        BRAND.icon('plus', 15) + esc(t('resultAddAll')) + '</button>' +
      '<button class="btn btn-ghost text-ink-3" data-act="draft-discard">' + esc(t('btnCancel')) + '</button>' +
    '</div>' +
  '</div>';
}

function renderTodayList() {
  var list = todayTasks();
  return '' +
  '<div class="card p-5 mt-6">' +
    '<div class="flex items-center gap-2 mb-4">' +
      '<h2 class="text-base font-semibold">' + esc(t('navNow')) + '</h2>' +
      '<span class="chip">' + list.length + '</span>' +
      '<div class="ml-auto flex-1 max-w-sm">' + '' + '</div>' +
    '</div>' +
    '<div class="flex flex-col gap-2">' +
      list.map(function (tk) {
        var p = taskProgress(tk);
        var ns = nextStep(tk);
        return '<button class="text-left p-3 rounded-sm transition w-full" style="background:var(--surface-2)"' +
          ' data-act="open-task" data-id="' + tk.id + '">' +
          '<div class="flex items-center gap-2">' +
            '<span class="flex-1 min-w-0 text-sm font-medium truncate">' + esc(tk.title) + '</span>' +
            (tk.energy ? energyChip(tk.energy, true) : '') +
            (p.total ? '<span class="text-xs text-ink-3 mono">' + p.done + '/' + p.total + '</span>' : '') +
          '</div>' +
          (ns ? '<div class="flex items-center gap-1 text-xs text-ink-3 mt-1">' +
            BRAND.icon('arrowRight', 12) + '<span class="truncate">' + esc(ns.title) + '</span></div>' : '') +
        '</button>';
      }).join('') +
    '</div>' +
    '<button class="btn btn-ghost btn-sm mt-3 text-ink-3" data-act="go" data-view="now">' +
      esc(t('nowOneOnly')) + BRAND.icon('chevronRight', 13) + '</button>' +
  '</div>';
}

/* ---------------------------------------------------------------------------
 * 视图二：当前（单任务视图）
 * -------------------------------------------------------------------------*/
function viewNow() {
  var list = todayTasks();
  if (!list.length) {
    return '' +
    '<div class="max-w-sm mx-auto">' +
      '<div class="empty-state">' +
        '<div class="text-accent opacity-60">' + brandMark(52, .8) + '</div>' +
        '<h2 class="text-xl font-medium mt-5">' + esc(t('nowEmpty')) + '</h2>' +
        '<p class="text-sm text-ink-3 mt-2">' + esc(t('nowEmptyHint')) + '</p>' +
        '<div class="flex gap-2 mt-6">' +
          '<button class="btn btn-primary" data-act="go" data-view="breakdown">' +
            BRAND.icon('breakdown', 16) + esc(t('navBreakdown')) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  var task = currentTask();
  var p = taskProgress(task);
  var ns = nextStep(task);
  var idx = State.focusIdx < 0 ? 0 : State.focusIdx;

  return '' +
  '<div class="max-w-md mx-auto">' +

    /* 顶部：位置 + 上下条切换。刻意不做列表，只给"上一条/下一条" */
    '<div class="flex items-center gap-2 mb-4">' +
      '<span class="text-xs text-ink-3">' + esc(t('nowPos', { i: idx + 1, n: list.length })) + '</span>' +
      '<div class="ml-auto flex items-center gap-1">' +
        '<button class="btn btn-icon btn-outline" data-act="prev-task" aria-label="' + esc(t('btnBack')) + '">' +
          BRAND.icon('chevronLeft', 16) + '</button>' +
        '<button class="btn btn-icon btn-outline" data-act="next-task" aria-label="' + esc(t('btnNext')) + '">' +
          BRAND.icon('chevronRight', 16) + '</button>' +
      '</div>' +
    '</div>' +

    /* 单任务卡：整个屏幕只有这一条 */
    '<div class="card p-6 relative overflow-hidden">' +
      '<div class="rail ' + (task.energy === 'high' ? 'rail-clay' : task.energy === 'low' ? 'rail-slate' : 'rail-accent') + '"></div>' +
      '<div class="text-xs text-ink-3 uppercase tracking-wider mb-2">' + esc(t('nowTodoLabel')) + '</div>' +
      '<h1 class="text-2xl font-semibold leading-tight break-words">' + esc(task.title) + '</h1>' +

      (p.total ? '' +
        '<div class="flex items-center gap-3 mt-4">' +
          '<div class="flex-1 min-w-0">' + progressBar(p.pct) + '</div>' +
          '<span class="text-xs text-ink-3 mono">' + p.done + '/' + p.total + '</span>' +
        '</div>'
        : '') +

      '<div class="flex items-center gap-2 mt-3 flex-wrap">' +
        (task.energy ? energyChip(task.energy) : '') +
        estimateChip(task.estimateMin) +
        (!p.total ? '<span class="chip chip-line">' + esc(t('nowNoSteps')) + '</span>' : '') +
      '</div>' +

      /* 下一步：整屏的视觉焦点，字体最大、对比最强 */
      (ns ? '' +
        '<div class="mt-6 p-4 rounded" style="background:var(--accent-soft);border:1px solid var(--accent-line)">' +
          '<div class="text-xs text-accent uppercase tracking-wider mb-2 font-semibold">' +
            esc(t('stepOf', { i: p.done + 1 })) + '</div>' +
          '<div class="text-lg font-medium leading-snug break-words">' + esc(ns.title) + '</div>' +
          '<div class="flex items-center gap-2 mt-3">' +
            estimateChip(ns.minutes) + energyChip(ns.energy, true) +
          '</div>' +
          '<p class="text-xs text-ink-3 mt-3">' + esc(t('nowWhy')) + '</p>' +
        '</div>' +
        '<div class="flex items-center gap-2 mt-4 flex-wrap">' +
          '<button class="btn btn-primary btn-lg" data-act="step-done" data-id="' + task.id + '" data-step="' + ns.id + '">' +
            BRAND.icon('check', 17) + esc(t('btnDone')) + '</button>' +
          '<button class="btn btn-outline" data-act="focus-task" data-id="' + task.id + '" data-min="' + ns.minutes + '"' +
            ' data-step="' + ns.id + '">' +

            '<span class="text-accent">' + BRAND.icon('check', 22) + '</span>' +

          '<div class="flex items-center gap-2 mt-4">' +

          '</div>' +
        '</div>') +

      /* 其余步骤：默认折叠，避免一次看到 6 条又变成认知过载 */
      (p.total > 1 ? '' +
        '<details class="mt-5">' +
          '<summary class="text-sm text-ink-3 cursor-pointer select-none">' +
            esc(t('nowSteps')) + ' · ' + p.total + '</summary>' +

      '<button class="btn btn-ghost btn-sm text-ink-3" data-act="skip-task" data-id="' + task.id + '">' +

/* ---------------------------------------------------------------------------
 * 视图三：时间线
 * -------------------------------------------------------------------------*/
var TL_START = 7 * 60;         /* 07:00 */
var TL_END = 23 * 60;          /* 23:00 */
/* 每分钟对应的像素。07:00–23:00 共 960 分钟，1.15px/min ≈ 1104px，
 * 刚好放进笔记本屏幕的一屏内 —— 时间线的意义是"一眼看到今天"，
 * 如果需要滚动才能看完，它就退化成了另一个列表。 */
var PX_PER_MIN = 1.15;

function viewTimeline() {
  /* v2：进入时间线时先自动重排一次（P1-1）。
   * 借鉴 Set 的能力：任务变动后剩余时间块自动接上，用户不需要手动维护计划。
   * 只在开关打开时生效，且完全过去的块不会被搬动。 */
  if (State.settings.autoReflow && typeof reflowTimeline === 'function') {
    reflowTimeline({ fromMin: nowMinOfDay() });
  }

  var blocks = todayBlocks();
  var load = todayLoad();
  var now = nowMinOfDay();
  var height = (TL_END - TL_START) * PX_PER_MIN;
  var endMin = typeof projectedEnd === 'function' ? projectedEnd() : null;

  /* 小时刻度 */
  var hours = '';
  for (var m = TL_START; m <= TL_END; m += 60) {
    var top = (m - TL_START) * PX_PER_MIN;
    hours += '<div class="tl-row">' +
      '<div class="tl-hour">' + fmtClock(m) + '</div>' +
      '<div class="tl-track" style="height:' + (60 * PX_PER_MIN) + 'px"></div>' +
    '</div>';
  }

  /* 时间块：绝对定位贴在轨道上 */
  var blockHtml = blocks.map(function (b) {
    var top = (b.start - TL_START) * PX_PER_MIN;
    var h = Math.max(b.dur * PX_PER_MIN, 20);
    var cls = b.energy === 'high' ? 'is-clay' : b.energy === 'low' ? 'is-slate' : '';
    var overlaps = findOverlaps(b).length > 0;
    return '<button class="tl-block ' + cls + '" style="top:' + top + 'px;height:' + h + 'px"' +
      ' data-act="block-open" data-id="' + b.id + '"' +
      ' title="' + esc(fmtClock(b.start) + '–' + fmtClock(b.start + b.dur) + ' · ' + b.title) + '">' +
      '<span class="mono text-xs opacity-70 flex-none">' + fmtClock(b.start) + '</span>' +
      '<span class="truncate flex-1 min-w-0">' + esc(b.title) + '</span>' +
      (overlaps ? '<span class="chip chip-amber flex-none" style="height:18px;font-size:10px;padding:0 6px">' +
        esc(t('timelineOverlap')) + '</span>' : '') +
    '</button>';
  }).join('');

  /* 现在时刻线 */
  var nowLine = (now >= TL_START && now <= TL_END)
    ? '<div class="tl-nowline" style="top:' + ((now - TL_START) * PX_PER_MIN) + 'px">' +
        '<span class="absolute text-2xs text-danger mono" style="right:0;top:-16px;background:var(--bg);padding:0 4px">' +
        esc(t('timelineNow')) + ' ' + fmtClock(now) + '</span></div>'
    : '';

  return '' +
  '<div class="max-w-xl mx-auto">' +
    '<div class="flex items-end gap-3 mb-3 flex-wrap">' +
      '<div>' +
        '<h1 class="text-xl font-semibold">' + esc(t('timelineTitle')) + '</h1>' +
      '</div>' +
      '<button class="btn btn-primary ml-auto" data-act="block-new">' +
        BRAND.icon('plus', 16) + esc(t('timelineAddBlock')) + '</button>' +
    '</div>' +

    /* v2：今天几点结束 —— 这是用户真正想知道的那个数（P1-1）。
     * 超过 22:30 时用琥珀色提示"排得太满了"，但不判对错、不劝阻。 */
    (endMin !== null ? '' +
      '<div class="day-end' + (endMin > 22 * 60 + 30 ? ' is-late' : '') + ' mb-4">' +
        '<span class="' + (endMin > 22 * 60 + 30 ? 'text-amber' : 'text-accent') + '">' +
          BRAND.icon('clock', 17) + '</span>' +
        '<span class="day-end-time">' + fmtClock(endMin) + '</span>' +
        '<span class="text-sm text-ink-2 flex-1">' +
          esc(endMin > 22 * 60 + 30
            ? t('projOver', { time: fmtClock(endMin) })
            : t('projEnd', { time: fmtClock(endMin) })) + '</span>' +
        '<button class="btn btn-icon-sm btn-ghost text-ink-4" data-act="reflow-now"' +
          ' title="' + esc(t('reflowHint')) + '" aria-label="' + esc(t('reflowDone')) + '">' +
          BRAND.icon('reset', 14) + '</button>' +
      '</div>'
      : '') +

    '<div class="flex items-center gap-3 my-4 text-xs text-ink-3 flex-wrap">' +
      '<span class="chip chip-line">' + BRAND.icon('clock', 12) +
        esc(t('timelineTotalPlanned', minutesToHM(load.planned))) + '</span>' +
      '<span class="chip chip-line">' + BRAND.icon('leaf', 12) +
        esc(t('timelineTotalFree', minutesToHM(load.free))) + '</span>' +
      (State.settings.autoReflow
        ? '<span class="chip chip-accent">' + BRAND.icon('reset', 12) + esc(t('reflowHint')) + '</span>'
        : '') +
      '<span class="ml-auto flex items-center gap-2">' +
        '<span class="chip chip-accent" style="height:16px;width:16px;padding:0"></span>' + esc(t('energyHigh')) +
        '<span class="chip chip-slate" style="height:16px;width:16px;padding:0"></span>' + esc(t('energyLow')) +
      '</span>' +
    '</div>' +

    (!blocks.length ? '' +
      '<div class="empty-state">' + BRAND.icon('timeline', 30) +
        '<div class="text-base font-medium">' + esc(t('timelineEmpty')) + '</div>' +
        '<div class="text-sm text-ink-3 mt-2 max-w-prose">' + esc(t('timelineEmptyHint')) + '</div>' +
      '</div>'
      : '') +

    '<div class="card p-4 mt-2 relative">' +
      '<div class="relative" style="height:' + height + 'px">' +
        '<div class="absolute inset-0 flex">' +
          '<div style="width:56px"></div>' +
          '<div class="flex-1 relative">' + blockHtml + nowLine + '</div>' +
        '</div>' +
        '<div class="relative">' + hours + '</div>' +
      '</div>' +
    '</div>' +

    (blocks.length ? '' +
      '<div class="mt-4 flex flex-col gap-2">' +
        blocks.map(function (b) {
          return '<div class="flex items-center gap-3 p-2 px-3 rounded-sm" style="background:var(--surface-2)">' +
            '<span class="mono text-xs text-ink-3 flex-none">' + fmtClock(b.start) + '–' + fmtClock(b.start + b.dur) + '</span>' +
            '<span class="text-sm flex-1 min-w-0 truncate">' + esc(b.title) + '</span>' +
            estimateChip(b.dur) +
            '<button class="btn btn-icon-sm btn-ghost text-ink-4" data-act="block-del" data-id="' + b.id + '"' +
              ' aria-label="' + esc(t('timelineDeleteBlock')) + '">' + BRAND.icon('trash', 14) + '</button>' +
          '</div>';
        }).join('') +
      '</div>'
      : '') +
  '</div>';
}

/* ---------------------------------------------------------------------------
 * 视图四：专注
 * -------------------------------------------------------------------------*/
var FOCUS_PRESETS = [2, 10, 15, 25, 45];

function viewFocus() {
  var f = State.focus;
  var todays = todayFocus();
  var total = f.total || (State.settings.focusLen * 60);
  var remaining = f.running || f.remaining ? f.remaining : total;
  var pct = total ? 1 - (remaining / total) : 0;
  var R = 108, C = 2 * Math.PI * R;

  var tasks = todayTasks();
  var cur = currentTask();

  return '' +
  '<div class="max-w-md mx-auto text-center">' +
    '<h1 class="text-xl font-semibold">' + esc(t('focusTitle')) + '</h1>' +
    '<p class="text-sm text-ink-3 mt-1 mb-6">' + esc(t('focusSub')) + '</p>' +

    '<div class="flex justify-center mb-5">' +
      '<div class="dial">' +
        '<svg viewBox="0 0 236 236">' +
          '<circle class="dial-track" cx="118" cy="118" r="' + R + '"/>' +
          '<circle class="dial-fill" id="dial-fill" cx="118" cy="118" r="' + R + '"' +
            ' stroke-dasharray="' + C.toFixed(1) + '"' +
            ' stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="dial-inner">' +
          '<div class="dial-time mono" id="dial-time">' + fmtTimer(remaining) + '</div>' +
          '<div class="text-xs text-ink-3" id="dial-label">' +
            esc(f.running ? t('focusRunning') : (f.remaining ? t('btnPause') : t('focusBreath'))) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    (!f.running && !f.remaining ? '' +
      '<div class="flex items-center justify-center gap-2 mb-4 flex-wrap">' +
        FOCUS_PRESETS.map(function (m) {
          return '<button class="chip cursor-pointer ' + (State.settings.focusLen === m ? 'chip-accent' : 'chip-line') +
            '" data-act="focus-preset" data-min="' + m + '" style="height:28px;padding:0 12px">' +
            m + ' ' + esc(t('min')) + '</button>';
        }).join('') +
        '<button class="chip chip-line cursor-pointer" data-act="focus-custom" style="height:28px;padding:0 12px">' +
          BRAND.icon('edit', 12) + esc(t('focusCustom')) + '</button>' +
      '</div>'
      : '') +

    '<div class="flex items-center justify-center gap-2 mb-5 flex-wrap">' +
      '<button class="btn btn-primary btn-lg" data-act="focus-toggle">' +
        BRAND.icon(f.running ? 'pause' : 'play', 17) +
        esc(f.running ? t('btnPause') : (f.remaining ? t('btnResume') : t('btnStart'))) + '</button>' +
      (f.remaining || f.running
        ? '<button class="btn btn-outline" data-act="focus-stop">' + esc(t('btnStop')) + '</button>'
        : '') +
      '<button class="btn btn-ghost text-ink-3" data-act="focus-reset" title="' + esc(t('btnReset')) + '">' +
        BRAND.icon('reset', 16) + '</button>' +
    '</div>' +

    /* 为哪件事专注：不强制选择，允许"就是想专注一会儿" */
    (!f.running && !f.remaining ? '' +
      '<div class="card p-4 text-left mb-4">' +
        '<label class="block text-xs text-ink-3 mb-2" for="focus-task">' + esc(t('focusPickTask')) + '</label>' +
        '<select class="select" id="focus-task" data-act="focus-pick">' +
          '<option value="">' + esc(t('focusNoTask')) + '</option>' +
          tasks.map(function (tk) {
            return '<option value="' + tk.id + '"' +
              (f.taskId === tk.id ? ' selected' : '') + '>' +
              esc(tk.title) + '</option>';
          }).join('') +
        '</select>' +
        (f.label ? '<div class="text-xs text-ink-3 mt-2">' + BRAND.icon('target', 12) + ' ' + esc(f.label) + '</div>' : '') +
      '</div>'
      : '<div class="text-sm text-ink-2 mb-4">' +
          (f.label ? BRAND.icon('target', 14) + ' ' + esc(f.label) : esc(t('focusNoTask'))) + '</div>') +

    '<p class="text-xs text-ink-4">' + esc(t('focusNoPressure')) + '</p>' +

    '<div class="mt-8 pt-5 border-t text-left">' +
      '<div class="text-xs text-ink-3 mb-3">' +
        esc(t('focusToday', { m: todays.minutes, n: todays.rounds })) + '</div>' +
      '<div class="flex items-center gap-3">' +
        '<div class="flex-1">' + progressBar(Math.min(100, Math.round(todays.minutes / 120 * 100))) + '</div>' +
        '<div class="flex-none opacity-60">' + BRAND.stack(Math.max(4, todays.rounds * 2), Math.min(todays.rounds * 2, Math.max(4, todays.rounds * 2)), 10) + '</div>' +
      '</div>' +
      (State.sessions.length ? '' +
        '<div class="mt-4 flex flex-col gap-1">' +
          State.sessions.slice(-4).reverse().map(function (s) {
            return '<div class="flex items-center gap-2 text-xs text-ink-3">' +
              BRAND.icon('check', 12) + '<span class="mono">' + esc(fmtClock(new Date(s.at).getHours() * 60 + new Date(s.at).getMinutes())) + '</span>' +
              '<span>' + esc(fmtDuration(s.minutes)) + '</span>' +
              (s.label ? '<span class="truncate">· ' + esc(s.label) + '</span>' : '') +
            '</div>';
          }).join('') +
        '</div>'
        : '') +
    '</div>' +
  '</div>';
}

function fmtTimer(sec) {
  sec = Math.max(0, Math.round(sec));
  return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
}

    '<div class="card p-5 mb-4">' +

      '<div class="grid gap-2" style="grid-template-columns:1fr 1fr">' +

    /* 关于
     * v2.3：原来这里堆了 6 行（图标、标题、产品定位、课程声明、版本号、
     * 一长串快捷键说明）。现在换成：手绘字标 + 一句口号 + 版本号，
     * 产品定位与课程声明压成一行小字。
     * 快捷键那一行从 90 多字压到 14 字 —— 数字本来就跟顶部导航顺序一致，
     * 不需要把六个功能名再抄一遍。 */
    '<div class="card p-5 mb-6 text-center">' +
      '<div class="flex justify-center text-accent mb-1">' +
        BRAND.wordmarkSVG(26, 'currentColor') + '</div>' +
      '<p class="slogan' + (langTag() === 'en' ? ' slogan-en' : '') + ' mb-4">' +

      '<div class="text-2xs text-ink-4 mt-3">' +
        esc(t('shortcutTitle')) + ' 1–6 · Space</div>' +

}

/* ---------------------------------------------------------------------------
 * 渲染调度
 * -------------------------------------------------------------------------*/
var VIEWS = {
  breakdown: viewBreakdown,
  now: viewNow,
  progress: viewProgress,      /* v2：回顾层 */
  timeline: viewTimeline,
  focus: viewFocus,
  ideas: viewIdeas,
  settings: viewSettings
};

/* v2：首次使用引导是一个"接管整屏"的模式，不是普通视图。
 * 放在 VIEWS 之外单独判断，这样它不会被导航栏的 goto() 意外进入。 */
function render() {
  document.documentElement.setAttribute('data-theme', State.settings.theme === 'dim' ? 'dim' : 'light');
  document.documentElement.setAttribute('data-density', State.settings.density === 'compact' ? 'compact' : 'normal');
  document.documentElement.setAttribute('data-motion', State.settings.motion === 'reduced' ? 'reduced' : 'full');
  document.documentElement.lang = State.settings.lang === 'en' ? 'en' : 'zh-CN';

  /* 首次引导期间不显示导航栏 —— 让用户先理解这个产品，再给他六个入口 */
  if (State.view === 'onboarding') {
    document.title = t('brand') + ' · ' + t('ob1Title');
    var bar = $('#appbar');
    if (bar) bar.innerHTML = '';
    var obMain = $('#view');
    /* data-onboarding 会触发 CSS 里的垂直居中布局（见 styles.css）。
     * 早期版本没有这个标记，引导内容全部贴在窗口顶部、下面一大片空白。 */
    obMain.setAttribute('data-onboarding', '1');
    obMain.innerHTML = viewOnboarding();
    paintMobileNav();          /* 引导期间底部导航也隐藏，与顶部一致 */
    if (State.ui.modal) paintModal();
    return;
  }

  document.title = (State.view === 'breakdown'
    ? t('brand') + ' · ' + t('brandSub')
    : t('brand') + ' · ' + navLabelOf(State.view));

  paintAppbar();
  paintMobileNav();            /* 手机端的底部主导航 */

  var main = $('#view');
  main.removeAttribute('data-onboarding');
  var html = (VIEWS[State.view] || VIEWS.breakdown)();
  main.innerHTML = html;

  if (State.view === 'breakdown') autoGrowAll();
  if (State.ui.modal) paintModal();
}

/* 取某个视图在导航里的名字，用于文档标题。找不到就退回品牌名，
 * 避免出现 "Cairn · undefined" 这种标题。 */
function navLabelOf(view) {
  var key = 'nav' + view.charAt(0).toUpperCase() + view.slice(1);
  var s = t(key);
  return s === key ? t('brand') : s;
}

/* 文本域随内容自动增高：避免出现滚动条这种"还有更多内容"的压迫感 */
function autoGrow(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 260) + 'px';
}
function autoGrowAll() {
  $$('textarea[data-act="autogrow"]').forEach(autoGrow);
}

<script>
/* ============================================================================
 * Cairn · main.js
 * ---------------------------------------------------------------------------
 * 应用启动、事件委托、计时器、弹窗、导入导出。
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * 事件委托：所有点击都从一个入口分发
 * -------------------------------------------------------------------------*/
function onClick(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');

  /* 输入类动作不在这里处理（交给 input/change） */
  if (act === 'autogrow' || act === 'idea-grow') return;

  switch (act) {
    /* ---------------- 导航 ---------------- */
    case 'go':
      e.preventDefault();
      goto(el.getAttribute('data-view'));
      break;

    case 'toggle-lang':
      setLang(State.settings.lang === 'zh' ? 'en' : 'zh');
      break;

    case 'toggle-theme':
      State.settings.theme = State.settings.theme === 'dim' ? 'light' : 'dim';
      saveState(true); render();
      break;

    case 'lang':
      setLang(el.getAttribute('data-lang'));
      break;

    case 'engine':
      State.settings.lastEngine = el.getAttribute('data-engine');
      saveState(); render();
      break;

    /* ---------------- 拆解 ---------------- */
    case 'example':
      var ta0 = $('#big-input');
      if (ta0) { ta0.value = el.getAttribute('data-text'); autoGrow(ta0); ta0.focus(); }
      break;

    case 'decompose':
      doDecompose();
      break;

    case 'drop-step':
      if (State.draftSteps) {
        State.draftSteps.steps.splice(parseInt(el.getAttribute('data-i'), 10), 1);
        if (!State.draftSteps.steps.length) State.draftSteps = null;
        render();
      }
      break;

    case 'draft-discard':
      State.draftSteps = null; State.draftSource = '';
      render();
      break;

    case 'draft-start':
      if (State.draftSteps) {
        var task0 = draftToTask();
        State.tasks.push(task0);
        logEvent('task_add', { id: task0.id, steps: task0.steps.length, engine: task0.engine });
        State.draftSteps = null; State.draftSource = '';
        State.focusIdx = todayTasks().length - 1;
        saveState(true);
        toast(t('resultStart') + ' · ' + task0.steps[0].title, 'accent');
        goto('now');
      }
      break;

    case 'draft-addall':
      if (State.draftSteps) {
        var tk1 = draftToTask();
        State.tasks.push(tk1);
        logEvent('task_add', { id: tk1.id, steps: tk1.steps.length, engine: tk1.engine });
        State.draftSteps = null; State.draftSource = '';
        saveState(true);
        toast(t('saved'), 'accent');
        render();
      }
      break;

    /* ---------------- 单任务视图 ---------------- */
    case 'prev-task':
    case 'next-task':
      moveTaskCursor(act === 'next-task' ? 1 : -1);
      break;

    case 'open-task':
      selectTaskById(el.getAttribute('data-id'));
      goto('now');
      break;

    case 'step-done':
      var t1 = findTask(el.getAttribute('data-id'));
      if (t1) {
        var res = toggleStep(t1, el.getAttribute('data-step'));
        if (res && res.taskCompleted) {
          toast(t('nowDoneAll'), 'accent');
        }
        render();
      }
      break;

    case 'skip-step':
      var t2 = findTask(el.getAttribute('data-id'));
      if (t2) {
        /* 跳过 = 把这一步排到最后，而不是删掉。不惩罚，不丢内容。 */
        var sid = el.getAttribute('data-step');
        var idx = -1;
        t2.steps.forEach(function (s, i) { if (s.id === sid) idx = i; });
        if (idx > -1) {
          var moved = t2.steps.splice(idx, 1)[0];
          t2.steps.push(moved);
        }
        logEvent('step_skip', { taskId: t2.id });
        saveState(); render();
      }
      break;

    case 'skip-task':
      var t3 = findTask(el.getAttribute('data-id'));
      if (t3) { skipTask(t3); toast(t('resetDayHint')); moveTaskCursor(1); }
      break;

    case 'focus-task':
    case 'focus-tiny':
      if (State.focus.running || State.focus.remaining > 0) {
        goto('focus');
        toast(State.settings.lang === 'en' ? 'Finish or reset your current session first.' : '已有一段专注，先继续或重置它。');
        break;
      }
      var fmin = act === 'focus-tiny' ? 2 : (parseInt(el.getAttribute('data-min'), 10) || State.settings.focusLen);
      var ft = findTask(el.getAttribute('data-id'));
      State.focus.taskId = ft ? ft.id : null;
      State.focus.label = ft ? ft.title : '';
      /* v2：记下这一步的 id —— 这是估时自学习唯一的"真实耗时"来源。
       * 从单任务视图点"专注 N 分钟"进来时，按钮上带着当前步骤的 id。 */
      State.focus.stepId = el.getAttribute('data-step') || null;
      State.focus.total = fmin * 60;
      State.focus.remaining = fmin * 60;
      State.focus.runStartedAt = null;
      State.focus.accumulatedSec = null;
      goto('focus');
      startFocus();
      break;

    /* ---------------- 时间线 ---------------- */
    case 'block-new':
      openBlockModal(null);
      break;

    case 'block-open':
      openBlockModal(el.getAttribute('data-id'));
      break;

    case 'block-del':
      deleteBlock(el.getAttribute('data-id'));
      render();
      break;

    /* ---------------- 专注 ---------------- */
    case 'focus-toggle':
      if (State.focus.running) pauseFocus(); else startFocus();
      break;
    case 'focus-stop':
      stopFocus(true);
      break;
    case 'focus-reset':
      resetFocus();
      break;
    case 'focus-preset':
      var pm = parseInt(el.getAttribute('data-min'), 10);
      State.settings.focusLen = pm;
      State.focus.total = pm * 60;
      State.focus.remaining = pm * 60;
      saveState(); render();
      break;
    case 'focus-custom':
      openFocusCustomModal();
      break;
    case 'focus-again':
      closeModal();
      startFocus();
      break;
    case 'focus-finish':
      closeModal();
      resetFocus();
      goto('now');
      break;

    /* ---------------- 灵感 ---------------- */
    case 'idea-add':
      var iin = $('#idea-input');
      if (iin && iin.value.trim()) {
        addIdea(iin.value.trim());
        iin.value = '';
        render();
        toast(t('ideasAdd'), 'accent');
      }
      break;
    case 'idea-convert':
      var idea = null;
      State.ideas.forEach(function (i) { if (i.id === el.getAttribute('data-id')) idea = i; });
      if (idea) {
        ideaToTask(idea);
        toast(t('ideasConverted'), 'accent');
        render();
      }
      break;
    case 'idea-del':
      deleteIdea(el.getAttribute('data-id'));
      render();
      break;

    /* ---------------- 弹窗 ---------------- */
    case 'modal-close':
      /* 只有点遮罩本身才关闭；点弹窗内部空白处不应该关掉用户填了一半的表单 */
      if (el.classList.contains('modal-backdrop') && e.target !== el) break;
      closeModal();
      break;
    case 'block-save':
      saveBlockFromModal();
      break;
    case 'focus-custom-save':
      saveFocusCustom();
      break;
    case 'confirm-yes':
      var fn = State.ui.modal && State.ui.modal.onYes;
      closeModal();
      if (fn) fn();
      break;

    /* ---------------- 设置与数据 ---------------- */
    case 'ai-test':
      testAIConnection();
      break;
    case 'ai-clearkey':
      State.settings.aiKey = '';
      saveState(true); render();
      toast(t('settingsAIKeyClear'));
      break;
    case 'reset-all':
      confirmModal(t('settingsResetAll'), t('settingsResetConfirm'), function () {
        resetAll(); applySettings(); render(); toast(t('saved'));
      });
      break;
    case 'sample-data':
      loadSampleData(); applySettings(); render(); goto('now');
      toast(t('settingsSampleData'), 'accent');
      break;
    case 'export-json':
      exportJSON();
      break;
    case 'import-json':
      var fi = $('#import-file');
      if (fi) fi.click();
      break;
    case 'export-csv':
      exportCSV();
      break;

    /* ---------------- v2.0：欢迎回来（P0-1） ---------------- */
    case 'wb-continue':
      /* 「从这里继续」：直接把用户送回上次停下的那条任务，
       * 而不是丢回一个任务列表让他重新挑 —— 重新挑本身就是启动阻力。 */
      if (State.welcomeBack && State.welcomeBack.taskId) {
        selectTaskById(State.welcomeBack.taskId);
      }
      State.welcomeBack = null;
      markSeen();
      saveState(true);
      goto('now');
      break;

    case 'wb-repick':
      State.welcomeBack = null;
      markSeen();
      saveState(true);
      goto('breakdown');
      break;

    case 'wb-dismiss':
      State.welcomeBack = null;
      markSeen();
      saveState(true);
      render();
      break;

    /* ---------------- v2.0：首次引导（P0-4） ---------------- */
    case 'ob-next':
      State.onboardStep = Math.min(2, (State.onboardStep || 0) + 1);
      render();
      break;

    case 'ob-skip':
      finishOnboarding(false);
      break;

    case 'ob-decompose':
      doOnboardingDecompose();
      break;

    case 'ob-finish':
      finishOnboarding(true);
      break;

    /* ---------------- v2.0：里程碑（P0-2） ---------------- */
    case 'ms-dismiss':
      State.milestone = null;
      render();
      break;

    case 'ms-share':
      exportMilestoneCard();
      break;

    /* ---------------- v2.0：设置项 ---------------- */
    case 'replay-onboarding':
      State.onboardStep = 0;
      State.draftSteps = null;
      State.view = 'onboarding';
      saveState(true);
      render();
      break;

    case 'reset-stats':
      confirmModal(t('settingsResetStats'), t('settingsResetStatsConfirm'), function () {
        State.stats = newStats();
        saveState(true);
        render();
        toast(t('saved'), 'accent');
      });
      break;

    case 'reflow-now':
      reflowTimeline({ fromMin: nowMinOfDay() });
      render();
      toast(t('reflowDone'), 'accent');
      break;

    /* ---------------- v2.1：PWA 安装到手机桌面 ---------------- */
    case 'pwa-install':
      doInstall();
      break;
  }
}

/* ---------------------------------------------------------------------------
 * v2.0：引导流程的收尾
 * ---------------------------------------------------------------------------
 * completed = 用户是否真的在引导里做完了一次拆解。
 * 两种情况下都标记 onboarded，否则用户每次打开都会被引导拦住。
 * -------------------------------------------------------------------------*/
function finishOnboarding(completed) {
  State.settings.onboarded = true;
  State.view = completed ? 'now' : 'breakdown';

  if (completed && State.draftSteps && State.draftSteps.steps.length) {
    /* 把引导里拆出来的东西变成第一条真实任务 ——
     * "在引导内完成一次真实的成功体验"是这一屏存在的全部理由。 */
    var task = makeTask(State.draftSource || t('navNow'), {
      engine: State.draftSteps.engine,
      category: State.draftSteps.category,
      steps: State.draftSteps.steps.map(function (s) {
        return { title: s.title, minutes: s.minutes, energy: s.energy, source: State.draftSteps.engine };
      })
    });
    if (State.draftSteps.steps.length) task.energy = State.draftSteps.steps[0].energy;
    task.estimateMin = State.draftSteps.steps.reduce(function (a, s) { return a + s.minutes; }, 0);
    State.tasks.push(task);
    logEvent('task_add', { id: task.id, steps: task.steps.length, engine: task.engine, via: 'onboarding' });
    State.focusIdx = todayTasks().length - 1;
  }

  State.draftSteps = null;
  State.draftSource = '';
  markSeen();
  saveState(true);
  render();
}

/* 引导第三屏里的拆解。与主流程共用同一个引擎，保证体验一致。 */
var _obDecomposing = false;
async function doOnboardingDecompose() {
  if (_obDecomposing) return;
  var ta = document.getElementById('ob-input');
  var text = ta ? ta.value.trim() : '';
  if (!text) { if (ta) ta.focus(); toast(t('inputPlaceholder')); return; }

  _obDecomposing = true;
  var btn = document.querySelector('[data-act="ob-decompose"]');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = BRAND.icon('layers', 17) +
      (State.settings.lang === 'en' ? 'Working…' : '拆解中…');
  }
  try {
    /* 引导里一律用本地规则库：不要求新用户先去配 API Key */
    var result = await decompose(text, 'local');
    State.draftSteps = result;
    State.draftSource = text;
    render();
  } catch (err) {
    console.error(err);
    toast('拆解失败：' + (err && err.message ? err.message : '未知错误'));
  } finally {
    _obDecomposing = false;
  }
}

/* ---------------------------------------------------------------------------
 * v2.0：里程碑成果卡导出（Duolingo 复盘把"可分享"列为三大改进方向之一）
 * ---------------------------------------------------------------------------
 * 实现上不引任何库：生成 SVG → 包成 data URL → 触发下载。
 * 注意这里是**下载到本地**，不是分享到社交平台 —— 产品不联网，也不该假装能分享。
 * -------------------------------------------------------------------------*/
function exportMilestoneCard() {
  var m = State.milestone;
  if (!m) return;
  var total = ensureStats().total.steps;
  var svg = milestoneCardSVG(m, total, State.settings.lang === 'en');

  /* SVG → PNG：走一次离屏 canvas，这样导出的图在微信里能直接看。
   * 全程在本地完成，没有任何网络请求。 */
  var img = new Image();
  var svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  var url = URL.createObjectURL(svgBlob);

  img.onload = function () {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = 1600;
      canvas.height = 1000;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#F6F5F2';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        if (!blob) { URL.revokeObjectURL(url); downloadSVGFallback(svg); return; }
        var a = document.createElement('a');
        var objUrl = URL.createObjectURL(blob);
        a.href = objUrl;
        a.download = 'cairn-milestone-' + m.id + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(objUrl); }, 1500);
        URL.revokeObjectURL(url);
        logEvent('milestone_export', { id: m.id });
        toast(t('msShared'), 'accent');
      }, 'image/png');
    } catch (e) {
      URL.revokeObjectURL(url);
      downloadSVGFallback(svg);
    }
  };
  img.onerror = function () {
    URL.revokeObjectURL(url);
    downloadSVGFallback(svg);
  };
  img.src = url;
}

/* canvas 路线失败时退回直接给 SVG —— 至少用户拿到东西了，而不是一个报错 */
function downloadSVGFallback(svg) {
  download('cairn-milestone.svg', svg, 'image/svg+xml');
  toast(t('msShared'), 'accent');
}

/* ---------------------------------------------------------------------------
 * 输入事件
 * -------------------------------------------------------------------------*/
function onInput(e) {
  var el = e.target;
  var act = el.getAttribute && el.getAttribute('data-act');
  if (act === 'autogrow') { autoGrow(el); State.draftSource = el.value; }
  if (act === 'idea-grow') autoGrow(el);
  if (act === 'aikey') { State.settings.aiKey = el.value.trim(); saveState(); }
  if (act === 'aibase') { State.settings.aiBase = el.value.trim(); saveState(); }
  if (act === 'aimodel') { State.settings.aiModel = el.value.trim(); saveState(); }
}

function onChange(e) {
  var el = e.target;
  var act = el.getAttribute && el.getAttribute('data-act');

  if (act === 'setting') {
    var map = {
      'set-theme': 'theme',
      'set-density': 'density',
      'set-motion': 'motion',
      /* v2 新增两项 */
      'set-reflow': 'autoReflow',
      'set-calibrate': 'calibrate'
    };
    var key = map[el.id];
    if (!key) return;
    if (key === 'theme') State.settings.theme = el.checked ? 'dim' : 'light';
    if (key === 'density') State.settings.density = el.checked ? 'compact' : 'normal';
    if (key === 'motion') State.settings.motion = el.checked ? 'reduced' : 'full';
    if (key === 'autoReflow') State.settings.autoReflow = el.checked;
    if (key === 'calibrate') State.settings.calibrate = el.checked;
    saveState(true); render();
  }

  if (act === 'num') {
    var k = el.getAttribute('data-key');
    var v = parseInt(el.value, 10);
    /* weeklyQuota 的取值范围是 1~7，其余时长类字段上限 180。
     * 早期这里对所有字段用同一个上限，导致每周目标天数可以填 100。 */
    var max = k === 'weeklyQuota' ? 7 : 180;
    if (isFinite(v) && v > 0 && v <= max) {
      State.settings[k] = v;
      if (k === 'focusLen' && !State.focus.running) {
        State.focus.total = v * 60; State.focus.remaining = v * 60;
      }
      saveState(true);
      if (k === 'weeklyQuota') render();   /* 配额变了，进度徽标要立刻更新 */
    }
  }

  if (act === 'focus-pick') {
    if (State.focus.running || State.focus.remaining > 0) { render(); return; }
    State.focus.stepId = null;
    var id = el.value;
    if (id) {
      var tk = findTask(id);
      State.focus.taskId = id;
      State.focus.label = tk ? tk.title : '';
    } else {
      State.focus.taskId = null; State.focus.label = '';
    }
    saveState();
  }

  if (el.id === 'import-file' && el.files && el.files[0]) importJSON(el.files[0]);
}

/* 回车直接拆解；Shift+Enter 换行。这是最高频的动作，必须顺手。 */
function onKeyDown(e) {
  if (e.isComposing || e.keyCode === 229) return;
  if (State.ui.modal) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    if (e.key === 'Tab') {
      var nodes = Array.prototype.slice.call(document.querySelectorAll('.modal button:not([disabled]), .modal input:not([disabled]), .modal select, .modal textarea, .modal [tabindex="0"]'));
      if (nodes.length) {
        var first = nodes[0], last = nodes[nodes.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'big-input') {
    e.preventDefault();
    doDecompose();
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'idea-input') {
    e.preventDefault();
    var iin = $('#idea-input');
    if (iin && iin.value.trim()) { addIdea(iin.value.trim()); iin.value = ''; render(); toast(t('ideasAdd'), 'accent'); }
    return;
  }

  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;

  /* 引导期间只允许 Enter 推进，其他快捷键一律屏蔽 ——
   * 新用户还没理解产品就被跳到别的页面是纯粹的伤害。 */
  if (State.view === 'onboarding') {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (State.onboardStep < 2) { State.onboardStep++; render(); }
      else if (State.draftSteps) finishOnboarding(true);
    }
    if (e.key === 'Escape') finishOnboarding(false);
    return;
  }

  if (typing) return;

  /* v2：进度页插在"当前"之后，所以后面几个键位整体后移一位 */
  if (e.key === '1') goto('breakdown');
  if (e.key === '2') goto('now');
  if (e.key === '3') goto('progress');
  if (e.key === '4') goto('timeline');
  if (e.key === '5') goto('focus');
  if (e.key === '6') goto('ideas');
  if (e.key === ' ') {
    e.preventDefault();
    if (State.view !== 'focus') goto('focus');
    else if (State.focus.running) pauseFocus(); else startFocus();
  }
  if (e.key === 'Escape') {
    if (State.ui.modal) closeModal();
    else if (State.view !== 'breakdown') goto('breakdown');
  }
}

/* ---------------------------------------------------------------------------
 * 导航与任务游标
 * -------------------------------------------------------------------------*/
function goto(view) {
  if (!VIEWS[view]) view = 'breakdown';
  State.view = view;
  if (view === 'now') State.focusIdx = Math.min(State.focusIdx < 0 ? 0 : State.focusIdx, Math.max(0, todayTasks().length - 1));
  render();
  window.scrollTo({ top: 0, behavior: State.settings.motion === 'reduced' ? 'auto' : 'smooth' });
}

function moveTaskCursor(delta) {
  var n = todayTasks().length;
  if (!n) { render(); return; }
  State.focusIdx = ((State.focusIdx < 0 ? 0 : State.focusIdx) + delta + n) % n;
  render();
}

function selectTaskById(id) {
  var list = todayTasks();
  list.forEach(function (tk, i) { if (tk.id === id) State.focusIdx = i; });
  saveState();
}

/* 把拆解结果变成一条正式任务 */
function draftToTask() {
  var d = State.draftSteps;
  var task = makeTask(State.draftSource || t('navNow'), {
    engine: d.engine,
    steps: d.steps.map(function (s) {
      return { title: s.title, minutes: s.minutes, energy: s.energy, source: d.engine };
    })
  });
  /* 任务整体能量 = 第一步需要的能量，帮助用户挑"现在能做的那条" */
  if (d.steps.length) task.energy = d.steps[0].energy;
  task.estimateMin = d.steps.reduce(function (a, s) { return a + s.minutes; }, 0);
  return task;
}

/* ---------------------------------------------------------------------------
 * 拆解执行
 * -------------------------------------------------------------------------*/
var _decomposing = false;
async function doDecompose() {
  if (_decomposing) return;
  var ta = $('#big-input');
  var text = ta ? ta.value.trim() : (State.draftSource || '').trim();
  if (!text) {
    if (ta) ta.focus();
    toast(t('inputPlaceholder'));
    return;
  }
  _decomposing = true;
  State.draftSource = text;

  /* 明确的等待反馈：禁用按钮 + 文案，不用转圈动画（动效克制） */
  var btn = document.querySelector('[data-act="decompose"]');
  if (btn) { btn.disabled = true; btn.innerHTML = BRAND.icon('layers', 17) + (State.settings.lang === 'en' ? 'Working…' : '拆解中…'); }

  try {
    var result = await decompose(text, State.settings.lastEngine);
    State.draftSteps = result;
    saveState();
    render();
    /* 结果出来后把焦点留在结果区，键盘用户可以立刻 Tab 到按钮 */
    var first = document.querySelector('[data-act="draft-start"]');
    if (first) first.focus();
  } catch (err) {
    console.error(err);
    toast('拆解失败：' + (err && err.message ? err.message : '未知错误'));
  } finally {
    _decomposing = false;
  }
}

/* ---------------------------------------------------------------------------
 * 计时器
 * ---------------------------------------------------------------------------
 * 用时间戳计算剩余秒数，而不是每次减 1 —— 窗口失焦时浏览器会节流定时器，
 * 用累减会越走越慢。这里保证"哪怕标签页被挂起，回来也是对的"。
 * -------------------------------------------------------------------------*/
function startFocus() {
  var f = State.focus;
  if (!f.total) { f.total = State.settings.focusLen * 60; f.remaining = f.total; }
  if (!f.remaining) f.remaining = f.total;
  if (f.running) return;

  f.running = true;
  f.startedAt = Date.now();
  f.endsAt = Date.now() + f.remaining * 1000;
  /* v2：段首时间戳。用于算出"这一步实际花了多久"，供估时自学习。
   * 累加而不是覆盖，因为用户可能暂停过 —— 暂停的时间不算实际专注。 */
  if (!f.runStartedAt) f.runStartedAt = Date.now();
  logEvent('focus_start', { total: Math.round(f.total / 60), taskId: f.taskId });

  f.tick = setInterval(function () {
    var left = Math.max(0, Math.round((State.focus.endsAt - Date.now()) / 1000));
    State.focus.remaining = left;
    patchDial();
    if (left <= 0) completeFocus();
  }, 250);

  saveState(true);
  patchDial();
  patchFocusButtons();
}

function pauseFocus() {
  var f = State.focus;
  if (!f.running) return;
  f.remaining = Math.max(0, Math.ceil((f.endsAt - Date.now()) / 1000));
  f.running = false;
  clearInterval(f.tick); f.tick = null;
  /* 记录已经专注的部分：暂停不等于白干 */
  var elapsed = Math.round((f.total - f.remaining) / 60);
  logEvent('focus_pause', { elapsed: elapsed });
  /* v2：累计这一段的真实秒数。暂停时把这一段的时长并进 accumulatedSec，
   * 并把 runStartedAt 清掉，恢复时重新开始计。 */
  if (f.runStartedAt) {
    f.accumulatedSec = (f.accumulatedSec || 0) + Math.round((Date.now() - f.runStartedAt) / 1000);
    f.runStartedAt = null;
  }
  saveState(true);
  patchDial();
  patchFocusButtons();
}

/* 结束一段专注。elapsedMin 只在真的坐了一会儿（≥1 分钟）时才计入记录。 */
function stopFocus(ask) {
  var f = State.focus;
  if (!f.total) return;
  var elapsedMin = Math.round((f.total - f.remaining) / 60);
  var wasRunning = f.running;

  if (ask && wasRunning && f.remaining > 0) {
    confirmModal(t('focusStopConfirm'), '', function () { finishFocusRun(elapsedMin, false); }, t('btnStop'), t('btnResume'));
    return;
  }
  finishFocusRun(elapsedMin, false);
}

function completeFocus() {
  var f = State.focus;
  f.running = false;
  clearInterval(f.tick); f.tick = null;
  f.remaining = 0;
  patchDial();
  finishFocusRun(Math.round(f.total / 60), true);
}

function finishFocusRun(minutes, completed) {
  var f = State.focus;
  if (f.running) { clearInterval(f.tick); f.tick = null; }
  f.running = false;

  /* v2：把"实际坐了多久"记下来，供估时自学习使用。
   * 用 elapsedSeconds 而不是 minutes，因为 minutes 是四舍五入后的整数 ——
   * 一个 12 分钟的预估如果实际花了 12 分 20 秒，用分钟数会丢掉这个信息。 */
  var elapsedSec = Math.min(f.total, (f.accumulatedSec || 0) +
    (f.runStartedAt ? Math.max(0, Math.round((Math.min(Date.now(), f.endsAt || Date.now()) - f.runStartedAt) / 1000)) : 0));
  minutes = Math.floor(elapsedSec / 60);

  if (minutes >= 1) logSession(minutes, f.taskId, f.label, completed, f.stepId, elapsedSec);

  f.runStartedAt = null;
  f.accumulatedSec = null;

  if (completed) {
    /* 不用闹钟声、不用系统通知抢注意力，只给一个安静的结束卡片 */
    openModal({
      title: t('focusDone'),
      body: '<p class="text-sm text-ink-2">' +
              esc(t('focusDoneHint', { m: Math.round(f.total / 60) })) + '</p>',
      actions: [
        { label: t('focusAgain'), act: 'focus-again', primary: true },
        { label: t('focusFinish'), act: 'focus-finish' }
      ]
    });
    f.remaining = 0;
    saveState(true);
    render();
  } else {
    resetFocus();
    if (State.view === 'focus') render();
  }
}

function resetFocus() {
  var f = State.focus;
  if (f.tick) { clearInterval(f.tick); f.tick = null; }
  f.running = false;
  f.remaining = 0;
  f.total = State.settings.focusLen * 60;
  /* v2：把真实耗时相关的时间戳一并清掉，避免下一段把上一段的时长算进来 */
  f.runStartedAt = null;
  f.accumulatedSec = null;
  f.stepId = null;
  f.taskId = null; f.label = '';
  saveState(true);
  if (State.view === 'focus') render();
}

/* 只改动表盘那几个节点，绝不整页重渲染 —— 否则会打断用户正在做的事 */
function patchDial() {
  var f = State.focus;
  var timeEl = document.getElementById('dial-time');
  var fillEl = document.getElementById('dial-fill');
  var labelEl = document.getElementById('dial-label');
  if (!timeEl) return;
  var total = f.total || State.settings.focusLen * 60;
  var left = f.running || f.remaining ? f.remaining : total;
  timeEl.textContent = fmtTimer(left);
  if (fillEl) {
    var R = 108, C = 2 * Math.PI * R;
    var pct = total ? 1 - (left / total) : 0;
    fillEl.setAttribute('stroke-dashoffset', (C * (1 - pct)).toFixed(1));
  }
  if (labelEl) labelEl.textContent = f.running ? t('focusRunning') : (f.remaining ? t('btnPause') : t('focusBreath'));
  document.title = f.running ? fmtTimer(left) + ' · ' + t('brand') : t('brand') + ' · ' + t('focusTitle');
}

function patchFocusButtons() {
  if (State.view !== 'focus') return;
  var btns = document.querySelectorAll('[data-act="focus-toggle"]');
  Array.prototype.forEach.call(btns, function (b) {
    b.innerHTML = BRAND.icon(State.focus.running ? 'pause' : 'play', 17) +
      esc(State.focus.running ? t('btnPause') : (State.focus.remaining ? t('btnResume') : t('btnStart')));
  });
}

/* ---------------------------------------------------------------------------
 * 弹窗
 * -------------------------------------------------------------------------*/
var _modalReturnFocus = null;
function openModal(spec) {
  if (!State.ui.modal) _modalReturnFocus = document.activeElement;
  State.ui.modal = spec;
  paintModal();
  var first = document.querySelector('.modal input, .modal select, .modal textarea, .modal button');
  if (first) first.focus();
}

function closeModal() {
  State.ui.modal = null;
  var el = $('#modal-root');
  if (el) el.innerHTML = '';
  if (_modalReturnFocus && _modalReturnFocus.isConnected) _modalReturnFocus.focus();
  _modalReturnFocus = null;
}

function paintModal() {
  var root = $('#modal-root');
  if (!root) return;
  var m = State.ui.modal;
  if (!m) { root.innerHTML = ''; return; }

  /* 这里刻意不用内联 onclick="event.stopPropagation()"。
   * 内联处理器会改变事件委托拿到的 target，导致弹窗内的动作按钮点击落空
   * （点"保存""确定"没有任何反应，且不报错 —— 极难排查）。
   * 改为在 onClick 里判断 e.target 是否就是遮罩本身来决定关闭。 */
  root.innerHTML = '' +
  '<div class="modal-backdrop" data-act="modal-close">' +
    '<div class="modal p-6" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="flex items-start gap-3 mb-4">' +
        '<h2 id="modal-title" class="text-lg font-semibold flex-1">' + esc(m.title) + '</h2>' +
        '<button class="btn btn-icon-sm btn-ghost text-ink-3" data-act="modal-close" aria-label="' +
          esc(t('btnClose')) + '">' + BRAND.icon('x', 16) + '</button>' +
      '</div>' +
      (m.body || '') +
      (m.actions && m.actions.length ? '' +
        '<div class="flex items-center gap-2 mt-6 flex-wrap">' +
          m.actions.map(function (a) {
            return '<button class="btn ' + (a.primary ? 'btn-primary' : 'btn-outline') + '"' +
              ' data-act="' + a.act + '">' + esc(a.label) + '</button>';
          }).join('') +
        '</div>'
        : '') +
    '</div>' +
  '</div>';
}

function confirmModal(title, body, onYes, yesLabel, noLabel) {
  openModal({
    title: title,
    body: body ? '<p class="text-sm text-ink-2">' + esc(body) + '</p>' : '',
    actions: [
      { label: yesLabel || t('btnConfirm'), act: 'confirm-yes', primary: true },
      { label: noLabel || t('btnCancel'), act: 'modal-close' }
    ]
  });
  State.ui.modal.onYes = onYes;
}

/* ---------------------------------------------------------------------------
 * 时间块编辑

          '<div class="flex-1">' +

            '<select class="select" id="bl-start">' + timeOptions(start, TL_START, TL_END, 15) + '</select>' +
          '</div>' +
          '<div class="flex-1">' +

          '</div>' +
