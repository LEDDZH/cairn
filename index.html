            '<button data-v="" aria-pressed="' + (!block || !block.energy ? 'true' : 'false') + '">' + esc(t('energyNone')) + '</button>' +
            '<button data-v="high" aria-pressed="' + (block && block.energy === 'high' ? 'true' : 'false') + '">' + esc(t('energyHigh')) + '</button>' +
            '<button data-v="low" aria-pressed="' + (block && block.energy === 'low' ? 'true' : 'false') + '">' + esc(t('energyLow')) + '</button>' +
          '</div>' +
        '</div>' +
        '<div id="bl-conflict" class="text-xs" style="color:var(--amber)"></div>' +
      '</div>',
    actions: block
      ? [{ label: t('btnSave'), act: 'block-save', primary: true },
         { label: t('btnDelete'), act: 'block-del', primary: false },
         { label: t('btnCancel'), act: 'modal-close' }]
      : [{ label: t('btnAdd'), act: 'block-save', primary: true },
         { label: t('btnCancel'), act: 'modal-close' }]
  });
  State.ui.modal.editingId = block ? block.id : null;

  /* 能量分段控件的本地交互 */
  var seg = $('#bl-energy');
  if (seg) {
    seg.addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (!b) return;
      $$('button', seg).forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
    });
  }

  /* 实时检查时间冲突，让"重叠"在保存前就看得见 */
  var check = function () {
    var s = parseInt($('#bl-start').value, 10);
    var d = parseInt($('#bl-dur').value, 10);
    var tmp = { id: State.ui.modal.editingId || 'tmp', start: s, dur: d };
    var ov = findOverlaps(tmp, tmp.id);
    $('#bl-conflict').textContent = ov.length
      ? t('timelineConflict') + '：' + ov.map(function (b) { return fmtClock(b.start) + ' ' + b.title; }).join('、')
      : '';
  };
  $('#bl-start').addEventListener('change', check);
  $('#bl-dur').addEventListener('change', check);
  check();

  if (!block) { var ti = $('#bl-title'); if (ti) ti.focus(); }
}

function timeOptions(sel, from, to, step) {
  var out = '';
  for (var m = from; m <= to; m += step) {
    out += '<option value="' + m + '"' + (m === sel ? ' selected' : '') + '>' + fmtClock(m) + '</option>';
  }
  return out;
}

function durOptions(sel) {
  var list = [5, 10, 15, 20, 25, 30, 45, 60, 90, 120];
  return list.map(function (d) {
    return '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + fmtDuration(d) + '</option>';
  }).join('');
}

function saveBlockFromModal() {
  var title = ($('#bl-title') || {}).value || '';
  var start = parseInt(($('#bl-start') || {}).value, 10);
  var dur = parseInt(($('#bl-dur') || {}).value, 10);
  var energyBtn = $('#bl-energy button[aria-pressed="true"]');
  var energy = energyBtn ? (energyBtn.getAttribute('data-v') || null) : null;
  var editingId = State.ui.modal && State.ui.modal.editingId;

  var block = null;
  if (editingId) State.blocks.forEach(function (b) { if (b.id === editingId) block = b; });

  if (block) {
    block.title = title.trim() || block.title;
    block.start = start; block.dur = dur; block.energy = energy;
    logEvent('block_edit', { start: start, dur: dur });
  } else {
    block = makeBlock(start, dur, title, { energy: energy });
    State.blocks.push(block);
    logEvent('block_add', { start: start, dur: dur });
  }
  saveState(true);
  closeModal();
  render();
  toast(t('saved'), 'accent');
}

/* ---------------------------------------------------------------------------
 * 自定义专注时长
 * -------------------------------------------------------------------------*/
function openFocusCustomModal() {
  openModal({
    title: t('focusCustom'),
    body: '' +
      '<label class="block text-xs text-ink-3 mb-1" for="fc-min">' + esc(t('settingsFocusLen')) + '</label>' +
      '<input type="number" class="input" id="fc-min" min="1" max="180" value="' + State.settings.focusLen + '">',
    actions: [{ label: t('btnConfirm'), act: 'focus-custom-save', primary: true },
              { label: t('btnCancel'), act: 'modal-close' }]
  });
}

function saveFocusCustom() {
  var v = parseInt(($('#fc-min') || {}).value, 10);
  if (isFinite(v) && v > 0 && v <= 180) {
    State.settings.focusLen = v;
    State.focus.total = v * 60;
    State.focus.remaining = v * 60;
    saveState(true);
  }
  closeModal();
  render();
}

/* ---------------------------------------------------------------------------
 * AI 连接测试
 * -------------------------------------------------------------------------*/
async function testAIConnection() {
  var keyEl = $('#ai-key');
  if (keyEl) { State.settings.aiKey = keyEl.value.trim(); saveState(true); }
  if (!State.settings.aiKey) { toast(t('settingsAITestNoKey')); return; }

  toast(State.settings.lang === 'en' ? 'Testing…' : '正在测试…');
  var r = await decomposeAI('测试：写一份两页的课程报告', State.settings.lang);
  if (r.ok) {
    toast(t('settingsAITestOk'), 'accent');
    State.settings.lastEngine = 'ai';
    saveState(true);
    render();
  } else {
    toast(t('settingsAITestFail', { msg: r.reason || 'unknown' }));
  }
}

/* ---------------------------------------------------------------------------
 * 导入 / 导出
 * -------------------------------------------------------------------------*/
function download(filename, content, mime) {
  try {
    var blob = new Blob([content], { type: mime || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    logEvent('export', { file: filename });
  } catch (e) {
    toast('导出失败：' + (e && e.message ? e.message : '未知错误'));
  }
}

function stamp() {
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
}

function backupData() {
  var settings = Object.assign({}, State.settings);
  delete settings.aiKey;
  return { v: DATA_VERSION, app: 'Cairn', exportedAt: new Date().toISOString(),
    settings: settings, tasks: State.tasks, blocks: State.blocks,
    sessions: State.sessions, ideas: State.ideas, events: State.events, stats: State.stats };
}
function exportJSON() {
  download('cairn-backup-' + stamp() + '.json', JSON.stringify(backupData(), null, 2), 'application/json');
  toast(State.settings.lang === 'en' ? 'Backup saved. API key excluded.' : '备份已导出，不含 API Key。', 'accent');
}

/* Validate the entire payload before changing live state. Accept legacy Cairn v1 backups. */
function validateBackup(data) {
  function object(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function need(ok) { if (!ok) throw new Error('Invalid backup'); }
  function text(v) { return typeof v === 'string' && v.length <= 20000; }
  function num(v) { return typeof v === 'number' && isFinite(v) && v >= 0; }
  function safeId(v) { return typeof v === 'string' && /^[a-zA-Z0-9_.:-]{1,160}$/.test(v); }
  need(object(data) && (data.v === 1 || data.v === 2) && (!data.app || data.app === 'Cairn'));
  ['tasks','blocks','sessions','ideas','events'].forEach(function(k) { need(Array.isArray(data[k]) && data[k].length <= 20000); });
  need(!data.settings || object(data.settings));
  var ids = new Set();
  data.tasks.forEach(function(tk) {
    need(object(tk) && safeId(tk.id) && !ids.has(tk.id) && text(tk.title) && text(tk.createdAt) && isFinite(Date.parse(tk.createdAt)) && Array.isArray(tk.steps)); ids.add(tk.id);
    need(tk.steps.length <= 1000 && (tk.estimateMin == null || num(tk.estimateMin)));
    var steps = new Set();
    tk.steps.forEach(function(st) { need(object(st) && safeId(st.id) && !steps.has(st.id) && text(st.title) && num(st.minutes) && st.minutes > 0 && st.minutes <= 180); steps.add(st.id); });
  });
  data.blocks.forEach(function(b) { need(object(b) && safeId(b.id) && text(b.title) && text(b.date) && num(b.start) && b.start < 1440 && num(b.dur) && b.dur > 0 && b.dur <= 1440); });
  data.sessions.forEach(function(s) { need(object(s) && text(s.date) && num(s.minutes)); });
  data.ideas.forEach(function(i) { need(object(i) && safeId(i.id) && text(i.text)); });
  data.events.forEach(function(e) { need(object(e) && text(e.t) && isFinite(Date.parse(e.t)) && text(e.type) && (!e.data || object(e.data))); });
  var settings = Object.assign(defaultSettings(), data.settings || {});
  settings.aiKey = State.settings.aiKey; // imports never change credentials
  settings.lang = settings.lang === 'en' ? 'en' : 'zh';
  ['focusLen','breakLen','weeklyQuota'].forEach(function(k) { need(num(settings[k]) && settings[k] >= 1 && settings[k] <= (k === 'weeklyQuota' ? 7 : 180)); });
  if (data.stats != null) {
    var st = data.stats;
    need(object(st) && object(st.total) && object(st.days) && (!st.calib || object(st.calib)) && (!st.weeks || object(st.weeks)) && (!st.milestones || Array.isArray(st.milestones)));
    [st.total].concat(Object.values(st.days)).forEach(function(d) { need(object(d) && num(d.steps) && num(d.tasks) && num(d.focusMin)); });
    Object.values(st.calib || {}).forEach(function(c) { need(object(c) && num(c.est) && num(c.act) && num(c.n)); });
    (st.milestones || []).forEach(function(m) { need(text(m)); });
  }
  return Object.assign({}, data, { settings: settings });
}
function importJSON(file) {
  if (State.focus.running || State.focus.remaining > 0) { toast(State.settings.lang === 'en' ? 'Finish or reset your focus session before importing.' : '请先结束或重置当前专注，再导入备份。'); return; }
  if (!file || file.size > 10 * 1024 * 1024) { toast('备份过大（上限 10 MB）。'); return; }
  var reader = new FileReader();
  reader.onerror = function() { toast('无法读取备份，请重试。'); };
  reader.onload = function () {
    try {
      var data = validateBackup(JSON.parse(reader.result));
      confirmModal(State.settings.lang === 'en' ? 'Replace local data?' : '用备份替换本机数据？',
        State.settings.lang === 'en' ? 'This replaces tasks and history. Export a backup first if needed.' : '这会替换现有任务与历史记录。如需保留，请取消并先导出备份。', function() {
          // Persist first: a quota error must leave both current memory and disk untouched.
          var st = data.stats;
          if (!st) {
            var oldTasks = State.tasks, oldSessions = State.sessions;
            State.tasks = data.tasks; State.sessions = data.sessions;
            try { st = migrateStats(null, data.v); } finally { State.tasks = oldTasks; State.sessions = oldSessions; }
          }
          var next = Object.assign({}, data, { stats: st, v: DATA_VERSION, focusCheckpoint: null });
          try { localStorage.setItem(STORE_KEY, JSON.stringify(next)); }
          catch(e) { toast('无法保存导入数据，现有数据已保留。', 'warn'); return; }
          State.settings = data.settings;
          ['tasks','blocks','sessions','ideas','events'].forEach(function(k) { State[k] = data[k]; });
          State.stats = migrateStats(st, data.v); State.focusIdx = -1;
          State.draftSteps = null; State.draftSource = ''; State.milestone = null;
          State.welcomeBack = null;
          saveState(true); applySettings(); render();
          toast(t('settingsImportJSON') + ' · ' + t('saved'), 'accent');
        });
    } catch (e) { toast(State.settings.lang === 'en' ? 'Invalid backup. Your data has not changed.' : '备份格式不正确，现有数据未改变。'); }
  };
  reader.readAsText(file);
}

/* 评估数据导出：
 * 每行一个事件（便于统计），末尾附一段人类可读的汇总（便于直接写进报告）。 */
function exportCSV() {
  var rows = [['timestamp', 'date', 'event', 'detail']];
  State.events.forEach(function (ev) {
    rows.push([
      ev.t,
      ev.t.slice(0, 10),
      ev.type,
      JSON.stringify(ev.data || {}).replace(/"/g, "'")
    ]);
  });

  /* 汇总指标 */
  var bdStart = State.events.filter(function (e) { return e.type === 'breakdown_start'; }).length;
  var bdDone = State.events.filter(function (e) { return e.type === 'breakdown_done'; });
  var bdMs = bdDone.map(function (e) { return e.data.ms; }).filter(function (v) { return typeof v === 'number'; });
  var avg = bdMs.length ? Math.round(bdMs.reduce(function (a, b) { return a + b; }, 0) / bdMs.length) : 0;
  var stepsTotal = State.events.filter(function (e) { return e.type === 'step_done'; }).length;
  var tasksDone = State.events.filter(function (e) { return e.type === 'task_done'; }).length;
  var focusMin = State.sessions.reduce(function (a, s) { return a + s.minutes; }, 0);

  rows.push([]);
  rows.push(['--- SUMMARY ---']);
  rows.push(['breakdown_requests', bdStart]);
  rows.push(['breakdown_success', bdDone.length]);
  rows.push(['breakdown_success_rate', bdStart ? (bdDone.length / bdStart * 100).toFixed(1) + '%' : 'n/a']);
  rows.push(['avg_breakdown_ms', avg]);
  rows.push(['steps_completed', stepsTotal]);
  rows.push(['tasks_completed', tasksDone]);
  rows.push(['focus_minutes_total', focusMin]);
  rows.push(['unique_days', new Set(State.events.map(function (e) { return e.t.slice(0, 10); })).size]);

  var csv = '\ufeff' + rows.map(function (r) {
    return r.map(function (c) {
      var s = String(c === undefined || c === null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');

  download('cairn-evaluation-' + stamp() + '.csv', csv, 'text/csv;charset=utf-8');
  toast(t('settingsExportCSV') + ' · ' + t('saved'), 'accent');
}

/* ---------------------------------------------------------------------------
 * 设置应用与语言切换
 * -------------------------------------------------------------------------*/
function applySettings() {
  var s = State.settings;
  if (!State.focus.running && !State.focus.remaining) {
    State.focus.total = s.focusLen * 60;
  }
}

function setLang(lang) {
  State.settings.lang = lang === 'en' ? 'en' : 'zh';
  saveState(true);
  render();
}

/* ---------------------------------------------------------------------------
 * 启动
 * -------------------------------------------------------------------------*/
function boot() {
  var had = loadState();

  /* v2：无论数据从哪来，先保证统计层存在 */
  ensureStats();

  /* 支持用 URL 参数做确定性截图与演示：?view=now&lang=en&demo=1&theme=dim */
  var q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }

  if (q && q.get('lang')) State.settings.lang = q.get('lang') === 'en' ? 'en' : 'zh';
  if (q && q.get('theme')) State.settings.theme = q.get('theme') === 'dim' ? 'dim' : 'light';
  /* ?onboard=0 可以跳过引导，方便截图与自动化测试拿到确定的状态 */
  if (q && q.get('onboard') === '0') State.settings.onboarded = true;

  /* 首次打开自动铺一份示例数据：课堂演示时屏幕上不会是空的 */
  if (q && q.get('demo') === '1') loadSampleData();
  /* Real first runs start empty; demonstration data requires an explicit choice. */

  /* v2：决定首屏落在哪里。
   *   全新用户      → 首次引导（P0-4）
   *   离开 ≥2 天     → 拆解页 + 欢迎回来卡片（P0-1）
   *   正常打开      → 拆解页
   * 顺序很重要：引导优先于欢迎回来，因为新用户不该同时面对两件事。 */
  var firstRun = !had || !State.settings.onboarded;
  if (firstRun && !(q && q.get('onboard') === '0')) {
    State.view = 'onboarding';
    State.onboardStep = 0;
  } else {
    State.welcomeBack = computeWelcomeBack();
    State.view = 'breakdown';
  }

  if (q && q.get('view') && VIEWS[q.get('view')]) State.view = q.get('view');

  applySettings();
  if (State.focus.remaining > 0 && State.settings.onboarded && !(q && q.get('view'))) State.view = 'focus';
  render();
  if (State.focus.remaining > 0) toast(State.settings.lang === 'en' ? 'Session restored and paused. Continue when ready.' : '专注已恢复并暂停，准备好再继续。');
  setInterval(function() { if (State.focus.running) saveState(true); }, 5000);
  document.addEventListener('visibilitychange', function() { if (document.hidden) saveState(true); });

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKeyDown);

  /* v2.1：手机端与 PWA。
   * initPWA 会注册 Service Worker 并接管安装提示；
   * applyStandaloneTweaks 在"已装到桌面"时给 html 打标记供 CSS 用。
   * 两者都在 file:// 下静默跳过，不影响桌面双击使用。 */
  applyStandaloneTweaks();
  initPWA();
  initTouchTweaks();

  /* 手机端：地址栏显示/隐藏会改变视口高度，重新定位底部导航不受影响（它是 fixed），
   * 但引导页的垂直居中依赖 vh/dvh，需要重算一次。 */
  window.addEventListener('resize', function () {
    if (State.view === 'onboarding') {
      var m = $('#view');
      if (m) m.style.minHeight = '';     /* 交给 CSS 的 dvh 处理 */
    }
  });

  /* 每 30 秒刷新"现在"时刻线；只在时间线视图里动 DOM */
  setInterval(function () {
    if (State.view !== 'timeline') return;
    var line = document.querySelector('.tl-nowline');
    if (!line) return;
    var now = nowMinOfDay();
    line.style.top = ((now - TL_START) * PX_PER_MIN) + 'px';
    var lbl = line.querySelector('span');
    if (lbl) lbl.textContent = t('timelineNow') + ' ' + fmtClock(now);
  }, 30000);

  /* v2：离开页面时记下"最后见到的时间"。
   * 用 pagehide 而不是 unload —— 后者在移动端与 bfcache 下不可靠。 */
  window.addEventListener('pagehide', function () {
    if (State.settings.onboarded) markSeen();
    else saveState(true);
  });
  /* 桌面应用关窗时也要落一次 */
  window.addEventListener('beforeunload', function () { saveState(true); });

  /* 暴露给自动化测试与课堂演示用 */
  window.Cairn = {
    state: State,
    version: APP_VERSION,
    sample: loadSampleData,
    export: exportJSON,
    goto: goto,
    saveNow: function () { saveState(true); }
  };
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

function focusCheckpoint() {
  var f = State.focus;
  if (!(f.remaining > 0) || !f.total) return null;
  var remaining = f.running ? Math.max(0, Math.ceil((f.endsAt - Date.now()) / 1000)) : f.remaining;
  var elapsed = Math.min(f.total, (f.accumulatedSec || 0) + (f.running && f.runStartedAt ? Math.max(0, Math.round((Math.min(Date.now(), f.endsAt) - f.runStartedAt) / 1000)) : 0));
  return { total: f.total, remaining: remaining, accumulatedSec: elapsed, taskId: f.taskId, stepId: f.stepId, label: f.label, savedAt: Date.now() };
}
function restoreFocus(c) {
  if (!c || !Number.isFinite(c.total) || c.total <= 0 || c.total > 10800 || !Number.isFinite(c.remaining) || c.remaining < 0 || c.remaining > c.total || !Number.isFinite(c.accumulatedSec) || c.accumulatedSec < 0) return;
  var f = State.focus;
  f.total = c.total; f.remaining = c.remaining; f.accumulatedSec = Math.min(c.total, c.accumulatedSec);
  f.taskId = c.taskId; f.stepId = c.stepId; f.label = typeof c.label === 'string' ? c.label : '';
  f.running = false; f.runStartedAt = null;
}

</script>
